gcode:
    SAVE_GCODE_STATE NAME=BEFORE_CLEAN
    G91
    G0 X10 F12000       ; move to nozzle brush
    G0 Y50 F12000       ; move to nozzle brush
    G0 X-20 F12000       ; move to nozzle brush
    G0 Y-50 F12000       ; move to nozzle brush
    G0 X20 F12000       ; move to nozzle brush
    G0 Y50 F12000       ; move to nozzle brush
    G0 X-20 F12000       ; move to nozzle brush
    G0 Y-50 F12000       ; move to nozzle brush
    G0 X20 F12000       ; move to nozzle brush
    G0 Y50 F12000       ; move to nozzle brush
    G0 X-10 F12000       ; move to nozzle brush
    G0 Y-50 F12000       ; move to nozzle brush
    G90
    RESTORE_GCODE_STATE NAME=BEFORE_CLEAN


[gcode_macro PURGE]
gcode:
    SAVE_GCODE_STATE NAME=PURGE_state
    G91                 ; relative positioning
    {% for i in range(2) %}
        G1 E10 F500      ; extrude a little more
    {% endfor %}
    RESTORE_GCODE_STATE name=PURGE_state

[gcode_macro BEDMESHPROCEDURE]
gcode:
        BED_MESH_CLEAR
    G32
    BED_MESH_CALIBRATE
    BED_MESH_PROFILE SAVE={printer.heater_bed.target}C
    SAVE_CONFIG

[gcode_macro BEDMESHLOAD]
gcode:

    BED_MESH_PROFILE LOAD={printer.heater_bed.target}C

[gcode_macro TEMPADJUSTPA]
gcode:
    #ABS
    {% if printer.heater_bed.target >= 100 %}
        SET_PRESSURE_ADVANCE ADVANCE=0.0435
    {% endif %}
    #PETG
    {% if printer.heater_bed.target > 80 and printer.heater_bed.target < 100 %}
        SET_PRESSURE_ADVANCE ADVANCE=0.05
    {% endif %}
    #PLA
    {% if printer.heater_bed.target <= 80 and printer.heater_bed.target > 60 %}
        SET_PRESSURE_ADVANCE ADVANCE=0.06
    {% endif %}
    {% if printer.heater_bed.target <= 60 %}
        SET_PRESSURE_ADVANCE ADVANCE=0.0
    {% endif %}

[gcode_macro TEMPADJUSTOFFSET]
gcode:
    #ABS
    {% if printer.heater_bed.target >= 100 %}
        SET_GCODE_OFFSET Z=0 MOVE=1
        SET_GCODE_OFFSET Z_ADJUST=0.0 MOVE=1
    {% endif %}
    #PETG
    {% if printer.heater_bed.target > 80 and printer.heater_bed.target < 100 %}
        SET_GCODE_OFFSET Z=0 MOVE=1
        SET_GCODE_OFFSET Z_ADJUST=-0.0 MOVE=1
    {% endif %}
    #PLA
     {% if printer.heater_bed.target <= 80 and printer.heater_bed.target > 60 %}
        SET_GCODE_OFFSET Z=0 MOVE=1
        SET_GCODE_OFFSET Z_ADJUST=0.02 MOVE=1
    {% endif %}

[gcode_macro ZTA]
gcode:
    Z_TILT_ADJUST


[gcode_macro CANCEL_PRINT]
rename_existing: BASE_CANCEL_PRINT
gcode:
    TURN_OFF_HEATERS

    CLEAR_PAUSE
    SDCARD_RESET_FILE
    BASE_CANCEL_PRINT
    RESET_PRINT_STATUS
    #SET_FAN_SPEED FAN=driver_fan SPEED=0
    M106 S0
    PRINT_END
    RESET_TOOLCHANGER

[gcode_macro M600]
    gcode:
     PAUSE

# =============================================================================
# ENDSTOP ACCURACY TEST - Recursive macro approach
# Works because each G28 is a top-level command (no nesting)
# =============================================================================
[gcode_macro ENDSTOP_ACCURACY]
description: Test endstop repeatability - ENDSTOP_ACCURACY AXIS=X SAMPLES=5
variable_axis: "X"
variable_samples: 5
variable_retract: 10
variable_count: 0
variable_results: ""
variable_running: 0
gcode:
    {% set ea = printer["gcode_macro ENDSTOP_ACCURACY"] %}

    # Check if this is a fresh start or continuation
    {% if ea.running == 0 %}
        # Fresh start - initialize from parameters
        {% set axis_param = params.AXIS|default("X")|upper %}
        {% set samples_param = params.SAMPLES|default(5)|int %}
        {% set retract_param = params.RETRACT|default(10)|float %}

        SET_GCODE_VARIABLE MACRO=ENDSTOP_ACCURACY VARIABLE=axis VALUE="'{axis_param}'"
        SET_GCODE_VARIABLE MACRO=ENDSTOP_ACCURACY VARIABLE=samples VALUE={samples_param}
        SET_GCODE_VARIABLE MACRO=ENDSTOP_ACCURACY VARIABLE=retract VALUE={retract_param}
        SET_GCODE_VARIABLE MACRO=ENDSTOP_ACCURACY VARIABLE=count VALUE=0
        SET_GCODE_VARIABLE MACRO=ENDSTOP_ACCURACY VARIABLE=results VALUE="''"
        SET_GCODE_VARIABLE MACRO=ENDSTOP_ACCURACY VARIABLE=running VALUE=1

        RESPOND MSG="ENDSTOP_ACCURACY: Testing {axis_param} axis"
        RESPOND MSG="Samples: {samples_param}, Retract: {retract_param}mm"
        RESPOND MSG=""

        # Do first sample
        _ENDSTOP_ACCURACY_SAMPLE
    {% else %}
        # Continuation - do next sample
        _ENDSTOP_ACCURACY_SAMPLE
    {% endif %}

[gcode_macro _ENDSTOP_ACCURACY_SAMPLE]
gcode:
    {% set ea = printer["gcode_macro ENDSTOP_ACCURACY"] %}
    {% set axis = ea.axis %}
    {% set samples = ea.samples %}
    {% set retract = ea.retract %}
    {% set count = ea.count %}
    {% set results = ea.results %}

    {% if count < samples %}
        {% set axis_idx = 0 if axis == 'X' else (1 if axis == 'Y' else 2) %}

        # Move away from endstop first
        {% set current_pos = printer.toolhead.position[axis_idx] %}
        G90
        G1 {axis}{current_pos + retract} F3000
        M400

        # Home (this is a top-level G-code command - allowed!)
        G28 {axis}
        M400

        # Record position (will be position_endstop, but tests homing repeatability)
        {% set new_pos = printer.toolhead.position[axis_idx] %}
        {% set new_results = results ~ new_pos|round(4)|string ~ "," %}

        SET_GCODE_VARIABLE MACRO=ENDSTOP_ACCURACY VARIABLE=results VALUE="'{new_results}'"
        SET_GCODE_VARIABLE MACRO=ENDSTOP_ACCURACY VARIABLE=count VALUE={count + 1}

        RESPOND MSG="Sample {count + 1}/{samples}: {axis} = {new_pos|round(4)}mm"

        # Schedule next sample via delayed_gcode (breaks the call chain)
        UPDATE_DELAYED_GCODE ID=_endstop_accuracy_next DURATION=0.5
    {% else %}
        # Done - report results
        _ENDSTOP_ACCURACY_REPORT
        SET_GCODE_VARIABLE MACRO=ENDSTOP_ACCURACY VARIABLE=running VALUE=0
    {% endif %}

[delayed_gcode _endstop_accuracy_next]
initial_duration: 0
gcode:
    {% set ea = printer["gcode_macro ENDSTOP_ACCURACY"] %}
    {% if ea.running == 1 %}
        ENDSTOP_ACCURACY
    {% endif %}

[gcode_macro _ENDSTOP_ACCURACY_REPORT]
gcode:
    {% set ea = printer["gcode_macro ENDSTOP_ACCURACY"] %}
    {% set axis = ea.axis %}
    {% set results_str = ea.results %}

    {% set values = results_str.rstrip(',').split(',') %}
    {% set floats = [] %}
    {% for v in values %}
        {% if v %}
            {% set _ = floats.append(v|float) %}
        {% endif %}
    {% endfor %}

    {% if floats|length > 1 %}
        {% set min_val = floats|min %}
        {% set max_val = floats|max %}
        {% set range_val = max_val - min_val %}
        {% set avg = floats|sum / floats|length %}

        RESPOND MSG=""
        RESPOND MSG="=================================================="
        RESPOND MSG="{axis} ENDSTOP ACCURACY RESULTS"
        RESPOND MSG="=================================================="
        RESPOND MSG="Samples: {floats|length}"
        RESPOND MSG="Values: {results_str.rstrip(',')}"
        RESPOND MSG="Min: {min_val|round(4)}mm  Max: {max_val|round(4)}mm"
        RESPOND MSG="Range: {range_val|round(4)}mm"
        RESPOND MSG="Average: {avg|round(4)}mm"
        RESPOND MSG=""
        {% if range_val <= 0.0025 %}
            RESPOND MSG="Result: EXCELLENT (range <= 0.0025mm)"
        {% elif range_val <= 0.01 %}
            RESPOND MSG="Result: GOOD (range <= 0.01mm)"
        {% elif range_val <= 0.025 %}
            RESPOND MSG="Result: ACCEPTABLE (range <= 0.025mm)"
        {% else %}
            RESPOND MSG="Result: POOR (range > 0.025mm)"
        {% endif %}
        RESPOND MSG="=================================================="
    {% else %}
        RESPOND MSG="ERROR: Not enough samples"
    {% endif %}

[gcode_macro ENDSTOP_ACCURACY_ABORT]
description: Stop running endstop accuracy test
gcode:
    SET_GCODE_VARIABLE MACRO=ENDSTOP_ACCURACY VARIABLE=running VALUE=0
    UPDATE_DELAYED_GCODE ID=_endstop_accuracy_next DURATION=0
    RESPOND MSG="ENDSTOP_ACCURACY aborted"

