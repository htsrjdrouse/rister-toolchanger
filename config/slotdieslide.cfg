#=============================================================================
# slotdieslide.cfg   v2
#
# Slot die coating of the QD and AgNW layers on device slides. Independent of
# conductiveslide.cfg: its own parameter table, its own stored origins, its
# own help. Nothing is shared but the bed.
#
#   SLOTDIE_HELP            list every parameter, unit, default, current value
#   SLOTDIE_WHERE           report current toolhead position (read, don't store)
#   SET_COAT_ORIGIN         store an origin - X, Y and Z all REQUIRED
#   SLOTDIE_SET             change any default persistently
#   SLOTDIE_RESET_DEFAULTS  clear stored defaults back to built-in values
#   SLOTDIE_SETTINGS        print settings and compute sample volume for a run
#   SLOTDIE_PURGE           charge the die off substrate, into the waste vessel
#   SLOTDIE_PRIME           one coating pass on the priming slide
#   SLOTDIE_COAT            run one coating pass
#   SLOTDIE_START           queue SLOTDIE_COAT in the background, return at once
#
# PARAMETER RESOLUTION, in order:
#   1. value passed on the command line        SLOTDIE_COAT LAYER=QD FW=400
#   2. persistent default set via SLOTDIE_SET  SLOTDIE_SET FW=400
#   3. built-in default compiled below
#
# NAMING: PRM_ prefix is the priming SLIDE origin. PRIME_ prefix is the prime
# PASS itself. PRG_ prefix is the purge STATION origin. PURGE_ prefix is the
# purge DISPENSE itself. Same split as conductiveslide.cfg.
#
# STORAGE PREFIX: every saved variable here is sd_<key>. conductiveslide.cfg
# uses ag_<key>. The two files can be loaded together without collision, and
# each keeps its own device origin - the tools have different Z offsets, so a
# shared origin would be wrong anyway.
#
# Z NOTE: DEV_Z is the actual machine Z at which the die lip sits during a
# pass, in the same frame as ZPARK. The coating gap is baked into that number,
# measured on the machine. Nothing here computes it. The only check is that
# DEV_Z plus ZHOP stays below ZPARK.
#
# ZSAFE is separate and is about the rest of the bed, not the slide. ZHOP is a
# small lift for getting on and off a slide, 5 mm by default, which is fine as
# long as nothing between the stations is taller than the slide. The slot die
# dock is taller than the slide. Any traverse at DEV_Z plus ZHOP drives the
# die straight into it.
#
# So ZSAFE is an ABSOLUTE machine Z used for every XY traverse: on to the
# purge station, on to the priming slide, on to each device slide, and off
# again at the end of every pass. Set it above the tallest thing the die has
# to cross.
#
#   SLOTDIE_SET ZSAFE=120
#
# ZSAFE 0, the built-in default, keeps the old behaviour of hopping to the
# coating Z plus ZHOP. It is guarded both ways: ZSAFE above ZPARK is an error,
# and ZSAFE below the coating Z is an error, since that would drag the lip
# across the glass on every traverse.
#
# NAMING CAVEAT: Klipper resolves a command name with
#   args_r = re.compile('([A-Z_]+|[\*/])')   then   cmd = parts[1] + parts[2]
# so a digit in the middle of a macro name truncates it. Keep digits out, or
# put them only at the very end.
#
# RESPOND CAVEAT: Klipper strips  asterisk, hash and semicolon  from extended
# command arguments before parsing, so a RESPOND MSG containing any of those
# truncates mid-string and fails as "Malformed command". Keep them out of
# every RESPOND here. action_raise_error is unaffected.
#
# Volume and pump-feed parameters accept 0 to mean "derive from the geometry"
# using width, wet thickness and pass length. Pass a non-zero value to
# override with a literal.
#
#
# CHARGING THE DIE - two operations, not one
#
# v1 primed by holding still at one spot on the priming slide and pushing the
# whole manifold volume out through the lip. That is wrong twice over. First,
# 500 uL at a 0.2 mm gap is 0.27 mm of average depth over the WHOLE 25x75 mm
# slide, so it does not make a puddle, it floods the slide and runs onto the
# bed. Second, a stationary dispense proves nothing about the bead: the thing
# you need to know before touching a device slide is whether ink emerges
# evenly across the full slit, and only motion shows that.
#
# So it is split:
#
#   SLOTDIE_PURGE   off substrate, over a waste vessel at the purge station.
#                   Volume is the manifold dead volume, PURGE_UL, and the
#                   rate is free because nothing is being coated - PURGE_F
#                   defaults to 2000 uL/min, which is 15 s for 500 uL rather
#                   than 75. The limit on rate is air entrapment in the
#                   manifold, not the gantry. Watch the lip on the first one.
#
#   SLOTDIE_PRIME   ONE real coating pass on the priming slide, at coating
#                   height, at coating feed, using the layer's own W and WET.
#                   Same _SD_PASS helper as a device pass, so it inherits the
#                   flow invariant and cannot drift out of sync with it. A
#                   full-length pass at 15 mm x 50 um x 65 mm is 48.75 uL,
#                   not 500.
#
# PRIME_UL CHANGED MEANING IN v2. It is now the prime PASS volume, and 0 means
# "derive from geometry" like QD_UL and NW_UL. It is no longer the charge
# volume and 0 no longer means skip. Use SKIP_PRIME=1 to skip the pass and
# PURGE_UL for the charge. PRIME_F, PRIME_SETTLE, PRIME_DWELL and
# PRIME_LOC_X/Y are gone - the prime pass uses PUMP_F, SETTLE and DWELL,
# because it IS a coating pass.
#
# THE PRIMING SLIDE IS LANDSCAPE: 75 mm along bed X, 25 mm along bed Y, the
# opposite of the device slide. PRM_SX and PRM_SY default to 75 and 25 to
# match. The prime pass still runs along Y like every other pass, so it is
# short - PRIME_Y0 4.0 to PRIME_Y1 21.0 is 17 mm, which at 15 mm x 50 um is
# 12.75 uL. That is enough traverse to show whether ink emerges across the
# full slit, which is the only thing the prime pass is there to prove.
#
# There is 75 mm of X on that slide, so a second prime lane is just
# SLOTDIE_PRIME LAYER=QD PRIME_CX=<another X> on fresh glass.
#
# SLOTDIE_PRIME hard-errors if PRIME_Y1 exceeds PRM_SY, so a slide mounted the
# other way round is caught before it dispenses - provided PRM_SX and PRM_SY
# have been set to match how the glass actually sits.
#
#
# SLIDE FRAME
#
# Same convention as conductiveslide.cfg: the device slide is the reference
# figure rotated 90 deg.
#   figure-x (75 mm, the long axis)  -> bed Y     local Y here
#   figure-y (25 mm, the short axis) -> bed X     local X here
#
# A coating pass is therefore a straight move along bed Y at fixed bed X, and
# the die slit is oriented along bed X. Stripe width comes from the slit, not
# from motion.
#
#
# LAYER GEOMETRY (local mm, origin at the min-X min-Y corner)
#
#              local X = 0        CX = 12.5         local X = 25
#                    +-------------------------------+  local Y = 75
#                    |          Cu tape              |  70.00
#                    |   - - - - scribe - - - - - -  |  60      NW_Y1 = 70
#                    |    |                     |    |          QD_Y1 = 64
#                    |    |   QD   |   AgNW     |    |
#                    |    |  width |  width     |    |
#                    |    |  QD_W  |   NW_W     |    |
#                    |    |                     |    |  14      NW_Y0 = 14
#                    |                               |  12      QD_Y0 = 12
#                    |          Cu tape              |   3.65
#                    +-------------------------------+  local Y = 0
#
# Passes are written in -Y, high to low, matching conductiveslide.cfg. That
# puts the start-of-pass bead transient up on the isolated pad past the
# scribe, where it does not affect the device.
#
# The AgNW must start inside the QD edge and end past it on the pad. Those two
# boundaries are what a run proves, and they are why NW_Y0 is greater than
# QD_Y0 while NW_Y1 is greater than QD_Y1.
#=============================================================================


#-----------------------------------------------------------------------------
# REQUIRED: persistent storage. DELETE this stanza if conductiveslide.cfg or
# printer.cfg already declares one - Klipper permits a single [save_variables].
#-----------------------------------------------------------------------------
[save_variables]
filename: ~/printer_data/config/saved_variables.cfg


#=============================================================================
# PARAMETER TABLE
#
# Single source of truth. SLOTDIE_HELP prints from it, SLOTDIE_SET validates
# against it, SLOTDIE_COAT and SLOTDIE_SETTINGS resolve from it. Add a row and
# it appears in all four.
# Fields: key, unit, built-in default, description
#=============================================================================
[gcode_macro _SD_PARAMS]
description: Parameter table - not called directly
variable_table: [
    ["DEV_X",        "mm",     0.0,     "Device slide 1 origin, bed X of min-X corner"],
    ["DEV_Y",        "mm",     0.0,     "Device slide 1 origin, bed Y of min-Y corner"],
    ["DEV_Z",        "mm",     0.0,     "Coating height, bed Z of the die lip"],
    ["PRM_X",        "mm",     0.0,     "Priming slide origin, bed X of min-X corner"],
    ["PRM_Y",        "mm",     0.0,     "Priming slide origin, bed Y of min-Y corner"],
    ["PRM_Z",        "mm",     0.0,     "Priming slide coating height, bed Z"],
    ["PRG_X",        "mm",     0.0,     "Purge station, bed X of the waste vessel centre"],
    ["PRG_Y",        "mm",     0.0,     "Purge station, bed Y of the waste vessel centre"],
    ["PRG_Z",        "mm",     0.0,     "Purge station, bed Z of the die lip over the vessel"],
    ["DEV_SX",       "mm",     25.0,    "Device slide size along bed X (short axis)"],
    ["DEV_SY",       "mm",     75.0,    "Device slide size along bed Y (long axis)"],
    ["PRM_SX",       "mm",     75.0,    "Priming slide size along bed X (long axis)"],
    ["PRM_SY",       "mm",     25.0,    "Priming slide size along bed Y (short axis)"],
    ["NDEV",         "count",  1.0,     "Number of device slides to coat"],
    ["DEV_DX",       "mm",     30.0,    "X pitch from one device slide to the next"],
    ["DEV_DY",       "mm",     0.0,     "Y offset per additional device slide"],
    ["DEV_DZ",       "mm",     0.0,     "Z offset per additional device slide"],
    ["CX",           "mm",     12.5,    "Stripe centreline, local X (die holds this X)"],
    ["TAPE_A_END",   "mm",     10.0,    "Bottom Cu tape far edge, local Y, from tape_jig_device.scad"],
    ["TAPE_B_START", "mm",     63.65,   "Top Cu tape near edge, local Y, from tape_jig_device.scad"],
    ["QD_Y0",        "mm",     12.0,    "QD pass end, local Y (writing stops here)"],
    ["QD_Y1",        "mm",     64.0,    "QD pass start, local Y (writing starts here, -Y)"],
    ["QD_W",         "mm",     15.0,    "QD coated width, MEASURED not slit width"],
    ["QD_WET",       "um",     50.0,    "QD wet film thickness"],
    ["NW_Y0",        "mm",     14.0,    "AgNW pass end, local Y (writing stops here)"],
    ["NW_Y1",        "mm",     70.0,    "AgNW pass start, local Y (writing starts here, -Y)"],
    ["NW_W",         "mm",     10.0,    "AgNW coated width, MEASURED not slit width"],
    ["NW_WET",       "um",     30.0,    "AgNW wet film thickness"],
    ["QD_UL",        "uL",     0.0,     "QD pass volume (0 = derive from W, WET, length)"],
    ["NW_UL",        "uL",     0.0,     "AgNW pass volume (0 = derive from W, WET, length)"],
    ["PUMP_F",       "uL/min", 0.0,     "Pump feed while coating (0 = derive from UL and FW)"],
    ["MASK",         "code",   1111.0,  "Pinch valve mask, 4 digits, 1 selects that valve"],
    ["VALVE_PER_PASS","0/1",   1.0,     "1 = open and close the valve around every pass"],
    ["VALVE_SETTLE", "ms",     300.0,   "Servo travel, must match VALVE_SETTLE in the sketch"],
    ["TRIG_ON_DWELL","ms",     500.0,   "Dwell after TRIGGERON, before dispensing"],
    ["PURGE_UL",     "uL",     0.0,     "Off-substrate charge at the purge station (0 = skip)"],
    ["PURGE_F",      "uL/min", 2000.0,  "Pump feed for the purge, free, nothing is being coated"],
    ["PURGE_DWELL",  "ms",     1000.0,  "EXTRA dwell after the purge, on top of its own run time"],
    ["SKIP_PURGE",   "0/1",    0.0,     "1 = skip the purge (die already charged)"],
    ["PRIME_UL",     "uL",     0.0,     "Prime PASS volume (0 = derive from W, WET, length)"],
    ["PRIME_CX",     "mm",     37.5,    "Prime pass centreline, local X on the priming slide"],
    ["PRIME_Y0",     "mm",     4.0,     "Prime pass end, local Y on the priming slide"],
    ["PRIME_Y1",     "mm",     21.0,    "Prime pass start, local Y on the priming slide"],
    ["SKIP_PRIME",   "0/1",    0.0,     "1 = skip the prime pass (die already wet and proven)"],
    ["PASS_P",       "uL",     0.0,     "Per-pass prime, firmware P token, takes up backlash"],
    ["PASS_PF",      "uL/min", 600.0,   "Per-pass prime rate, firmware PF token"],
    ["PASS_PD",      "ms",     0.0,     "Per-pass prime dwell, firmware PD token"],
    ["DIE_R",        "mm",     3.0,     "Die manifold radius, innerrad in the SCAD"],
    ["DIE_SLIT",     "mm",     13.0,    "Die slit length, tankwidth in the SCAD"],
    ["WETUP",        "ms",     600.0,   "Dwell after TRIGGER_FIRE, before motion, to form the bead"],
    ["TD",           "ms",     40.0,    "Trigger-to-dispense lead, firmware waits this long"],
    ["PRE_TD",       "ms",     50.0,    "Dwell after the TD command"],
    ["SETTLE",       "ms",     10.0,    "Dwell between SDISPENSE and TRIGGER_FIRE"],
    ["DWELL",        "ms",     900.0,   "Dwell after a pass, must cover DD plus the retract"],
    ["PUMP_DD",      "ms",     200.0,   "Firmware DD, dwell after dispense before retract"],
    ["RETRACT_UL",   "uL",     0.0,     "Suck-back to break the bead, firmware R token (0 = none)"],
    ["RETRACT_F",    "uL/min", 200.0,   "Suck-back rate, firmware RF token"],
    ["RETRACT_D",    "ms",     100.0,   "Dwell after suck-back, firmware RD token"],
    ["FW",           "mm/min", 600.0,   "Gantry feed while coating, 600 = 10 mm/s"],
    ["FT",           "mm/min", 3000.0,  "Gantry feed for XY travel"],
    ["FZ",           "mm/min", 1000.0,  "Gantry feed for Z moves"],
    ["ZHOP",         "mm",     5.0,     "Travel height above coating height, when ZSAFE is 0"],
    ["ZSAFE",        "mm",     0.0,     "Absolute Z for every XY traverse (0 = use coating Z plus ZHOP)"],
    ["ZPARK",        "mm",     100.0,   "Absolute Z to park at on completion"],
    ["FPARK",        "mm/min", 2000.0,  "Z feed for the final park move"],
    ["END_DWELL",    "ms",     250.0,   "Dwell at the end of the run"],
    ["DRYRUN",       "0/1",    0.0,     "1 = run all motion with no pump commands and no pump dwells"],
    ["VERBOSE",      "0/1",    1.0,     "0 = suppress all RESPOND output from the run"]
    ]
gcode:
    RESPOND MSG="_SD_PARAMS is a table, not a command. Run SLOTDIE_HELP."


#-----------------------------------------------------------------------------
# SLOTDIE_HELP [FILTER=<substring>]
#-----------------------------------------------------------------------------
[gcode_macro SLOTDIE_HELP]
description: List every SLOTDIE_COAT parameter with unit, default and current value
gcode:
    {% set tbl = printer["gcode_macro _SD_PARAMS"].table %}
    {% set sv  = printer.save_variables.variables %}
    {% set flt = params.FILTER|default('')|upper %}
    RESPOND MSG="=== SLOTDIE_COAT parameters ==="
    RESPOND MSG="KEY / UNIT / BUILT-IN / CURRENT     a marker of > means set via SLOTDIE_SET"
    {% for row in tbl %}
    {% if flt == '' or flt in row[0] or flt in row[3]|upper %}
    {% set k = 'sd_' ~ row[0]|lower %}
    {% set cur = sv.get(k, row[2])|float %}
    {% set mark = '>' if k in sv else ' ' %}
    RESPOND MSG="{mark}{'%-13s' % row[0]} {'%-7s' % row[1]} {'%10.5f' % row[2]} {'%10.5f' % cur}  {row[3]}"
    {% endif %}
    {% endfor %}
    RESPOND MSG="--- usage ---"
    RESPOND MSG="SLOTDIE_COAT LAYER=QD FW=400 QD_WET=60      (per-run override)"
    RESPOND MSG="SLOTDIE_SET FW=400                          (persistent default)"
    RESPOND MSG="SLOTDIE_HELP FILTER=PURGE                   (filter this list)"
    RESPOND MSG="LAYER is QD or AGNW and is REQUIRED. One layer per run."
    RESPOND MSG="Slide sizes are DEV_SX DEV_SY PRM_SX PRM_SY, default 25 and 75."
    RESPOND MSG="Device slide is PORTRAIT, 25 along X by 75 along Y. Passes run in -Y."
    RESPOND MSG="Priming slide is LANDSCAPE, 75 along X by 25 along Y."
    RESPOND MSG="Set ZSAFE to an absolute Z that clears the die dock, eg SLOTDIE_SET ZSAFE=120"
    RESPOND MSG="--- three origins ---"
    RESPOND MSG="DEVICE  the slide being coated"
    RESPOND MSG="PRIME   a sacrificial slide, gets one real pass before the device"
    RESPOND MSG="PURGE   a waste vessel, gets the manifold charge off substrate"
    RESPOND MSG="--- example, two device slides side by side ---"
    RESPOND MSG="1. mount the QD die, jog its lip to device slide 1 min-X min-Y"
    RESPOND MSG="   corner at coating height"
    RESPOND MSG="2. SLOTDIE_WHERE               reads the position, stores nothing"
    RESPOND MSG="3. SET_COAT_ORIGIN SLIDE=DEVICE X=96.00 Y=49.00 Z=79.00"
    RESPOND MSG="4. jog to priming slide min-X min-Y corner, SLOTDIE_WHERE, then"
    RESPOND MSG="   SET_COAT_ORIGIN SLIDE=PRIME X=84.00 Y=127.00 Z=79.00"
    RESPOND MSG="5. jog over the waste vessel, lip clear of the rim, then"
    RESPOND MSG="   SET_COAT_ORIGIN SLIDE=PURGE X=60.00 Y=150.00 Z=85.00"
    RESPOND MSG="6. SLOTDIE_SET PURGE_UL=500 PURGE_F=2000 ZSAFE=120"
    RESPOND MSG="7. SLOTDIE_SETTINGS LAYER=QD NDEV=2         volume preview"
    RESPOND MSG="8. SLOTDIE_START LAYER=QD NDEV=2 DEV_DX=30 DRYRUN=1   motion only"
    RESPOND MSG="9. SLOTDIE_START LAYER=QD NDEV=2 DEV_DX=30            live run"
    RESPOND MSG="Then dry the QD layer, change to the AgNW die, re-measure the"
    RESPOND MSG="origin Z for that tool, and repeat with LAYER=AGNW."
    RESPOND MSG="Only slide 1 is stored. Slide 2 is slide 1 plus DEV_DX DEV_DY DEV_DZ."
    RESPOND MSG="QD_W and NW_W are MEASURED coated widths, not slit widths. Set them"
    RESPOND MSG="from scanned slides before trusting any derived volume."


#-----------------------------------------------------------------------------
# SLOTDIE_WHERE - report position so you can read values, type them, own them
#-----------------------------------------------------------------------------
[gcode_macro SLOTDIE_WHERE]
description: Print current toolhead position. Does not store anything.
gcode:
    {% set p = printer.gcode_move.gcode_position %}
    {% set h = printer.gcode_move.homing_origin %}
    RESPOND MSG="position X {'%.3f' % p.x} Y {'%.3f' % p.y} Z {'%.3f' % p.z}"
    RESPOND MSG="gcode offset X {'%.3f' % h.x} Y {'%.3f' % h.y} Z {'%.3f' % h.z}"


#-----------------------------------------------------------------------------
# SET_COAT_ORIGIN SLIDE=DEVICE|PRIME|PURGE X=<mm> Y=<mm> Z=<mm>
# All three coordinates are required. Nothing is inferred from gantry position.
#
# DEVICE and PRIME are the min-X min-Y corner of a slide at coating height.
# PURGE is not a corner: it is the point the lip sits at over the waste vessel,
# and its Z is deliberately NOT a coating height - it wants to be clear of the
# rim and clear of whatever is in the vessel.
#
# Z is per-tool. Re-run this after every die change - the QD die and the AgNW
# die do not share a lip height.
#-----------------------------------------------------------------------------
[gcode_macro SET_COAT_ORIGIN]
description: Store a slot die origin. SLIDE, X, Y and Z are all required.
gcode:
    {% set s = params.SLIDE|default('')|upper %}
    {% if s not in ['DEVICE', 'PRIME', 'PURGE'] %}
        { action_raise_error("SLIDE must be DEVICE, PRIME or PURGE") }
    {% endif %}
    {% if 'X' not in params or 'Y' not in params or 'Z' not in params %}
        { action_raise_error("X, Y and Z are all required. Use SLOTDIE_WHERE to read the gantry position, then type the values.") }
    {% endif %}
    {% set k = 'dev' if s == 'DEVICE' else ('prm' if s == 'PRIME' else 'prg') %}
    {% set x = params.X|float %}
    {% set y = params.Y|float %}
    {% set z = params.Z|float %}
    SAVE_VARIABLE VARIABLE=sd_{k}_x VALUE={x}
    SAVE_VARIABLE VARIABLE=sd_{k}_y VALUE={y}
    SAVE_VARIABLE VARIABLE=sd_{k}_z VALUE={z}
    RESPOND MSG="stored {s|lower} origin, X {'%.3f' % x} Y {'%.3f' % y} Z {'%.3f' % z}"


#-----------------------------------------------------------------------------
# SLOTDIE_SET KEY=VALUE [KEY=VALUE ...]  - persist one or more defaults
#-----------------------------------------------------------------------------
[gcode_macro SLOTDIE_SET]
description: Persistently change one or more defaults. SLOTDIE_HELP lists valid keys.
gcode:
    {% set tbl = printer["gcode_macro _SD_PARAMS"].table %}
    {% set known = tbl|map(attribute=0)|list %}
    {% if params|length == 0 %}
        { action_raise_error("SLOTDIE_SET needs at least one KEY=VALUE. Run SLOTDIE_HELP for the list.") }
    {% endif %}
    {% for k in params %}
    {% if k not in known %}
        { action_raise_error("Unknown parameter '%s'. Run SLOTDIE_HELP for valid keys." % k) }
    {% endif %}
    {% endfor %}
    {% for k in params %}
    SAVE_VARIABLE VARIABLE=sd_{k|lower} VALUE={params[k]|float}
    RESPOND MSG="stored {k|lower} as {params[k]|float}"
    {% endfor %}


#-----------------------------------------------------------------------------
# SLOTDIE_RESET_DEFAULTS [CONFIRM=1] - clear stored overrides, keep origins
#-----------------------------------------------------------------------------
[gcode_macro SLOTDIE_RESET_DEFAULTS]
description: Clear SLOTDIE_SET overrides back to built-in defaults. Origins are kept.
gcode:
    {% if params.CONFIRM|default(0)|int != 1 %}
        RESPOND MSG="This clears all SLOTDIE_SET overrides. Re-run as SLOTDIE_RESET_DEFAULTS CONFIRM=1"
    {% else %}
    {% set tbl = printer["gcode_macro _SD_PARAMS"].table %}
    {% set sv  = printer.save_variables.variables %}
    {% for row in tbl %}
    {% set k = 'sd_' ~ row[0]|lower %}
    {% if k in sv and row[0] not in ['DEV_X','DEV_Y','DEV_Z','PRM_X','PRM_Y','PRM_Z','PRG_X','PRG_Y','PRG_Z'] %}
    SAVE_VARIABLE VARIABLE={k} VALUE={row[2]|float}
    {% endif %}
    {% endfor %}
    RESPOND MSG="Defaults reset. All three origins retained."
    {% endif %}


#-----------------------------------------------------------------------------
# HELPER: one straight coating pass, written in -Y at fixed X
#
# Flow is consistent by construction. With PF = 0 the pump rate is derived
# from the gantry feed, F = E * FW / L, so the pump finishes exactly when the
# gantry stops. With PF > 0 the pump rate is fixed and the gantry write speed
# is derived instead, FWE = PF * L / E. Same discipline as _AG_TRACE.
#
# PINCH VALVE, per syringe_pump_v29.ino
#
# The firmware runs a six-phase sequence on trigger:
#   TD delay, prime (P PF PD), PO open, dispense (E F, DD dwell), PC close,
#   retract (R RF RD)
#
# This macro deliberately does NOT use the PO and PC tokens. PC fires at
# phase 5, BEFORE the retract at phase 6, so a suck-back with PC set would
# pull against a closed valve and never reach the die lip. The bead would not
# break. VALVEOPEN and VALVECLOSE are sent as separate immediate commands
# instead, which also puts the 300 ms servo settle outside the coating window
# rather than inside the timed dispense.
#
# Retract uses the firmware's native R RF RD tokens. A second SDISPENSE with
# a negative E would not work - executeMoveUL takes an unsigned volume and
# direction is set by DIR_PIN, which only phase 6 reverses.
#-----------------------------------------------------------------------------
[gcode_macro _SD_PASS]
description: One slot die pass from Y1 down to Y0 at fixed X
gcode:
    {% set X  = params.X|float %}
    {% set Y0 = params.Y0|float %}
    {% set Y1 = params.Y1|float %}
    {% set ZW = params.ZW|float %}
    {% set ZT = params.ZT|float %}
    {% set FW = params.FW|float %}
    {% set FT = params.FT|float %}
    {% set FZ = params.FZ|float %}
    {% set W  = params.W|float %}
    {% set WET = params.WET|float %}
    {% set UL = params.UL|float %}
    {% set PF = params.PF|float %}
    {% set MASK   = params.MASK|int %}
    {% set VPP    = params.VPP|int %}
    {% set TD     = params.TD|int %}
    {% set PRE_TD = params.PRE_TD|int %}
    {% set SETTLE = params.SETTLE|int %}
    {% set WETUP  = params.WETUP|int %}
    {% set DWELL  = params.DWELL|int %}
    {% set PP     = params.PP|float %}
    {% set PPF    = params.PPF|float %}
    {% set PPD    = params.PPD|int %}
    {% set DD     = params.DD|int %}
    {% set RUL    = params.RUL|float %}
    {% set RF     = params.RF|float %}
    {% set RD     = params.RD|int %}
    {% set DRY    = params.DRY|default(0)|int %}

    {% set L = (Y1 - Y0)|abs %}
    {% set E = (UL if UL > 0 else W * WET * L / 1000.0)|round(3) %}
    {% set F   = (PF if PF > 0 else E * FW / L)|round(1) %}
    {% set FWE = (PF * L / E if PF > 0 and E > 0 else FW)|round(1) %}

    G90
    G1 Z{ZT} F{FZ}
    G1 X{X} Y{Y1} F{FT}
    G1 Z{ZW} F{FZ}
    {% if not DRY and VPP %}
    SEND_PUMP_ARDUINO COMMAND="VALVEOPEN MASK={MASK}"
    {% endif %}
    {% if not DRY %}
    SEND_PUMP_ARDUINO COMMAND="TD {TD}"
    G4 P{PRE_TD}
    SEND_PUMP_ARDUINO COMMAND="SDISPENSE MASK={MASK} P{'%.3f' % PP} PF{'%.1f' % PPF} PD{PPD} E{E} F{F} DD{DD} R{'%.3f' % RUL} RF{'%.1f' % RF} RD{RD}"
    G4 P{SETTLE}
    TRIGGER_FIRE
    {% endif %}
    G4 P{WETUP}
    G1 Y{Y0} F{FWE}
    G4 P{DWELL}
    {% if not DRY and VPP %}
    SEND_PUMP_ARDUINO COMMAND="VALVECLOSE MASK={MASK}"
    {% endif %}
    G1 Z{ZT} F{FZ}


#=============================================================================
# SLOTDIE_PURGE [ARM=0] [KEY=VALUE ...]
#
# Charge the die manifold off substrate, over the waste vessel at the purge
# station. Stationary is correct here - nothing is being coated, so there is
# nothing motion could prove and nowhere for the volume to spread.
#
# The rate is free. The flow invariant E/(F/60) == L/FW only binds a coating
# pass, where the pump has to match gantry travel. Standing still, PURGE_F is
# limited only by whether the manifold fills evenly: too fast and air is
# trapped in the 481 uL cavity, which is worse than waiting. 2000 uL/min puts
# 500 uL through in 15 s. Start slower for the first one and watch the lip.
#
# ARM=0 means the caller has already sent TRIGGERON. Standalone use arms it.
#
#   SLOTDIE_PURGE                    charge with the stored PURGE_UL
#   SLOTDIE_PURGE PURGE_UL=250       top up
#   SLOTDIE_PURGE DRYRUN=1           motion only, and does NOT spend the time
#=============================================================================
[gcode_macro SLOTDIE_PURGE]
description: Charge the die off substrate at the purge station
gcode:
    {% set tbl = printer["gcode_macro _SD_PARAMS"].table %}
    {% set sv  = printer.save_variables.variables %}
    {% set known = tbl|map(attribute=0)|list %}

    {% for k in params %}
    {% if k != 'ARM' and k not in known %}
        { action_raise_error("Unknown parameter '%s'. Run SLOTDIE_HELP for valid keys." % k) }
    {% endif %}
    {% endfor %}

    {% set p = namespace(v = {}) %}
    {% for row in tbl %}
    {% set _ = p.v.update({row[0]: params[row[0]]|default(sv.get('sd_' ~ row[0]|lower, row[2]))|float}) %}
    {% endfor %}
    {% set v = p.v %}

    {% set VB  = v.VERBOSE|int %}
    {% set DRY = v.DRYRUN|int %}
    {% set ARM = params.ARM|default(1)|int %}

    {% if v.SKIP_PURGE|int == 1 or v.PURGE_UL <= 0.0 %}
    {% if VB %}
    RESPOND MSG="purge skipped"
    {% endif %}
    {% else %}

    {% if v.PRG_X == 0.0 and v.PRG_Y == 0.0 %}
        { action_raise_error("PURGE_UL is set but no purge origin stored. Run SET_COAT_ORIGIN SLIDE=PURGE X= Y= Z= or set SKIP_PURGE=1.") }
    {% endif %}
    {% if v.PURGE_F <= 0.0 %}
        { action_raise_error("PURGE_F must be greater than zero when PURGE_UL is set.") }
    {% endif %}
    {% if v.ZSAFE > 0.0 and v.ZSAFE > v.ZPARK %}
        { action_raise_error("ZSAFE must not be above ZPARK.") }
    {% endif %}
    {% set ZT = v.ZSAFE if v.ZSAFE > 0.0 else (v.PRG_Z + v.ZHOP) %}
    {% if ZT >= v.ZPARK and v.ZSAFE <= 0.0 %}
        { action_raise_error("PRG_Z plus ZHOP must stay below ZPARK, or set ZSAFE.") }
    {% endif %}
    {% if ZT < v.PRG_Z %}
        { action_raise_error("The traverse height is below PRG_Z, the die would drag through the vessel. Raise ZSAFE above PRG_Z.") }
    {% endif %}

    {% set die_v = (3.14159265 * v.DIE_R * v.DIE_R * v.DIE_SLIT
                    + 4.0 / 3.0 * 3.14159265 * v.DIE_R * v.DIE_R * v.DIE_R)|round(1) %}
    {% set secs = v.PURGE_UL / v.PURGE_F * 60.0 %}
    {% set hold = ((secs * 1000.0) + v.PURGE_DWELL)|round(0)|int %}

    {% if VB %}
    RESPOND MSG="=== purge, off substrate ==="
    RESPOND MSG="{'%.3f' % v.PURGE_UL} uL at {'%.1f' % v.PURGE_F} uL/min, takes {'%.1f' % secs} s"
    RESPOND MSG="die manifold holds {'%.1f' % die_v} uL"
    {% if v.PURGE_UL < die_v %}
    RESPOND MSG="WARNING PURGE_UL is less than the manifold volume, the die will not fill"
    {% endif %}
    RESPOND MSG="station X {'%.2f' % v.PRG_X} Y {'%.2f' % v.PRG_Y} Z {'%.2f' % v.PRG_Z}"
    # Whatever runs next travels at its own coating height plus ZHOP, and it
    # DESCENDS to that height before moving in XY, while still over the vessel.
    # If PRG_Z is above the travel plane the lip drops toward the vessel and
    # then drags sideways at that height. Fine over a shallow dish, a crash
    # into the rim of a beaker. Raise ZHOP or use a shorter vessel.
    {% set tplane = v.ZSAFE if v.ZSAFE > 0.0 else ((v.DEV_Z if v.DEV_Z < v.PRM_Z else v.PRM_Z) + v.ZHOP) %}
    {% if v.PRG_Z > tplane %}
    RESPOND MSG="WARNING PRG_Z {'%.2f' % v.PRG_Z} is above the traverse height {'%.2f' % tplane}"
    RESPOND MSG="        the die descends to {'%.2f' % tplane} over the vessel, then moves in XY"
    RESPOND MSG="        raise ZSAFE or use a shorter waste vessel"
    {% endif %}
    {% endif %}

    G90
    G1 Z{ZT} F{v.FZ}
    G1 X{v.PRG_X} Y{v.PRG_Y} F{v.FT}
    G1 Z{v.PRG_Z} F{v.FZ}
    {% if DRY %}
    {% if VB %}
    RESPOND MSG="dryrun, no dispense, and the {'%.1f' % (hold / 1000.0)} s hold is not spent"
    {% endif %}
    {% else %}
    {% if ARM %}
    SEND_PUMP_ARDUINO COMMAND="TRIGGERON"
    G4 P{v.TRIG_ON_DWELL|int}
    {% endif %}
    SEND_PUMP_ARDUINO COMMAND="VALVEOPEN MASK={v.MASK|int}"
    SEND_PUMP_ARDUINO COMMAND="TD {v.TD|int}"
    SEND_PUMP_ARDUINO COMMAND="SDISPENSE MASK={v.MASK|int} E{'%.3f' % v.PURGE_UL} F{'%.1f' % v.PURGE_F}"
    G4 P{v.SETTLE|int}
    TRIGGER_FIRE
    G4 P{hold}
    SEND_PUMP_ARDUINO COMMAND="VALVECLOSE MASK={v.MASK|int}"
    {% endif %}
    G1 Z{ZT} F{v.FZ}
    {% if VB %}
    RESPOND MSG="purge complete, check the lip is wet across the full slit before proceeding"
    {% endif %}

    {% endif %}


#=============================================================================
# SLOTDIE_PRIME LAYER=QD|AGNW [ARM=0] [KEY=VALUE ...]
#
# One real coating pass on the priming slide, at coating height, at coating
# feed, using the layer's own W and WET. It goes through _SD_PASS, the same
# helper a device pass uses, so it inherits the flow invariant and cannot
# drift out of sync with the real pass.
#
# This is the step that tells you the bead is uniform across the full slit and
# that neither end of the manifold is air-locked. A stationary dispense cannot
# tell you that, which is why v1's prime was the wrong shape.
#
# Volume is small: 15 mm x 50 um x 17 mm is 12.75 uL, against 500 uL for the
# manifold charge. Priming is cheap once the charge is separated out of it.
#
#   SLOTDIE_PRIME LAYER=QD
#   SLOTDIE_PRIME LAYER=QD PRIME_CX=12.5    a second lane on fresh glass
#=============================================================================
[gcode_macro SLOTDIE_PRIME]
description: One coating pass on the priming slide, at real coating conditions
gcode:
    {% set tbl = printer["gcode_macro _SD_PARAMS"].table %}
    {% set sv  = printer.save_variables.variables %}
    {% set known = tbl|map(attribute=0)|list %}

    {% set lay = params.LAYER|default('')|upper %}
    {% if lay not in ['QD', 'AGNW'] %}
        { action_raise_error("LAYER must be QD or AGNW. The prime pass uses that layer's W and WET.") }
    {% endif %}
    {% for k in params %}
    {% if k not in ['LAYER','ARM'] and k not in known %}
        { action_raise_error("Unknown parameter '%s'. Run SLOTDIE_HELP for valid keys." % k) }
    {% endif %}
    {% endfor %}

    {% set p = namespace(v = {}) %}
    {% for row in tbl %}
    {% set _ = p.v.update({row[0]: params[row[0]]|default(sv.get('sd_' ~ row[0]|lower, row[2]))|float}) %}
    {% endfor %}
    {% set v = p.v %}

    {% set VB  = v.VERBOSE|int %}
    {% set DRY = v.DRYRUN|int %}
    {% set ARM = params.ARM|default(1)|int %}

    {% if v.SKIP_PRIME|int == 1 %}
    {% if VB %}
    RESPOND MSG="prime pass skipped"
    {% endif %}
    {% else %}

    {% if v.PRM_X == 0.0 and v.PRM_Y == 0.0 %}
        { action_raise_error("No prime origin stored. Run SET_COAT_ORIGIN SLIDE=PRIME X= Y= Z= or set SKIP_PRIME=1.") }
    {% endif %}
    {% set ZT = v.ZSAFE if v.ZSAFE > 0.0 else (v.PRM_Z + v.ZHOP) %}
    {% if ZT >= v.ZPARK %}
        { action_raise_error("The traverse height is at or above ZPARK. Lower ZSAFE, or lower PRM_Z plus ZHOP.") }
    {% endif %}
    {% if v.PRIME_Y1 <= v.PRIME_Y0 %}
        { action_raise_error("PRIME_Y1 must be greater than PRIME_Y0, the pass runs in -Y.") }
    {% endif %}
    {% if v.PRIME_Y1 > v.PRM_SY %}
        { action_raise_error("PRIME_Y1 is %.1f but the priming slide is only %.1f mm along bed Y. The pass runs along Y, so PRIME_Y1 cannot exceed PRM_SY. Check which way round the slide is mounted and set PRM_SX and PRM_SY to match." % (v.PRIME_Y1, v.PRM_SY)) }
    {% endif %}
    {% if v.PRIME_CX > v.PRM_SX %}
        { action_raise_error("PRIME_CX is outside the priming slide, PRM_SX is %.1f mm." % v.PRM_SX) }
    {% endif %}

    {% set W   = v.QD_W   if lay == 'QD' else v.NW_W %}
    {% set WET = v.QD_WET if lay == 'QD' else v.NW_WET %}
    {% set L   = (v.PRIME_Y1 - v.PRIME_Y0)|abs %}
    {% set E   = (v.PRIME_UL if v.PRIME_UL > 0 else W * WET * L / 1000.0)|round(3) %}

    {% if VB %}
    RESPOND MSG="=== prime pass, layer {lay} ==="
    RESPOND MSG="local Y {'%.2f' % v.PRIME_Y1} down to {'%.2f' % v.PRIME_Y0}, length {'%.2f' % L} mm at local X {'%.2f' % v.PRIME_CX}"
    RESPOND MSG="volume {'%.3f' % E} uL, same conditions as the device pass"
    {% endif %}

    G90
    {% if not DRY and ARM %}
    SEND_PUMP_ARDUINO COMMAND="TRIGGERON"
    G4 P{v.TRIG_ON_DWELL|int}
    {% endif %}

    {% set FEE = "FW=" ~ v.FW ~ " FT=" ~ v.FT ~ " FZ=" ~ v.FZ %}
    {% set TIM = "MASK=" ~ v.MASK|int ~ " VPP=" ~ v.VALVE_PER_PASS|int ~ " TD=" ~ v.TD|int ~ " PRE_TD=" ~ v.PRE_TD|int ~ " SETTLE=" ~ v.SETTLE|int ~ " WETUP=" ~ v.WETUP|int ~ " DWELL=" ~ v.DWELL|int %}
    {% set INK = "W=" ~ W ~ " WET=" ~ WET ~ " UL=" ~ v.PRIME_UL ~ " PF=" ~ v.PUMP_F ~ " PP=" ~ v.PASS_P ~ " PPF=" ~ v.PASS_PF ~ " PPD=" ~ v.PASS_PD|int ~ " DD=" ~ v.PUMP_DD|int ~ " RUL=" ~ v.RETRACT_UL ~ " RF=" ~ v.RETRACT_F ~ " RD=" ~ v.RETRACT_D|int %}

    _SD_PASS X={v.PRM_X + v.PRIME_CX} Y0={v.PRM_Y + v.PRIME_Y0} Y1={v.PRM_Y + v.PRIME_Y1} ZW={v.PRM_Z} ZT={ZT} {INK} {FEE} {TIM} DRY={DRY}

    {% if VB %}
    RESPOND MSG="prime pass complete. Look at the stripe before coating a device:"
    RESPOND MSG="full width edge to edge means the manifold is charged evenly."
    {% endif %}

    {% endif %}


#=============================================================================
# SLOTDIE_ZLIST [Z=<list>] [CLEAR=1]
#
# Per-slide coating Z. A bed is not a plane and a row of slides is not a row of
# equal thicknesses, so one DEV_Z across four slides means four different gaps.
# DEV_DZ only helps when the error is linear, which it generally is not - it is
# glass thickness scatter plus whatever the jig does, and that is per pocket.
#
#   SLOTDIE_ZLIST Z=[50.5,50,49.5,49.25]    store, one entry per slide
#   SLOTDIE_ZLIST Z=50.5,50,49.5,49.25      brackets optional
#   SLOTDIE_ZLIST                           report what is stored
#   SLOTDIE_ZLIST CLEAR=1                   back to DEV_Z plus DEV_DZ
#
# NO SPACES INSIDE THE LIST. Klipper splits extended command arguments with
# shlex.split before any macro runs, so "Z=[50.5, 50]" becomes three tokens and
# fails as "Malformed command" before this macro can say anything useful about
# it. Commas and brackets are fine, spaces are not.
#
# This needs its own command because SLOTDIE_SET coerces every value it is
# given to a float, which turns a list into an exception. The list is stored
# as sd_zlist, outside the parameter table, and SLOTDIE_RESET_DEFAULTS walks
# the table so it does not clear it. Use CLEAR=1 for that.
#
# Entry i applies to slide i, in the same order the ladder walks X, and in the
# same absolute machine frame as DEV_Z. An explicit DEV_Z on a command line
# still wins over the list, which is how SLOTDIE_CAL_LADDER feeds one entry at
# a time to a single-slide SLOTDIE_COAT without the list applying twice.
#=============================================================================
[gcode_macro SLOTDIE_ZLIST]
description: Store a per-slide coating Z list. SLOTDIE_SET cannot hold this.
gcode:
    {% set sv  = printer.save_variables.variables %}
    {% set zsafe = sv.get('sd_zsafe', 0.0)|float %}
    {% set zhop  = sv.get('sd_zhop', 5.0)|float %}
    {% set zpark = sv.get('sd_zpark', 100.0)|float %}

    {% if params.CLEAR|default(0)|int == 1 %}
    SAVE_VARIABLE VARIABLE=sd_zlist VALUE="''"
    RESPOND MSG="z list cleared, slides fall back to DEV_Z plus DEV_DZ"

    {% elif 'Z' in params %}
    {% set parts = (params.Z|string|replace('[','')|replace(']','')).split(',') %}
    {% set zn = namespace(z = []) %}
    {% for t in parts %}
    {% if t|trim %}
    {% set zn.z = zn.z + [t|trim|float] %}
    {% endif %}
    {% endfor %}
    {% if zn.z|length == 0 %}
        { action_raise_error("Z parsed to an empty list. Expected something like Z=[50.5,50,49.5,49.25] with no spaces.") }
    {% endif %}
    {% for z in zn.z %}
    {% if z <= 0.0 %}
        { action_raise_error("Entry %d is %.3f. Coating Z is an absolute machine height in the same frame as DEV_Z, it cannot be zero or negative." % (loop.index, z)) }
    {% endif %}
    {% endfor %}
    SAVE_VARIABLE VARIABLE=sd_zlist VALUE=[{zn.z|join(',')}]
    RESPOND MSG="stored z list, {zn.z|length} entries"
    {% for z in zn.z %}
    RESPOND MSG="  slide {loop.index}  Z {'%.3f' % z}"
    {% endfor %}
    {% set zmax = zn.z|max %}
    {% if zsafe > 0.0 and zmax > zsafe %}
    RESPOND MSG="WARNING entry {'%.3f' % zmax} is above ZSAFE {'%.3f' % zsafe}, that slide would be refused"
    {% elif zsafe <= 0.0 and zmax + zhop >= zpark %}
    RESPOND MSG="WARNING entry {'%.3f' % zmax} plus ZHOP reaches ZPARK {'%.3f' % zpark}"
    {% endif %}

    {% else %}
    {% set zraw = sv.get('sd_zlist', '')|string %}
    {% if zraw and zraw != '' %}
    RESPOND MSG="z list: {zraw}"
    RESPOND MSG="entry i is used for slide i. SLOTDIE_ZLIST CLEAR=1 to remove it."
    {% else %}
    RESPOND MSG="no z list stored, slides use DEV_Z plus DEV_DZ"
    RESPOND MSG="SLOTDIE_ZLIST Z=[50.5,50,49.5,49.25] to set one, no spaces"
    {% endif %}
    {% endif %}


#=============================================================================
# SLOTDIE_COAT LAYER=QD|AGNW [KEY=VALUE ...]
#
# One layer per run. Change the die between layers and re-measure DEV_Z.
#=============================================================================
[gcode_macro SLOTDIE_COAT]
description: Slot die coat one layer across NDEV device slides
gcode:
    {% set tbl = printer["gcode_macro _SD_PARAMS"].table %}
    {% set sv  = printer.save_variables.variables %}
    {% set known = tbl|map(attribute=0)|list %}

    {% set lay = params.LAYER|default('')|upper %}
    {% if lay not in ['QD', 'AGNW'] %}
        { action_raise_error("LAYER must be QD or AGNW. Run SLOTDIE_HELP.") }
    {% endif %}

    {% for k in params %}
    {% if k not in ['LAYER', 'PARK', 'ZLIST'] and k not in known %}
        { action_raise_error("Unknown parameter '%s'. Run SLOTDIE_HELP for valid keys." % k) }
    {% endif %}
    {% endfor %}

    {% set p = namespace(v = {}) %}
    {% for row in tbl %}
    {% set _ = p.v.update({row[0]: params[row[0]]|default(sv.get('sd_' ~ row[0]|lower, row[2]))|float}) %}
    {% endfor %}
    {% set v = p.v %}

    {% set VB  = v.VERBOSE|int %}
    {% set DRY = v.DRYRUN|int %}
    {% set ND  = v.NDEV|int %}
    # PARK=0 leaves the die at the traverse height instead of climbing to
    # ZPARK. It is not a table key and is not persisted, because it describes
    # this one invocation, not a machine setting. SLOTDIE_CAL_LADDER uses it so
    # a four-slide ladder parks once at each end rather than eight times in
    # the middle.
    {% set PK = params.PARK|default(1)|int %}
    # Per-slide coating Z. Entry i overrides DEV_Z plus i x DEV_DZ for slide i.
    # An explicit DEV_Z on the command line wins over the list, which is what
    # lets SLOTDIE_CAL_LADDER feed one entry at a time into NDEV=1 runs without
    # the list applying a second time underneath.
    {% set zraw = params.ZLIST|default(sv.get('sd_zlist', ''))|string %}
    {% set zn = namespace(z = []) %}
    {% for t in (zraw|replace('[','')|replace(']','')).split(',') %}
    {% if t|trim %}
    {% set zn.z = zn.z + [t|trim|float] %}
    {% endif %}
    {% endfor %}
    {% set USEZ = zn.z|length > 0 and 'DEV_Z' not in params %}
    {% if USEZ and zn.z|length < ND %}
        { action_raise_error("The z list has %d entries but NDEV is %d. One entry per slide, or clear it with SLOTDIE_ZLIST CLEAR=1." % (zn.z|length, ND)) }
    {% endif %}

    {% if v.DEV_X == 0.0 and v.DEV_Y == 0.0 %}
        { action_raise_error("No device coat origin stored. Run SET_COAT_ORIGIN SLIDE=DEVICE X= Y= Z= first.") }
    {% endif %}
    {% if v.ZSAFE > 0.0 and v.ZSAFE > v.ZPARK %}
        { action_raise_error("ZSAFE must not be above ZPARK.") }
    {% endif %}
    {% if v.ZSAFE > 0.0 and v.ZSAFE < v.DEV_Z %}
        { action_raise_error("ZSAFE is below DEV_Z, the die would drag across the slide on every traverse.") }
    {% endif %}
    {% if USEZ and v.ZSAFE > 0.0 and v.ZSAFE < zn.z|max %}
        { action_raise_error("ZSAFE %.3f is below the highest z list entry %.3f, the die would drag across that slide." % (v.ZSAFE, zn.z|max)) }
    {% endif %}
    {% if USEZ and v.ZSAFE <= 0.0 and zn.z|max + v.ZHOP >= v.ZPARK %}
        { action_raise_error("The highest z list entry plus ZHOP reaches ZPARK. Lower it or set ZSAFE.") }
    {% endif %}
    {% if v.ZSAFE <= 0.0 and v.DEV_Z + v.ZHOP >= v.ZPARK %}
        { action_raise_error("DEV_Z plus ZHOP must stay below ZPARK, or set ZSAFE.") }
    {% endif %}
    {% if ND > 1 and v.DEV_DX|abs < v.DEV_SX %}
        { action_raise_error("DEV_DX is smaller than DEV_SX, slides would overlap.") }
    {% endif %}

    # ---- layer geometry ----
    {% set Y0  = v.QD_Y0  if lay == 'QD' else v.NW_Y0 %}
    {% set Y1  = v.QD_Y1  if lay == 'QD' else v.NW_Y1 %}
    {% set W   = v.QD_W   if lay == 'QD' else v.NW_W %}
    {% set WET = v.QD_WET if lay == 'QD' else v.NW_WET %}
    {% set UL  = v.QD_UL  if lay == 'QD' else v.NW_UL %}
    {% set L   = (Y1 - Y0)|abs %}
    {% set E   = (UL if UL > 0 else W * WET * L / 1000.0)|round(3) %}

    # ---- copper tape clearance, positions come from tape_jig_device.scad ----
    # The jig places 6.35 mm tape at local Y 3.65 to 10.00 and 63.65 to 70.00.
    # A pass that starts or ends on tape puts the die lip over a foil step of
    # roughly 0.07 mm, which is a large fraction of the coating gap. This warns
    # rather than blocks: the AgNW layer is SUPPOSED to run onto the top tape,
    # and the QD design value of 64.0 overlaps it by 0.35 mm by construction.
    {% if VB and Y1 > v.TAPE_B_START %}
    RESPOND MSG="NOTE pass starts at local Y {'%.2f' % Y1}, top tape begins at {'%.2f' % v.TAPE_B_START}, overlap {'%.2f' % (Y1 - v.TAPE_B_START)} mm"
    RESPOND MSG="     die lip starts on the foil step. Intended for AgNW, check it for QD."
    {% endif %}
    {% if VB and Y0 < v.TAPE_A_END %}
    RESPOND MSG="NOTE pass ends at local Y {'%.2f' % Y0}, bottom tape ends at {'%.2f' % v.TAPE_A_END}, overlap {'%.2f' % (v.TAPE_A_END - Y0)} mm"
    {% endif %}

    {% if VB %}
    RESPOND MSG="=== slot die run, layer {lay} ==="
    RESPOND MSG="pass local Y {'%.2f' % Y1} down to {'%.2f' % Y0}, length {'%.2f' % L} mm at local X {'%.2f' % v.CX}"
    RESPOND MSG="width {'%.2f' % W} mm, wet {'%.1f' % WET} um, volume {'%.3f' % E} uL per slide"
    RESPOND MSG="slides {ND}, dryrun {DRY}"
    {% endif %}

    # Klipper executes each rendered line as its own command, so a macro call
    # must sit on ONE line. Bundle the arguments first, same as conductiveslide.
    {% set FEE = "FW=" ~ v.FW ~ " FT=" ~ v.FT ~ " FZ=" ~ v.FZ %}
    {% set TIM = "MASK=" ~ v.MASK|int ~ " VPP=" ~ v.VALVE_PER_PASS|int ~ " TD=" ~ v.TD|int ~ " PRE_TD=" ~ v.PRE_TD|int ~ " SETTLE=" ~ v.SETTLE|int ~ " WETUP=" ~ v.WETUP|int ~ " DWELL=" ~ v.DWELL|int %}
    {% set INK = "W=" ~ W ~ " WET=" ~ WET ~ " UL=" ~ UL ~ " PF=" ~ v.PUMP_F ~ " PP=" ~ v.PASS_P ~ " PPF=" ~ v.PASS_PF ~ " PPD=" ~ v.PASS_PD|int ~ " DD=" ~ v.PUMP_DD|int ~ " RUL=" ~ v.RETRACT_UL ~ " RF=" ~ v.RETRACT_F ~ " RD=" ~ v.RETRACT_D|int %}

    # ---- valve held open across the whole run when VALVE_PER_PASS is 0 ----
    {% if not DRY and v.VALVE_PER_PASS|int == 0 %}
    SEND_PUMP_ARDUINO COMMAND="VALVEOPEN MASK={v.MASK|int}"
    {% endif %}

    # ---- arm the pump once for the whole run, before any dispensing ----
    # Must sit outside the charge block: with both skips set the pump still has
    # to be armed. Sent to the Arduino, not a Klipper command, unlike
    # TRIGGER_FIRE below. PURGE and PRIME are called with ARM=0 because of it.
    G90
    {% if DRY and VB %}
    RESPOND MSG="dryrun, motion only, no pump commands and no pump dwells"
    {% endif %}
    {% if not DRY %}
    SEND_PUMP_ARDUINO COMMAND="TRIGGERON"
    G4 P{v.TRIG_ON_DWELL|int}
    {% endif %}

    # ---- charge the die: purge off substrate, then one prime pass ----
    # Every per-run override has to be forwarded. SLOTDIE_PURGE and
    # SLOTDIE_PRIME resolve from the table and saved variables on their own, so
    # without this they would silently use stored defaults and ignore anything
    # passed on this command line. SKIP_PURGE and SKIP_PRIME are the ones that
    # matter most: SLOTDIE_CAL_LADDER relies on them to charge before the first
    # slide only, and dropping them would purge 500 uL before every slide.
    {% set ns = namespace(fwd = '') %}
    {% for k in params %}
    {% if k not in ['LAYER', 'PARK', 'ZLIST', 'DRYRUN', 'VERBOSE'] %}
    {% set ns.fwd = ns.fwd ~ ' ' ~ k ~ '=' ~ params[k] %}
    {% endif %}
    {% endfor %}
    SLOTDIE_PURGE ARM=0 DRYRUN={DRY} VERBOSE={VB}{ns.fwd}
    SLOTDIE_PRIME ARM=0 LAYER={lay} DRYRUN={DRY} VERBOSE={VB}{ns.fwd}

    # ---- one pass per slide ----
    {% for i in range(ND) %}
    {% set ox = v.DEV_X + i * v.DEV_DX %}
    {% set oy = v.DEV_Y + i * v.DEV_DY %}
    {% set oz = zn.z[i] if USEZ else (v.DEV_Z + i * v.DEV_DZ) %}
    {% if VB %}
    RESPOND MSG="slide {i + 1} of {ND}, origin X {'%.2f' % ox} Y {'%.2f' % oy} Z {'%.2f' % oz}"
    {% endif %}
    _SD_PASS X={ox + v.CX} Y0={oy + Y0} Y1={oy + Y1} ZW={oz} ZT={v.ZSAFE if v.ZSAFE > 0.0 else (oz + v.ZHOP)} {INK} {FEE} {TIM} DRY={DRY}
    {% endfor %}

    {% if not DRY and v.VALVE_PER_PASS|int == 0 %}
    SEND_PUMP_ARDUINO COMMAND="VALVECLOSE MASK={v.MASK|int}"
    {% endif %}

    {% if PK %}
    G1 Z{v.ZPARK} F{v.FPARK}
    G4 P{v.END_DWELL|int}
    {% endif %}
    {% if VB %}
    RESPOND MSG="layer {lay} complete, {ND} slide(s), {'%.3f' % (E * ND)} uL dispensed on devices"
    {% if not PK %}
    RESPOND MSG="park suppressed, holding at the traverse height"
    {% endif %}
    {% endif %}


#=============================================================================
# BACKGROUND LAUNCH
#
# Moonraker's /printer/gcode/script endpoint does not return until the script
# finishes, which trips the browser extension's fetch timeout on a long run.
# SLOTDIE_START queues the run and returns in milliseconds.
#
#   SLOTDIE_START LAYER=QD NDEV=2 DEV_DX=30 DRYRUN=1
#   SLOTDIE_STATUS                         is anything pending
#   SLOTDIE_CANCEL                         cancel a pending run
#
# Because the run is detached, errors surface in the console rather than in
# the caller's response. Use SLOTDIE_COAT directly from a console where you
# want the guard messages returned to you.
#=============================================================================
[gcode_macro _SD_QUEUE]
description: Argument holder for SLOTDIE_START - not called directly
variable_args: ''
gcode:
    RESPOND MSG="_SD_QUEUE holds arguments, it is not a command."

[delayed_gcode _SD_RUN_DEFERRED]
gcode:
    {% set a = printer["gcode_macro _SD_QUEUE"].args %}
    SET_GCODE_VARIABLE MACRO=_SD_QUEUE VARIABLE=args VALUE="''"
    SLOTDIE_COAT {a}

[gcode_macro SLOTDIE_START]
description: Queue SLOTDIE_COAT in the background and return immediately
gcode:
    {% set raw = rawparams|default('')|replace('"', '')|replace("'", '') %}
    {% if printer["gcode_macro _SD_QUEUE"].args %}
        { action_raise_error("A background run is already queued. SLOTDIE_CANCEL to clear it.") }
    {% endif %}
    {% if 'LAYER' not in raw|upper %}
        { action_raise_error("SLOTDIE_START needs LAYER=QD or LAYER=AGNW.") }
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_SD_QUEUE VARIABLE=args VALUE="'{raw}'"
    UPDATE_DELAYED_GCODE ID=_SD_RUN_DEFERRED DURATION={params.DELAY|default(0.5)|float}
    RESPOND MSG="queued in background with args {raw if raw else 'none'}"

[gcode_macro SLOTDIE_CANCEL]
description: Cancel a queued background run
gcode:
    UPDATE_DELAYED_GCODE ID=_SD_RUN_DEFERRED DURATION=0
    SET_GCODE_VARIABLE MACRO=_SD_QUEUE VARIABLE=args VALUE="''"
    RESPOND MSG="background run cancelled"

[gcode_macro SLOTDIE_STATUS]
description: Report whether a background run is pending
gcode:
    {% set a = printer["gcode_macro _SD_QUEUE"].args %}
    RESPOND MSG="{'pending with args ' ~ a if a else 'nothing queued'}"


#=============================================================================
# SLOTDIE_SETTINGS [LAYER=QD|AGNW] [KEY=VALUE ...]
#
# Print the coating settings and compute how much sample a run will use.
# Accepts the same per-run overrides as SLOTDIE_COAT, so you can preview:
#
#   SLOTDIE_SETTINGS                     both layers, effective settings
#   SLOTDIE_SETTINGS LAYER=QD NDEV=2     preview one layer with overrides
#
# Volume uses the same math as SLOTDIE_COAT:
#   E = QD_UL if > 0 else QD_W x QD_WET x length / 1000
#
# It also reports the die dead volume from DIE_R and DIE_SLIT, which is the
# realistic floor on PURGE_UL. The manifold holds far more than a pass does,
# and that ratio is the thing to look at before committing scarce QD ink.
#=============================================================================
[gcode_macro SLOTDIE_SETTINGS]
description: Print coating settings and compute total sample volume for a run
gcode:
    {% set tbl = printer["gcode_macro _SD_PARAMS"].table %}
    {% set sv  = printer.save_variables.variables %}
    {% set known = tbl|map(attribute=0)|list %}

    {% set lay = params.LAYER|default('BOTH')|upper %}
    {% if lay not in ['QD', 'AGNW', 'BOTH'] %}
        { action_raise_error("LAYER must be QD, AGNW or BOTH") }
    {% endif %}

    {% for k in params %}
    {% if k not in ['LAYER', 'ZLIST'] and k not in known %}
        { action_raise_error("Unknown parameter '%s'. Run SLOTDIE_HELP for valid keys." % k) }
    {% endif %}
    {% endfor %}

    {% set p = namespace(v = {}) %}
    {% for row in tbl %}
    {% set _ = p.v.update({row[0]: params[row[0]]|default(sv.get('sd_' ~ row[0]|lower, row[2]))|float}) %}
    {% endfor %}
    {% set v = p.v %}

    {% set ND = v.NDEV|int %}
    {% set zraw = params.ZLIST|default(sv.get('sd_zlist', ''))|string %}
    {% set zn = namespace(z = []) %}
    {% for t in (zraw|replace('[','')|replace(']','')).split(',') %}
    {% if t|trim %}
    {% set zn.z = zn.z + [t|trim|float] %}
    {% endif %}
    {% endfor %}

    # ---- QD pass ----
    {% set qd_len = (v.QD_Y1 - v.QD_Y0)|abs %}
    {% set qd_ea  = (v.QD_UL if v.QD_UL > 0 else v.QD_W * v.QD_WET * qd_len / 1000.0)|round(3) %}
    {% set qd_pf  = (v.PUMP_F if v.PUMP_F > 0 else qd_ea * v.FW / qd_len)|round(1) %}
    {% set qd_fw  = (v.PUMP_F * qd_len / qd_ea if v.PUMP_F > 0 and qd_ea > 0 else v.FW)|round(1) %}

    # ---- AgNW pass ----
    {% set nw_len = (v.NW_Y1 - v.NW_Y0)|abs %}
    {% set nw_ea  = (v.NW_UL if v.NW_UL > 0 else v.NW_W * v.NW_WET * nw_len / 1000.0)|round(3) %}
    {% set nw_pf  = (v.PUMP_F if v.PUMP_F > 0 else nw_ea * v.FW / nw_len)|round(1) %}
    {% set nw_fw  = (v.PUMP_F * nw_len / nw_ea if v.PUMP_F > 0 and nw_ea > 0 else v.FW)|round(1) %}

    # ---- die dead volume: cylinder plus two hemispherical end caps ----
    {% set die_v = (3.14159265 * v.DIE_R * v.DIE_R * v.DIE_SLIT
                    + 4.0 / 3.0 * 3.14159265 * v.DIE_R * v.DIE_R * v.DIE_R)|round(1) %}

    # ---- purge, off substrate ----
    {% set purge_vol = (0.0 if v.SKIP_PURGE|int == 1 else v.PURGE_UL) %}
    {% set purge_s   = (purge_vol / v.PURGE_F * 60.0 if v.PURGE_F > 0 else 0.0) %}
    {% set purge_ok  = "ok, exceeds the manifold" if purge_vol >= die_v else ("TOO SMALL, manifold needs " ~ ('%.0f' % die_v) if purge_vol > 0 else "skipped") %}

    # ---- prime pass, on the priming slide ----
    {% set pr_len = (v.PRIME_Y1 - v.PRIME_Y0)|abs %}
    {% set pr_w   = v.NW_W   if lay == 'AGNW' else v.QD_W %}
    {% set pr_wet = v.NW_WET if lay == 'AGNW' else v.QD_WET %}
    {% set prime_vol = (0.0 if v.SKIP_PRIME|int == 1 else (v.PRIME_UL if v.PRIME_UL > 0 else pr_w * pr_wet * pr_len / 1000.0))|round(3) %}

    # ---- firmware tail after the gantry stops: DD, retract, RD ----
    {% set retract_ms = (v.RETRACT_UL / v.RETRACT_F * 60000.0 if v.RETRACT_F > 0 else 0.0) %}
    {% set tail_ms = v.PUMP_DD + retract_ms + v.RETRACT_D %}
    {% set tail_ok = "ok, covers the tail" if v.DWELL >= tail_ms else "TOO SHORT, raise DWELL to at least " ~ ('%.0f' % tail_ms) %}
    {% set qd_all = qd_ea * ND %}
    {% set nw_all = nw_ea * ND %}

    RESPOND MSG="=== slot die coating settings ==="
    RESPOND MSG="origins    DEV {'%.2f' % v.DEV_X} {'%.2f' % v.DEV_Y} {'%.2f' % v.DEV_Z}   PRM {'%.2f' % v.PRM_X} {'%.2f' % v.PRM_Y} {'%.2f' % v.PRM_Z}   PRG {'%.2f' % v.PRG_X} {'%.2f' % v.PRG_Y} {'%.2f' % v.PRG_Z}"
    RESPOND MSG="geometry   NDEV {ND}  DEV_DX {'%.2f' % v.DEV_DX}  CX {'%.2f' % v.CX}"
    RESPOND MSG="slides     DEV {'%.0f' % v.DEV_SX} by {'%.0f' % v.DEV_SY} (X by Y)   PRM {'%.0f' % v.PRM_SX} by {'%.0f' % v.PRM_SY} (X by Y)"
    RESPOND MSG="pump feed  PUMP_F {'%.1f' % v.PUMP_F} (0 = derive)  PURGE_F {'%.1f' % v.PURGE_F} uL/min"
    RESPOND MSG="gantry     FW {'%.0f' % v.FW}  FT {'%.0f' % v.FT}  FZ {'%.0f' % v.FZ}  FPARK {'%.0f' % v.FPARK} mm/min"
    RESPOND MSG="Z          ZHOP {'%.2f' % v.ZHOP}  ZSAFE {'%.2f' % v.ZSAFE}  ZPARK {'%.2f' % v.ZPARK}"
    {% if v.ZSAFE > 0.0 %}
    RESPOND MSG="           every XY traverse runs at Z {'%.2f' % v.ZSAFE}"
    {% else %}
    RESPOND MSG="           ZSAFE is 0, traverses run at coating Z plus ZHOP. If anything"
    RESPOND MSG="           between the stations is taller than a slide, set ZSAFE."
    {% endif %}
    {% if zn.z|length > 0 %}
    RESPOND MSG="z list     {zn.z|length} entries, {zn.z|join(' ')}  -- overrides DEV_Z per slide"
    {% else %}
    RESPOND MSG="z list     none, every slide uses DEV_Z plus DEV_DZ"
    {% endif %}
    RESPOND MSG="trigger    TD {'%.0f' % v.TD}  PRE_TD {'%.0f' % v.PRE_TD}  SETTLE {'%.0f' % v.SETTLE}  WETUP {'%.0f' % v.WETUP}  DWELL {'%.0f' % v.DWELL} ms"
    RESPOND MSG="--- volume, pump feed and effective gantry speed per pass ---"
    {% if lay in ['QD', 'BOTH'] %}
    RESPOND MSG="QD         {'%.3f' % qd_ea} uL   pump {'%.1f' % qd_pf} uL/min   gantry {'%.0f' % qd_fw} mm/min   (Y {'%.1f' % v.QD_Y1} to {'%.1f' % v.QD_Y0}, len {'%.1f' % qd_len} mm, W {'%.2f' % v.QD_W}, wet {'%.1f' % v.QD_WET} um)"
    {% endif %}
    {% if lay in ['AGNW', 'BOTH'] %}
    RESPOND MSG="AgNW       {'%.3f' % nw_ea} uL   pump {'%.1f' % nw_pf} uL/min   gantry {'%.0f' % nw_fw} mm/min   (Y {'%.1f' % v.NW_Y1} to {'%.1f' % v.NW_Y0}, len {'%.1f' % nw_len} mm, W {'%.2f' % v.NW_W}, wet {'%.1f' % v.NW_WET} um)"
    {% endif %}
    RESPOND MSG="--- charging the die, two operations ---"
    RESPOND MSG="purge      {'%.3f' % purge_vol} uL at {'%.1f' % v.PURGE_F} uL/min, takes {'%.1f' % purge_s} s, off substrate  -- {purge_ok}"
    RESPOND MSG="prime pass {'%.3f' % prime_vol} uL over local Y {'%.1f' % v.PRIME_Y1} to {'%.1f' % v.PRIME_Y0}, len {'%.1f' % pr_len} mm, at coating conditions"
    RESPOND MSG="manifold   {'%.1f' % die_v} uL for DIE_R {'%.2f' % v.DIE_R} and DIE_SLIT {'%.2f' % v.DIE_SLIT}"
    RESPOND MSG="This is what it costs to charge the die, and it is not recoverable."
    RESPOND MSG="--- pinch valve and firmware timing ---"
    RESPOND MSG="valve      MASK {v.MASK|int}  per pass {v.VALVE_PER_PASS|int}  settle {'%.0f' % v.VALVE_SETTLE} ms each way"
    RESPOND MSG="WETUP      {'%.0f' % v.WETUP} ms, needs to cover TD {'%.0f' % v.TD} ms plus bead formation"
    RESPOND MSG="pump tail  DD {'%.0f' % v.PUMP_DD} plus retract {'%.0f' % retract_ms} plus RD {'%.0f' % v.RETRACT_D} equals {'%.0f' % tail_ms} ms"
    RESPOND MSG="DWELL      {'%.0f' % v.DWELL} ms  -- {tail_ok}"
    RESPOND MSG="--- total for the run ---"
    {% if lay in ['QD', 'BOTH'] %}
    RESPOND MSG="QD         {ND} x {'%.3f' % qd_ea} uL = {'%.3f' % qd_all} uL"
    {% endif %}
    {% if lay in ['AGNW', 'BOTH'] %}
    RESPOND MSG="AgNW       {ND} x {'%.3f' % nw_ea} uL = {'%.3f' % nw_all} uL"
    {% endif %}
    RESPOND MSG="purge      {'%.3f' % purge_vol} uL   prime {'%.3f' % prime_vol} uL"
    {% if lay == 'QD' %}
    RESPOND MSG="TOTAL      {'%.3f' % (qd_all + prime_vol + purge_vol)} uL drawn, of which {'%.3f' % qd_all} uL lands on devices"
    {% elif lay == 'AGNW' %}
    RESPOND MSG="TOTAL      {'%.3f' % (nw_all + prime_vol + purge_vol)} uL drawn, of which {'%.3f' % nw_all} uL lands on devices"
    {% else %}
    RESPOND MSG="TOTAL      {'%.3f' % (qd_all + nw_all + prime_vol + purge_vol)} uL drawn, of which {'%.3f' % (qd_all + nw_all)} uL lands on devices"
    {% endif %}


#=============================================================================
# CALIBRATION
#
# Two macros. SLOTDIE_CAL_LADDER steps one parameter across several slides.
# SLOTDIE_CAL_WEDGE sweeps the coating gap continuously within one pass, so a
# single slide gives the whole gap window instead of one point per slide.
#
# RECOMMENDED ORDER. Each stage depends on the one before it, so running them
# out of order means re-running them.
#
#   1. WEDGE, gap            one slide, ZSTART to ZEND
#      The gap sets whether a bead forms at all. Everything else is measured
#      at a fixed gap, so this comes first. Read off the Y range that coated
#      cleanly, convert to gap with the table the macro prints, then
#      SET_COAT_ORIGIN with that Z.
#
#   2. LADDER PARAM=FW       four slides, speed
#      At the chosen gap, find the speed range where the bead stays stable.
#      Too fast and the bead breaks into ribs. Too slow and it floods.
#
#   3. Measure QD_W          scan the slides from stage 2
#      Coated width is an OUTPUT, not an input. Measure it against the copper
#      tape, then SLOTDIE_SET QD_W to the measured value. Every derived volume
#      downstream depends on this number being real.
#
#   4. LADDER PARAM=WETUP    four slides, lead-in
#      Too short leaves an uncoated head. Too long leaves a puddle. Measure
#      the distance from the commanded start to where the stripe reaches full
#      width, and pick the value that drives it toward zero.
#
#   5. LADDER PARAM=RETRACT_UL   four slides, tail
#      Same measurement at the other end. Watch DWELL, it has to stay longer
#      than DD plus the retract time. SLOTDIE_SETTINGS checks this.
#
#   6. LADDER PARAM=QD_WET   four slides, thickness
#      Only meaningful once the bead is stable and QD_W is real. Measure dry
#      film thickness, not stripe width.
#
# Run every stage with the mimic ink. None of it needs QD material.
#=============================================================================

[gcode_macro SLOTDIE_CAL_HELP]
description: Explain the calibration macros and the order to run them in
gcode:
    RESPOND MSG="=== slot die calibration ==="
    RESPOND MSG="Two macros. Run the stages in order, each depends on the last."
    RESPOND MSG=" "
    RESPOND MSG="0. charge     SLOTDIE_SET PURGE_UL=500 PURGE_F=2000 ZSAFE=120"
    RESPOND MSG="              The wedge and the ladder both purge then prime"
    RESPOND MSG="              before their first slide, same as SLOTDIE_COAT."
    RESPOND MSG=" "
    RESPOND MSG="1. gap        SLOTDIE_CAL_WEDGE LAYER=QD ZSTART=79.30 ZEND=79.00"
    RESPOND MSG="              One slide. Z ramps along the pass, so the whole gap"
    RESPOND MSG="              window appears on one stripe. Read the Y range that"
    RESPOND MSG="              coated cleanly off the printed table, then"
    RESPOND MSG="              SET_COAT_ORIGIN SLIDE=DEVICE with that Z."
    RESPOND MSG=" "
    RESPOND MSG="2. speed      SLOTDIE_CAL_LADDER LAYER=QD PARAM=FW FROM=300 TO=900 NSLIDE=4"
    RESPOND MSG="3. width      scan stage 2, measure stripe against the tape, then"
    RESPOND MSG="              SLOTDIE_SET QD_W=<measured>   width is an OUTPUT"
    RESPOND MSG="4. lead-in    SLOTDIE_CAL_LADDER LAYER=QD PARAM=WETUP FROM=200 TO=1400 NSLIDE=4"
    RESPOND MSG="5. tail       SLOTDIE_CAL_LADDER LAYER=QD PARAM=RETRACT_UL FROM=0 TO=6 NSLIDE=4"
    RESPOND MSG="6. thickness  SLOTDIE_CAL_LADDER LAYER=QD PARAM=QD_WET FROM=20 TO=80 NSLIDE=4"
    RESPOND MSG=" "
    RESPOND MSG="Both macros print a slide-to-value table BEFORE moving. Write it"
    RESPOND MSG="down, the machine does not record which slide got which value."
    RESPOND MSG="Run all of it with mimic ink. None of it needs QD material."


#-----------------------------------------------------------------------------
# SLOTDIE_CAL_LADDER LAYER= PARAM= FROM= TO= NSLIDE= [DEV_DX=] [KEY=VALUE ...]
#
# Coats NSLIDE slides, stepping PARAM linearly from FROM to TO. One variable
# at a time - anything else passed through is held constant across all slides.
#
# Charges on the first slide only, then skips both purge and prime. Pass
# SKIP_PURGE=1 SKIP_PRIME=1 to skip there too, for an already-charged die.
#-----------------------------------------------------------------------------
[gcode_macro SLOTDIE_CAL_LADDER]
description: Step one parameter across several slides, one value per slide
gcode:
    {% set tbl = printer["gcode_macro _SD_PARAMS"].table %}
    {% set sv  = printer.save_variables.variables %}
    {% set known = tbl|map(attribute=0)|list %}

    {% set lay = params.LAYER|default('')|upper %}
    {% if lay not in ['QD', 'AGNW'] %}
        { action_raise_error("LAYER must be QD or AGNW") }
    {% endif %}
    {% if 'PARAM' not in params or 'FROM' not in params or 'TO' not in params %}
        { action_raise_error("PARAM, FROM and TO are all required. Run SLOTDIE_CAL_HELP.") }
    {% endif %}

    {% set par = params.PARAM|upper %}
    {% if par not in known %}
        { action_raise_error("Unknown PARAM '%s'. Run SLOTDIE_HELP for valid keys." % par) }
    {% endif %}
    {% if par in ['DEV_X','DEV_Y','DEV_Z','PRM_X','PRM_Y','PRM_Z','PRG_X','PRG_Y','PRG_Z','NDEV','DEV_DX','SKIP_PRIME','SKIP_PURGE'] %}
        { action_raise_error("'%s' positions or counts slides, it cannot be laddered." % par) }
    {% endif %}

    {% for k in params %}
    {% if k not in ['LAYER','PARAM','FROM','TO','NSLIDE','ZLIST'] and k not in known %}
        { action_raise_error("Unknown parameter '%s'. Run SLOTDIE_HELP for valid keys." % k) }
    {% endif %}
    {% endfor %}

    {% set n  = params.NSLIDE|default(4)|int %}
    {% set a  = params.FROM|float %}
    {% set b  = params.TO|float %}
    {% if n < 1 %}
        { action_raise_error("NSLIDE must be 1 or more") }
    {% endif %}

    {% set dx  = params.DEV_DX|default(sv.get('sd_dev_dx', 30.0))|float %}
    {% set sx  = params.DEV_SX|default(sv.get('sd_dev_sx', 25.0))|float %}
    {% set bx  = params.DEV_X|default(sv.get('sd_dev_x', 0.0))|float %}
    {% set zpk = params.ZPARK|default(sv.get('sd_zpark', 100.0))|float %}
    {% set fpk = params.FPARK|default(sv.get('sd_fpark', 2000.0))|float %}
    {% set vb  = params.VERBOSE|default(1)|int %}
    {% set sp0 = params.SKIP_PRIME|default(sv.get('sd_skip_prime', 0.0))|int %}
    {% set su0 = params.SKIP_PURGE|default(sv.get('sd_skip_purge', 0.0))|int %}
    # Per-slide coating Z, entry i for slide i. The ladder hands each entry to
    # its single-slide SLOTDIE_COAT as an explicit DEV_Z, so the list is applied
    # exactly once, here, where the slide index actually exists.
    {% set zraw = params.ZLIST|default(sv.get('sd_zlist', ''))|string %}
    {% set zn = namespace(z = []) %}
    {% for t in (zraw|replace('[','')|replace(']','')).split(',') %}
    {% if t|trim %}
    {% set zn.z = zn.z + [t|trim|float] %}
    {% endif %}
    {% endfor %}
    {% set USEZ = zn.z|length > 0 %}
    {% if USEZ and zn.z|length < n %}
        { action_raise_error("The z list has %d entries but NSLIDE is %d. One entry per slide, or clear it with SLOTDIE_ZLIST CLEAR=1." % (zn.z|length, n)) }
    {% endif %}
    {% if n > 1 and dx|abs < sx %}
        { action_raise_error("DEV_DX is smaller than DEV_SX, slides would overlap.") }
    {% endif %}

    # pass through every other override unchanged
    {% set ns = namespace(extra = '') %}
    {% for k in params %}
    {% if k not in ['LAYER','PARAM','FROM','TO','NSLIDE','ZLIST','DEV_X','DEV_DX','SKIP_PRIME','SKIP_PURGE','VERBOSE'] %}
    {% set ns.extra = ns.extra ~ ' ' ~ k ~ '=' ~ params[k] %}
    {% endif %}
    {% endfor %}

    RESPOND MSG="=== calibration ladder, layer {lay}, {par} from {'%.4g' % a} to {'%.4g' % b} ==="
    RESPOND MSG="SLIDE / BED X / {par}{' / COAT Z' if USEZ else ''}     write this down before you start"
    {% for i in range(n) %}
    {% set val = a if n == 1 else a + (b - a) * i / (n - 1) %}
    RESPOND MSG="  {'%-5d' % (i + 1)} {'%9.2f' % (bx + i * dx)} {'%12.4f' % val}{'  ' ~ ('%9.3f' % zn.z[i]) if USEZ else ''}"
    {% endfor %}
    {% if USEZ %}
    RESPOND MSG="coat Z comes from the z list, not DEV_Z. {zn.z|length} entries stored."
    {% endif %}
    {% if ns.extra %}
    RESPOND MSG="held constant:{ns.extra}"
    {% endif %}

    # Park once, here, before the first slide. Each SLOTDIE_COAT then runs with
    # PARK=0 and ends at the traverse height, so the die does not climb to
    # ZPARK and back down between every slide. It parks again after the last.
    G90
    G1 Z{zpk} F{fpk}

    {% for i in range(n) %}
    {% set val = a if n == 1 else a + (b - a) * i / (n - 1) %}
    {% set sp  = sp0 if i == 0 else 1 %}
    {% set su  = su0 if i == 0 else 1 %}
    RESPOND MSG="--- slide {i + 1} of {n}, {par} = {'%.4f' % val} ---"
    SLOTDIE_COAT LAYER={lay} NDEV=1 PARK=0 DEV_X={bx + i * dx}{' DEV_Z=' ~ ('%.4f' % zn.z[i]) if USEZ else ''} SKIP_PRIME={sp} SKIP_PURGE={su} {par}={'%.4f' % val} VERBOSE={vb}{ns.extra}
    {% endfor %}

    G1 Z{zpk} F{fpk}
    RESPOND MSG="=== ladder complete, {n} slides, {par} {'%.4g' % a} to {'%.4g' % b} ==="
    RESPOND MSG="Scan at 1200 dpi with the copper tape as the scale bar."


#-----------------------------------------------------------------------------
# SLOTDIE_CAL_WEDGE LAYER= ZSTART= ZEND= [KEY=VALUE ...]
#
# One pass with Z ramping from ZSTART at the start of the pass to ZEND at the
# end. The whole gap window lands on one stripe, so you find the workable gap
# from a single slide instead of one slide per gap value.
#
# Z and Y move together in one coordinated G1. The Z travel is small next to
# the 52 mm of Y, so the write speed is within a fraction of a percent of FW.
#
# The flow is constant across the pass, so wet thickness is constant and the
# only thing changing is the gap. That is the point.
#-----------------------------------------------------------------------------
[gcode_macro SLOTDIE_CAL_WEDGE]
description: One pass with the coating gap ramping along it, to find the gap window
gcode:
    {% set tbl = printer["gcode_macro _SD_PARAMS"].table %}
    {% set sv  = printer.save_variables.variables %}
    {% set known = tbl|map(attribute=0)|list %}

    {% set lay = params.LAYER|default('')|upper %}
    {% if lay not in ['QD', 'AGNW'] %}
        { action_raise_error("LAYER must be QD or AGNW") }
    {% endif %}
    {% if 'ZSTART' not in params or 'ZEND' not in params %}
        { action_raise_error("ZSTART and ZEND are both required, in absolute machine Z like DEV_Z.") }
    {% endif %}
    {% for k in params %}
    {% if k not in ['LAYER','ZSTART','ZEND','YZERO','YONE'] and k not in known %}
        { action_raise_error("Unknown parameter '%s'. Run SLOTDIE_HELP for valid keys." % k) }
    {% endif %}
    {% endfor %}

    {% set p = namespace(v = {}) %}
    {% for row in tbl %}
    {% set _ = p.v.update({row[0]: params[row[0]]|default(sv.get('sd_' ~ row[0]|lower, row[2]))|float}) %}
    {% endfor %}
    {% set v = p.v %}

    {% set za = params.ZSTART|float %}
    {% set zb = params.ZEND|float %}
    {% set VB = v.VERBOSE|int %}
    {% set DRY = v.DRYRUN|int %}

    {% if v.DEV_X == 0.0 and v.DEV_Y == 0.0 %}
        { action_raise_error("No device coat origin stored. Run SET_COAT_ORIGIN SLIDE=DEVICE X= Y= Z= first.") }
    {% endif %}
    {% set zhi = za if za > zb else zb %}
    {% set ZT = v.ZSAFE if v.ZSAFE > 0.0 else (zhi + v.ZHOP) %}
    {% if v.ZSAFE > 0.0 and v.ZSAFE > v.ZPARK %}
        { action_raise_error("ZSAFE must not be above ZPARK.") }
    {% endif %}
    {% if v.ZSAFE > 0.0 and v.ZSAFE < zhi %}
        { action_raise_error("ZSAFE is below the higher of ZSTART and ZEND, the die would drag across the slide.") }
    {% endif %}
    {% if ZT >= v.ZPARK %}
        { action_raise_error("The traverse height is at or above ZPARK. Lower ZSAFE, or lower ZSTART and ZEND.") }
    {% endif %}

    # Calibration runs on bare glass between the tapes. Unlike a device pass,
    # the wedge must NOT start on the foil: it is sweeping the gap window, so a
    # 0.07 mm foil step at the start would masquerade as a result. Default the
    # far end clear of the top tape at TAPE_B_START. Override with YONE.
    {% set Y0  = params.YZERO|default(v.QD_Y0 if lay == 'QD' else v.NW_Y0)|float %}
    {% set Y1  = params.YONE|default(v.TAPE_B_START - 0.65)|float %}
    {% set W   = v.QD_W   if lay == 'QD' else v.NW_W %}
    {% set WET = v.QD_WET if lay == 'QD' else v.NW_WET %}
    {% set UL  = v.QD_UL  if lay == 'QD' else v.NW_UL %}
    {% if Y1 > v.TAPE_B_START or Y0 < v.TAPE_A_END %}
        { action_raise_error("Wedge pass would run onto the copper tape. Keep YONE below TAPE_B_START and YZERO above TAPE_A_END.") }
    {% endif %}
    {% if Y1 <= Y0 %}
        { action_raise_error("YONE must be greater than YZERO, the pass runs in -Y.") }
    {% endif %}
    {% set L   = (Y1 - Y0)|abs %}
    {% set E   = (UL if UL > 0 else W * WET * L / 1000.0)|round(3) %}
    {% set F   = (v.PUMP_F if v.PUMP_F > 0 else E * v.FW / L)|round(1) %}
    {% set FWE = (v.PUMP_F * L / E if v.PUMP_F > 0 and E > 0 else v.FW)|round(1) %}

    RESPOND MSG="=== gap wedge, layer {lay} ==="
    RESPOND MSG="Z ramps {'%.3f' % za} to {'%.3f' % zb} over local Y {'%.1f' % Y1} down to {'%.1f' % Y0}"
    RESPOND MSG="volume {'%.3f' % E} uL at {'%.1f' % F} uL/min, constant flow, gap is the only variable"
    RESPOND MSG="LOCAL Y / MACHINE Z     read the clean range off the slide, then"
    RESPOND MSG="                        SET_COAT_ORIGIN SLIDE=DEVICE with that Z"
    {% for i in range(6) %}
    {% set yy = Y1 - (Y1 - Y0) * i / 5 %}
    {% set zz = za + (zb - za) * i / 5 %}
    RESPOND MSG="  {'%8.1f' % yy} {'%10.3f' % zz}"
    {% endfor %}

    {% set ox = v.DEV_X %}
    {% set oy = v.DEV_Y %}
    G90
    {% if DRY and VB %}
    RESPOND MSG="dryrun, motion only, no pump commands and no pump dwells"
    {% endif %}
    {% if not DRY %}
    SEND_PUMP_ARDUINO COMMAND="TRIGGERON"
    G4 P{v.TRIG_ON_DWELL|int}
    {% endif %}

    # ---- charge the die: purge off substrate, then one prime pass ----
    # Overrides are forwarded, same as SLOTDIE_COAT. ZSTART, ZEND, YZERO and
    # YONE are wedge-only and are not table keys, so they must NOT go through
    # or the charge macros reject them as unknown parameters.
    {% set ns = namespace(fwd = '') %}
    {% for k in params %}
    {% if k not in ['LAYER', 'ZSTART', 'ZEND', 'YZERO', 'YONE', 'DRYRUN', 'VERBOSE'] %}
    {% set ns.fwd = ns.fwd ~ ' ' ~ k ~ '=' ~ params[k] %}
    {% endif %}
    {% endfor %}
    SLOTDIE_PURGE ARM=0 DRYRUN={DRY} VERBOSE={VB}{ns.fwd}
    SLOTDIE_PRIME ARM=0 LAYER={lay} DRYRUN={DRY} VERBOSE={VB}{ns.fwd}

    G1 Z{ZT} F{v.FZ}
    G1 X{ox + v.CX} Y{oy + Y1} F{v.FT}
    G1 Z{za} F{v.FZ}
    {% if not DRY %}
    SEND_PUMP_ARDUINO COMMAND="VALVEOPEN MASK={v.MASK|int}"
    SEND_PUMP_ARDUINO COMMAND="TD {v.TD|int}"
    G4 P{v.PRE_TD|int}
    SEND_PUMP_ARDUINO COMMAND="SDISPENSE MASK={v.MASK|int} P{'%.3f' % v.PASS_P} PF{'%.1f' % v.PASS_PF} PD{v.PASS_PD|int} E{E} F{F} DD{v.PUMP_DD|int} R{'%.3f' % v.RETRACT_UL} RF{'%.1f' % v.RETRACT_F} RD{v.RETRACT_D|int}"
    G4 P{v.SETTLE|int}
    TRIGGER_FIRE
    {% endif %}
    G4 P{v.WETUP|int}
    G1 Y{oy + Y0} Z{zb} F{FWE}
    G4 P{v.DWELL|int}
    {% if not DRY %}
    SEND_PUMP_ARDUINO COMMAND="VALVECLOSE MASK={v.MASK|int}"
    {% endif %}
    G1 Z{v.ZPARK} F{v.FPARK}
    G4 P{v.END_DWELL|int}
    RESPOND MSG="wedge complete. Scan at 1200 dpi, find where the stripe is clean,"
    RESPOND MSG="convert that local Y to Z with the table above."