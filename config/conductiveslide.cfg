#=============================================================================
# conductiveslide.cfg   v3
#
# Silver trace deposition on ITO device slides. One prime on a sacrificial
# slide, then straight through the pattern.
#
# Slide sizes are parameters, not assumptions: DEV_SX / DEV_SY for the device
# slides and PRM_SX / PRM_SY for the priming slide, named by bed axis rather
# than by length and width so orientation is unambiguous. Defaults are the
# standard 25 x 75 mm microscope slide, device long axis along Y.
#
#   AG_HELP                 list every parameter, unit, default, current value
#   AG_WHERE                report current toolhead position (read, don't store)
#   SET_SLIDE_ORIGIN        store a slide origin - X, Y and Z all REQUIRED
#   AG_SET                  change any default persistently
#   AG_RESET_DEFAULTS       clear stored defaults back to built-in values
#   AG_PRINT_DEVICE        run the pattern
#
# PARAMETER RESOLUTION, in order:
#   1. value passed on the command line        AG_PRINT_DEVICE TD=60
#   2. persistent default set via AG_SET       AG_SET TD=60
#   3. built-in default compiled below
#
# NAMING: PRM_ prefix is the priming SLIDE origin. PRIME_ prefix is the prime
# DISPENSE itself.
#
# Z NOTE: DEV_Z and PRM_Z are the actual machine Z at which the tip writes,
# in the same frame as ZPARK. No assumption is made about their magnitude; the
# only check is that write height plus ZHOP stays below ZPARK.
#
# NAMING CAVEAT: Klipper resolves a command name with
#   args_r = re.compile('([A-Z_]+|[\*/])')   then   cmd = parts[1] + parts[2]
# which is the first letter-run plus the first digit-run. A macro name with a
# digit in the middle is therefore truncated at that digit and the remainder
# becomes a stray argument: AG_DEVICE_2SLIDE resolves to AG_DEVICE_2. Keep
# digits out of macro names, or put them only at the very end.
#
# RESPOND CAVEAT: Klipper strips  asterisk, hash and semicolon  from extended
# command arguments before parsing them, so a RESPOND MSG containing any of
# those three truncates mid-string and fails as "Malformed command". Keep them
# out of every RESPOND in this file. action_raise_error is unaffected.
#
# Volume and pump-feed parameters accept 0 to mean "derive from path length"
# using K_LINE / K_FILL. Pass a non-zero value to override with a literal.
#
#
# BED LAYOUT (looking down, +X right, +Y away)
#
#          PRM_X                                        PRM_X+75
#             +---------------------------------------------+  PRM_Y+25
#             |   PRIMING SLIDE  (PRM_SX by PRM_SY)         |
#             |                                          *  |  * prime at
#             |                                             |    PRIME_LOC_X/Y
#             +---------------------------------------------+  PRM_Y
#                          (Y gap - no travel writing)
#                       DEV_X +-------------+ +-------------+
#                             |  top pad    | |  top pad    |  TP_Y..TP_Y+TP_H
#                             | =========== | | =========== |
#                             | - -scribe- -| | - -scribe- -|  manual
#                             | | | | |     | | | | | |     |  FG_Y0..FG_Y1
#                             | | | | |     | | | | | |     |  x = MX+i*FPITCH
#                             | =========== | | =========== |  BC_Y..BC_Y+BC_H
#                             +-------------+ +-------------+
#                              slide 1         slide 2        DEV_Y
#                              |<-- DEV_DX -->|
#
# Device slides are the reference figure rotated 90 deg:
#   figure-x (75 mm length) -> bed Y     figure-y (25 mm width) -> bed X
#=============================================================================


#-----------------------------------------------------------------------------
# REQUIRED: persistent storage. Delete this stanza if printer.cfg already has
# one - Klipper permits only a single [save_variables] instance.
#-----------------------------------------------------------------------------
[save_variables]
filename: ~/printer_data/config/saved_variables.cfg


#=============================================================================
# PARAMETER TABLE
#
# Single source of truth. AG_HELP prints from it, AG_SET validates against it,
# AG_PRINT_DEVICE resolves from it. Add a row and it appears in all three.
# Fields: key, unit, built-in default, description
#=============================================================================
[gcode_macro _AG_PARAMS]
description: Parameter table - not called directly
variable_table: [
    ["DEV_X",        "mm",     0.0,     "Device slide 1 origin, bed X of min-X corner"],
    ["DEV_Y",        "mm",     0.0,     "Device slide 1 origin, bed Y of min-Y corner"],
    ["DEV_Z",        "mm",     0.0,     "Device slide write height, bed Z"],
    ["PRM_X",        "mm",     0.0,     "Priming slide origin, bed X of min-X corner"],
    ["PRM_Y",        "mm",     0.0,     "Priming slide origin, bed Y of min-Y corner"],
    ["PRM_Z",        "mm",     0.0,     "Priming slide write height, bed Z"],
    ["DEV_SX",       "mm",     25.0,    "Device slide size along bed X (short axis)"],
    ["DEV_SY",       "mm",     75.0,    "Device slide size along bed Y (long axis)"],
    ["PRM_SX",       "mm",     75.0,    "Priming slide size along bed X (long axis)"],
    ["PRM_SY",       "mm",     25.0,    "Priming slide size along bed Y (short axis)"],
    ["NDEV",         "count",  1.0,     "Number of device slides to pattern"],
    ["DEV_DX",       "mm",     30.0,    "X pitch from one device slide to the next"],
    ["DEV_DY",       "mm",     0.0,     "Y offset per additional device slide"],
    ["DEV_DZ",       "mm",     0.0,     "Z offset per additional device slide"],
    ["TRIG_ON_DWELL","ms",     500.0,   "Dwell after TRIGGERON, before the prime"],
    ["PRIME_UL",     "uL",     13.2,    "Prime volume, dispensed once at the start"],
    ["PRIME_F",      "uL/min", 410.0,   "Pump feed rate for the prime dispense"],
    ["PRIME_LOC_X",  "mm",     68.0,    "Prime location, local X on the priming slide"],
    ["PRIME_LOC_Y",  "mm",     22.0,    "Prime location, local Y on the priming slide"],
    ["PRIME_SETTLE", "ms",     10.0,    "Dwell between prime SDISPENSE and TRIGGER_FIRE"],
    ["PRIME_DWELL",  "ms",     2000.0,  "Dwell after prime TRIGGER_FIRE, before travelling off"],
    ["SKIP_PRIME",   "0/1",    0.0,     "1 = skip the prime (line already charged)"],
    ["TRACE_UL",     "uL",     0.0,     "Per-finger volume (0 = derive from length)"],
    ["PAD_UL",       "uL",     0.0,     "Per-pad fill volume (0 = derive from path)"],
    ["K_LINE",       "uL/mm",  0.10870, "Line ink rate, from 5.0 uL / 46 mm"],
    ["K_FILL",       "uL/mm",  0.05172, "Raster ink rate, from 6.0 uL / 116 mm path"],
    ["PUMP_F",       "uL/min", 0.0,     "Pump feed while writing (0 = derive from UL and FW)"],
    ["FW",           "mm/min", 1500.0,  "Gantry feed while dispensing"],
    ["FT",           "mm/min", 3000.0,  "Gantry feed for XY travel"],
    ["FZ",           "mm/min", 1000.0,  "Gantry feed for Z moves"],
    ["TD",           "ms",     40.0,    "Trigger-to-dispense gantry lead sent to pump"],
    ["PRE_TD",       "ms",     50.0,    "Dwell after the TD command"],
    ["SETTLE",       "ms",     10.0,    "Dwell between SDISPENSE and TRIGGER_FIRE"],
    ["DWELL",        "ms",     100.0,   "Dwell after a feature completes, before lift"],
    ["MX",           "mm",     5.0,     "Device slide X margin, both sides"],
    ["MY",           "mm",     10.0,    "Device slide Y margin, both ends"],
    ["NFING",        "count",  4.0,     "Number of fingers"],
    ["FPITCH",       "mm",     5.0,     "Finger pitch in X"],
    ["FG_Y0",        "mm",     24.0,    "Finger end Y, local (writing stops here)"],
    ["FG_Y1",        "mm",     60.0,    "Finger start Y, local (writing starts here, -Y)"],
    ["BC_Y",         "mm",     10.0,    "Bottom contact pad start Y, local"],
    ["BC_H",         "mm",     9.0,     "Bottom contact pad height in Y"],
    ["TP_Y",         "mm",     56.0,    "Top pad start Y, local"],
    ["TP_H",         "mm",     9.0,     "Top pad height in Y"],
    ["RPITCH",       "mm",     0.6,     "Raster line pitch for pad fills"],
    ["ZHOP",         "mm",     5.0,     "Travel height above write height"],
    ["ZPARK",        "mm",     80.0,    "Absolute Z to park at on completion"],
    ["FPARK",        "mm/min", 2000.0,  "Z feed for the final park move"],
    ["END_DWELL",    "ms",     250.0,   "Dwell at the end of the run"],
    ["DRYRUN",       "0/1",    0.0,     "1 = run all motion with no pump commands"],
    ["VERBOSE",      "0/1",    1.0,     "0 = suppress all RESPOND output from the run"]
    ]
gcode:
    RESPOND MSG="_AG_PARAMS is a table, not a command. Run AG_HELP."


#-----------------------------------------------------------------------------
# AG_HELP [FILTER=<substring>]
#-----------------------------------------------------------------------------
[gcode_macro AG_HELP]
description: List every AG_PRINT_DEVICE parameter with unit, default and current value
gcode:
    {% set tbl = printer["gcode_macro _AG_PARAMS"].table %}
    {% set sv  = printer.save_variables.variables %}
    {% set flt = params.FILTER|default('')|upper %}
    RESPOND MSG="=== AG_PRINT_DEVICE parameters ==="
    RESPOND MSG="KEY / UNIT / BUILT-IN / CURRENT     a marker of > means set via AG_SET"
    {% for row in tbl %}
    {% if flt == '' or flt in row[0] or flt in row[3]|upper %}
    {% set k = 'ag_' ~ row[0]|lower %}
    {% set cur = sv.get(k, row[2])|float %}
    {% set mark = '>' if k in sv else ' ' %}
    RESPOND MSG="{mark}{'%-13s' % row[0]} {'%-7s' % row[1]} {'%10.5f' % row[2]} {'%10.5f' % cur}  {row[3]}"
    {% endif %}
    {% endfor %}
    RESPOND MSG="--- usage ---"
    RESPOND MSG="AG_PRINT_DEVICE TD=60 FW=1200 TRACE_UL=4.2   (per-run override)"
    RESPOND MSG="AG_SET TD=60 FW=1200                          (persistent default)"
    RESPOND MSG="AG_HELP FILTER=PRIME                          (filter this list)"
    RESPOND MSG="Slide sizes are DEV_SX DEV_SY PRM_SX PRM_SY, default 25 and 75."
    RESPOND MSG="--- example, two device slides side by side ---"
    RESPOND MSG="1. jog tip to device slide 1 min-X min-Y corner at write height"
    RESPOND MSG="2. AG_WHERE                    reads the position, stores nothing"
    RESPOND MSG="3. SET_SLIDE_ORIGIN SLIDE=DEVICE X=100.00 Y=40.00 Z=2.35"
    RESPOND MSG="4. jog to priming slide min-X min-Y corner, AG_WHERE, then"
    RESPOND MSG="   SET_SLIDE_ORIGIN SLIDE=PRIME X=75.00 Y=125.00 Z=2.35"
    RESPOND MSG="5. jog to device slide 2 min-X corner and read X with AG_WHERE."
    RESPOND MSG="   DEV_DX is that X minus slide 1 X. Must be DEV_SX or more."
    RESPOND MSG="6. AG_PRINT_DEVICE NDEV=2 DEV_DX=30 DRYRUN=1     motion only"
    RESPOND MSG="7. AG_PRINT_DEVICE NDEV=2 DEV_DX=30              live run"
    RESPOND MSG="Only slide 1 is stored. Slide 2 is slide 1 plus DEV_DX DEV_DY DEV_DZ."
    RESPOND MSG="One prime covers all slides. Add SKIP_PRIME=1 if line is already wet."


#-----------------------------------------------------------------------------
# AG_WHERE - report position so you can read values, type them, and own them
#-----------------------------------------------------------------------------
[gcode_macro AG_WHERE]
description: Print current toolhead position. Does not store anything.
gcode:
    {% set p = printer.gcode_move.gcode_position %}
    {% set h = printer.gcode_move.homing_origin %}
    RESPOND MSG="position X {'%.3f' % p.x} Y {'%.3f' % p.y} Z {'%.3f' % p.z}"
    RESPOND MSG="gcode offset X {'%.3f' % h.x} Y {'%.3f' % h.y} Z {'%.3f' % h.z}"


#-----------------------------------------------------------------------------
# SET_SLIDE_ORIGIN SLIDE=DEVICE|PRIME X=<mm> Y=<mm> Z=<mm>
# All three coordinates are required. Nothing is inferred from gantry position.
#-----------------------------------------------------------------------------
[gcode_macro SET_SLIDE_ORIGIN]
description: Store a slide origin. SLIDE, X, Y and Z are all required.
gcode:
    {% set s = params.SLIDE|default('')|upper %}
    {% if s not in ['DEVICE', 'PRIME'] %}
        { action_raise_error("SLIDE must be DEVICE or PRIME") }
    {% endif %}
    {% if 'X' not in params or 'Y' not in params or 'Z' not in params %}
        { action_raise_error("X, Y and Z are all required. Use AG_WHERE to read the gantry position, then type the values.") }
    {% endif %}
    {% set k = 'dev' if s == 'DEVICE' else 'prm' %}
    {% set x = params.X|float %}
    {% set y = params.Y|float %}
    {% set z = params.Z|float %}
    SAVE_VARIABLE VARIABLE=ag_{k}_x VALUE={x}
    SAVE_VARIABLE VARIABLE=ag_{k}_y VALUE={y}
    SAVE_VARIABLE VARIABLE=ag_{k}_z VALUE={z}
    RESPOND MSG="stored {s|lower} origin, X {'%.3f' % x} Y {'%.3f' % y} Z {'%.3f' % z}"


#-----------------------------------------------------------------------------
# AG_SET KEY=VALUE [KEY=VALUE ...]  - persist one or more defaults
#-----------------------------------------------------------------------------
[gcode_macro AG_SET]
description: Persistently change one or more defaults. AG_HELP lists valid keys.
gcode:
    {% set tbl = printer["gcode_macro _AG_PARAMS"].table %}
    {% set known = tbl|map(attribute=0)|list %}
    {% if params|length == 0 %}
        { action_raise_error("AG_SET needs at least one KEY=VALUE. Run AG_HELP for the list.") }
    {% endif %}
    {% for k in params %}
    {% if k not in known %}
        { action_raise_error("Unknown parameter '%s'. Run AG_HELP for valid keys." % k) }
    {% endif %}
    {% endfor %}
    {% for k in params %}
    SAVE_VARIABLE VARIABLE=ag_{k|lower} VALUE={params[k]|float}
    RESPOND MSG="stored {k|lower} as {params[k]|float}"
    {% endfor %}


#-----------------------------------------------------------------------------
# AG_RESET_DEFAULTS [CONFIRM=1] - clear stored overrides, keep slide origins
#-----------------------------------------------------------------------------
[gcode_macro AG_RESET_DEFAULTS]
description: Clear AG_SET overrides back to built-in defaults. Origins are kept.
gcode:
    {% if params.CONFIRM|default(0)|int != 1 %}
        RESPOND MSG="This clears all AG_SET overrides. Re-run as AG_RESET_DEFAULTS CONFIRM=1"
    {% else %}
    {% set tbl = printer["gcode_macro _AG_PARAMS"].table %}
    {% set sv  = printer.save_variables.variables %}
    {% for row in tbl %}
    {% set k = 'ag_' ~ row[0]|lower %}
    {% if k in sv and row[0] not in ['DEV_X','DEV_Y','DEV_Z','PRM_X','PRM_Y','PRM_Z'] %}
    SAVE_VARIABLE VARIABLE={k} VALUE={row[2]|float}
    {% endif %}
    {% endfor %}
    RESPOND MSG="Defaults reset. Slide origins retained."
    {% endif %}


#-----------------------------------------------------------------------------
# HELPER: single straight trace, written in -Y
#-----------------------------------------------------------------------------
[gcode_macro _AG_TRACE]
description: One trace from Y1 down to Y0 at fixed X
gcode:
    {% set X  = params.X|float %}
    {% set Y0 = params.Y0|float %}
    {% set Y1 = params.Y1|float %}
    {% set ZW = params.ZW|float %}
    {% set ZT = params.ZT|float %}
    {% set FW = params.FW|float %}
    {% set FT = params.FT|float %}
    {% set FZ = params.FZ|float %}
    {% set UL = params.UL|float %}
    {% set K  = params.K|float %}
    {% set PF = params.PF|float %}
    {% set TD = params.TD|int %}
    {% set PRE_TD = params.PRE_TD|int %}
    {% set SETTLE = params.SETTLE|int %}
    {% set DWELL  = params.DWELL|int %}
    {% set DRY    = params.DRY|default(0)|int %}

    {% set L = (Y1 - Y0)|abs %}
    {% set E = (UL if UL > 0 else L * K)|round(3) %}
    {% set F = (PF if PF > 0 else E * FW / L)|round(1) %}

    G90
    G1 Z{ZT} F{FZ}
    G1 X{X} Y{Y1} F{FT}
    G1 Z{ZW} F{FZ}
    {% if not DRY %}
    SEND_PUMP_ARDUINO COMMAND="TD {TD}"
    G4 P{PRE_TD}
    SEND_PUMP_ARDUINO COMMAND="SDISPENSE MASK=1111 E{E} F{F}"
    G4 P{SETTLE}
    TRIGGER_FIRE
    {% endif %}
    G1 Y{Y0} F{FW}
    G4 P{DWELL}
    G1 Z{ZT} F{FZ}


#-----------------------------------------------------------------------------
# HELPER: boustrophedon raster fill, first stroke in -Y
#-----------------------------------------------------------------------------
[gcode_macro _AG_FILL]
description: Raster-fill a rectangle, first stroke in -Y
gcode:
    {% set X0 = params.X0|float %}
    {% set X1 = params.X1|float %}
    {% set Y0 = params.Y0|float %}
    {% set Y1 = params.Y1|float %}
    {% set ZW = params.ZW|float %}
    {% set ZT = params.ZT|float %}
    {% set FW = params.FW|float %}
    {% set FT = params.FT|float %}
    {% set FZ = params.FZ|float %}
    {% set P  = params.RPITCH|float %}
    {% set UL = params.UL|float %}
    {% set K  = params.K|float %}
    {% set PF = params.PF|float %}
    {% set TD = params.TD|int %}
    {% set PRE_TD = params.PRE_TD|int %}
    {% set SETTLE = params.SETTLE|int %}
    {% set DWELL  = params.DWELL|int %}
    {% set DRY    = params.DRY|default(0)|int %}

    {% set n = ((X1 - X0) / P)|round(0, 'ceil')|int %}
    {% set H = Y1 - Y0 %}
    {% set L = (n + 1) * H + n * P %}
    {% set E = (UL if UL > 0 else L * K)|round(3) %}
    {% set F = (PF if PF > 0 else E * FW / L)|round(1) %}

    G90
    G1 Z{ZT} F{FZ}
    G1 X{X0} Y{Y1} F{FT}
    G1 Z{ZW} F{FZ}
    {% if not DRY %}
    SEND_PUMP_ARDUINO COMMAND="TD {TD}"
    G4 P{PRE_TD}
    SEND_PUMP_ARDUINO COMMAND="SDISPENSE MASK=1111 E{E} F{F}"
    G4 P{SETTLE}
    TRIGGER_FIRE
    {% endif %}
    {% for r in range(n + 1) %}
    G1 Y{ Y0 if r % 2 == 0 else Y1 } F{FW}
    {%- if r < n %}
    G1 X{ (X0 + (r + 1) * P)|round(3) } F{FW}
    {%- endif %}
    {% endfor %}
    G4 P{DWELL}
    G1 Z{ZT} F{FZ}


#=============================================================================
# AG_PRINT_DEVICE [KEY=VALUE ...]
# Any key from AG_HELP may be passed. Unpassed keys fall back to the stored
# default, then to the built-in default.
#=============================================================================
[gcode_macro AG_PRINT_DEVICE]
description: Silver pattern on device slides, one prime on a separate slide. AG_HELP for parameters.
gcode:
    {% set tbl = printer["gcode_macro _AG_PARAMS"].table %}
    {% set sv  = printer.save_variables.variables %}
    {% set known = tbl|map(attribute=0)|list %}

    # ---- reject typos before any motion ----
    {% for k in params %}
    {% if k not in known %}
        { action_raise_error("Unknown parameter '%s'. Run AG_HELP for valid keys." % k) }
    {% endif %}
    {% endfor %}

    # ---- resolve every parameter: param > stored > built-in ----
    {% set p = namespace(v = {}) %}
    {% for row in tbl %}
    {% set _ = p.v.update({row[0]: params[row[0]]|default(sv.get('ag_' ~ row[0]|lower, row[2]))|float}) %}
    {% endfor %}
    {% set v = p.v %}

    {% set DRY = v.DRYRUN|int %}
    {% set NF  = v.NFING|int %}
    {% set ND  = v.NDEV|int %}
    {% set PZT = v.PRM_Z + v.ZHOP %}

    # ---- preconditions ----
    {% if 'ag_dev_x' not in sv or 'ag_prm_x' not in sv %}
        { action_raise_error("Slide origins not set. SET_SLIDE_ORIGIN SLIDE=DEVICE X= Y= Z= and SLIDE=PRIME X= Y= Z=") }
    {% endif %}
    {% if v.PRM_Y < v.DEV_Y + v.DEV_SY %}
        { action_raise_error("Priming slide overlaps device slides in Y (PRM_Y=%.1f, devices end at %.1f)" % (v.PRM_Y, v.DEV_Y + v.DEV_SY)) }
    {% endif %}
    {% if v.PRIME_LOC_X < 0 or v.PRIME_LOC_X > v.PRM_SX or v.PRIME_LOC_Y < 0 or v.PRIME_LOC_Y > v.PRM_SY %}
        { action_raise_error("Prime location (%.1f, %.1f) is off the %.0f x %.0f mm priming slide" % (v.PRIME_LOC_X, v.PRIME_LOC_Y, v.PRM_SX, v.PRM_SY)) }
    {% endif %}
    {% if v.DEV_Z + v.ZHOP >= v.ZPARK or v.PRM_Z + v.ZHOP >= v.ZPARK %}
        { action_raise_error("Travel height is at or above park height. DEV_Z=%.2f PRM_Z=%.2f ZHOP=%.2f ZPARK=%.2f" % (v.DEV_Z, v.PRM_Z, v.ZHOP, v.ZPARK)) }
    {% endif %}
    {% if ND > 1 and v.DEV_DX|abs < v.DEV_SX and v.DEV_DY|abs < v.DEV_SY %}
        { action_raise_error("DEV_DX=%.1f DEV_DY=%.1f would overlap adjacent device slides (%.0f x %.0f mm each)" % (v.DEV_DX, v.DEV_DY, v.DEV_SX, v.DEV_SY)) }
    {% endif %}
    {% set fmax = v.MX + (NF - 1) * v.FPITCH %}
    {% if fmax > v.DEV_SX - v.MX %}
        { action_raise_error("Finger %d lands at local x=%.1f, past the usable edge at %.1f. Reduce NFING or FPITCH." % (NF, fmax, v.DEV_SX - v.MX)) }
    {% endif %}
    {% if v.BC_Y < v.MY or v.TP_Y + v.TP_H > v.DEV_SY - v.MY %}
        { action_raise_error("Pads fall outside the %.1f mm Y margin (BC_Y=%.1f, top pad ends %.1f, limit %.1f)" % (v.MY, v.BC_Y, v.TP_Y + v.TP_H, v.DEV_SY - v.MY)) }
    {% endif %}
    {% if v.BC_Y + v.BC_H >= v.FG_Y0 %}
        { action_raise_error("Bottom contact ends at y=%.1f but fingers start at y=%.1f - they would short." % (v.BC_Y + v.BC_H, v.FG_Y0)) }
    {% endif %}

    # ---- common argument bundles ----
    {% set TIM = "TD=" ~ v.TD|int ~ " PRE_TD=" ~ v.PRE_TD|int ~ " SETTLE=" ~ v.SETTLE|int ~ " DWELL=" ~ v.DWELL|int %}
    {% set FEE = "FW=" ~ v.FW ~ " FT=" ~ v.FT ~ " FZ=" ~ v.FZ %}

    #=========================================================================
    G90
    {% if DRY and v.VERBOSE|int %}
    RESPOND MSG="dryrun, motion only, no pump commands"
    {% endif %}
    {% if not DRY %}
    SEND_PUMP_ARDUINO COMMAND="TRIGGERON"
    G4 P{v.TRIG_ON_DWELL|int}
    {% endif %}

    # ---- prime at station, once. Motion runs in DRYRUN, dispense does not ----
    {% if v.SKIP_PRIME|int == 0 %}
    G1 Z{PZT} F{v.FZ}
    G1 X{v.PRM_X + v.PRIME_LOC_X} Y{v.PRM_Y + v.PRIME_LOC_Y} F{v.FT}
    G1 Z{v.PRM_Z} F{v.FZ}
    {% if not DRY %}
    SEND_PUMP_ARDUINO COMMAND="SDISPENSE MASK=1111 E{v.PRIME_UL} F{v.PRIME_F}"
    G4 P{v.PRIME_SETTLE|int}
    TRIGGER_FIRE
    {% endif %}
    G4 P{v.PRIME_DWELL|int}
    G1 Z{PZT} F{v.FZ}
    {% endif %}

    # ==== one device slide per outer pass ====
    {% for d in range(ND) %}
    {% set BX  = v.DEV_X + d * v.DEV_DX %}
    {% set BY  = v.DEV_Y + d * v.DEV_DY %}
    {% set BZ  = v.DEV_Z + d * v.DEV_DZ %}
    {% set BZT = BZ + v.ZHOP %}
    {% if v.VERBOSE|int %}
    RESPOND MSG="slide {d + 1} of {ND} at X {'%.2f' % BX} Y {'%.2f' % BY} Z {'%.3f' % BZ}"
    {% endif %}

    # ---- bottom contact ----
    _AG_FILL X0={BX + v.MX} X1={BX + v.DEV_SX - v.MX} Y0={BY + v.BC_Y} Y1={BY + v.BC_Y + v.BC_H} ZW={BZ} ZT={BZT} RPITCH={v.RPITCH} UL={v.PAD_UL} K={v.K_FILL} PF={v.PUMP_F} {FEE} {TIM} DRY={DRY}

    # ---- fingers, low X to high X, each written -Y ----
    {% for f in range(NF) %}
    _AG_TRACE X={BX + v.MX + f * v.FPITCH} Y0={BY + v.FG_Y0} Y1={BY + v.FG_Y1} ZW={BZ} ZT={BZT} UL={v.TRACE_UL} K={v.K_LINE} PF={v.PUMP_F} {FEE} {TIM} DRY={DRY}
    {% endfor %}

    # ---- top pad, laid over the finger ends ----
    _AG_FILL X0={BX + v.MX} X1={BX + v.DEV_SX - v.MX} Y0={BY + v.TP_Y} Y1={BY + v.TP_Y + v.TP_H} ZW={BZ} ZT={BZT} RPITCH={v.RPITCH} UL={v.PAD_UL} K={v.K_FILL} PF={v.PUMP_F} {FEE} {TIM} DRY={DRY}
    {% endfor %}

    # ---- park ----
    G90
    G1 Z{v.ZPARK} F{v.FPARK}
    G4 P{v.END_DWELL|int}


#=============================================================================
# BACKGROUND LAUNCH
#
# Moonraker's /printer/gcode/script endpoint does not return until the script
# finishes. A long run therefore holds the HTTP request open for minutes, and
# browser clients report it as a network failure ("Failed to fetch") long
# before Klipper is done. AG_START hands the work to a delayed_gcode and
# returns immediately, so the request completes in milliseconds.
#
#   AG_START NDEV=2 DEV_DX=30 DRYRUN=1     same arguments as AG_PRINT_DEVICE
#   AG_STATUS                              is a background run pending
#   AG_CANCEL                              cancel a pending run
#
# Because the run is detached, errors surface in the console rather than in
# the caller's response. Use AG_PRINT_DEVICE directly from a console where you
# want the guard messages returned to you.
#=============================================================================
[gcode_macro _AG_QUEUE]
description: Argument holder for AG_START - not called directly
variable_args: ''
gcode:
    RESPOND MSG="_AG_QUEUE holds arguments, it is not a command."

[delayed_gcode _AG_RUN_DEFERRED]
gcode:
    {% set a = printer["gcode_macro _AG_QUEUE"].args %}
    SET_GCODE_VARIABLE MACRO=_AG_QUEUE VARIABLE=args VALUE="''"
    AG_PRINT_DEVICE {a}

[gcode_macro AG_START]
description: Queue AG_PRINT_DEVICE in the background and return immediately
gcode:
    {% set raw = rawparams|default('')|replace('"', '')|replace("'", '') %}
    {% if printer["gcode_macro _AG_QUEUE"].args %}
        { action_raise_error("A background run is already queued. AG_CANCEL to clear it.") }
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_AG_QUEUE VARIABLE=args VALUE="'{raw}'"
    UPDATE_DELAYED_GCODE ID=_AG_RUN_DEFERRED DURATION={params.DELAY|default(0.5)|float}
    RESPOND MSG="queued in background with args {raw if raw else 'none'}"

[gcode_macro AG_CANCEL]
description: Cancel a queued background run
gcode:
    UPDATE_DELAYED_GCODE ID=_AG_RUN_DEFERRED DURATION=0
    SET_GCODE_VARIABLE MACRO=_AG_QUEUE VARIABLE=args VALUE="''"
    RESPOND MSG="background run cancelled"

[gcode_macro AG_STATUS]
description: Report whether a background run is pending
gcode:
    {% set a = printer["gcode_macro _AG_QUEUE"].args %}
    RESPOND MSG="{'pending with args ' ~ a if a else 'nothing queued'}"