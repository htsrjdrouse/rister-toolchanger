# liquid_dispenser_0.cfg - Arduino-controlled servo version
# Uses existing arduino_serial.py connection - NO new MCU needed!

# === ARDUINO SERVO MACROS ===

[gcode_macro LINEARACTSERVOON]
description: Turn on 5V power for servo on liquid dispenser 0
gcode:
    RESPOND MSG="Turning on 5V for L0 servo"
    SEND_ARDUINO COMMAND="turnon5v"

[gcode_macro LINEARACTSERVOOFF]
description: Turn off 5V power for servo on liquid dispenser 0
gcode:
    RESPOND MSG="Turning off 5V for L0 servo"
    SEND_ARDUINO COMMAND="turnoff5v"

[gcode_macro LINEARACTSERVOANGLE]
description: Set linear actuator servo angle - LINEARACTSERVOANGLE ANGLE=90
gcode:
    {% set angle = params.ANGLE|default(90)|int %}
    RESPOND MSG="Setting L0 servo to {angle} degrees"
    SEND_ARDUINO COMMAND="linearact {angle}"

# === WRAPPER MACRO FOR COMPLETE SERVO OPERATION ===

[gcode_macro LINEARACTSERVOMOVE]
description: Complete servo movement with power on/off - LINEARACTSERVOMOVE ANGLE=90 HOLD=1000
gcode:
    {% set angle = params.ANGLE|default(90)|int %}
    {% set hold_time = params.HOLD|default(1000)|int %}
    
    LINEARACTSERVOON
    G4 P500
    LINEARACTSERVOANGLE ANGLE={angle}
    G4 P{hold_time}
    LINEARACTSERVOOFF

# === TOOL LED ===
[neopixel led_l0]
pin: PB6
chain_count: 1
color_order: GRB
initial_RED: 0.5
initial_GREEN: 0.5
initial_BLUE: 0.5

# === LED EFFECTS ===
[led_effect dock_state_l0]
autostart: true
frame_rate: 24
leds:
    neopixel:led_l0
layers:
    static 10 1 top (0.5, 0.5, 0.5)

[led_effect lock_state_l0]
autostart: false
frame_rate: 24
leds:
    neopixel:led_l0
layers:
    static 10 1 top (0, 0, 0.7)

[led_effect error_blink_l0]
autostart: false
frame_rate: 24
leds:
    neopixel:led_l0
layers:
    strobe 1 2 add (1.0, 0, 0)

[led_effect heating_l0]
autostart: false
frame_rate: 24
leds:
    neopixel:led_l0
layers:
    breathing 3 0 screen (0.5, 0.6, 0.05)

[led_effect idle_l0]
autostart: false
frame_rate: 24
leds:
    neopixel:led_l0
layers:
    static 10 1 top (0, 1, 0.7)

# === SENSORS ===
[atc_switch dl0]
pin: PG13
press:
    RESPOND MSG="dl0 sensor PRESSED"
    SET_GCODE_VARIABLE MACRO=TOOL_SENSOR_STATES VARIABLE=dl0_state VALUE='"PRESSED"'
    UPDATE_LED_FROM_SENSORS TOOL_ID="l0"
release:
    RESPOND MSG="dl0 sensor RELEASED - Tool removed from dock"
    SET_GCODE_VARIABLE MACRO=TOOL_SENSOR_STATES VARIABLE=dl0_state VALUE='"RELEASED"'
    UPDATE_LED_FROM_SENSORS TOOL_ID="l0"

[atc_switch cl0]
pin: PG12
press:
    RESPOND MSG="cl0 sensor PRESSED - Tool is on carriage"
    SET_GCODE_VARIABLE MACRO=TOOL_SENSOR_STATES VARIABLE=cl0_state VALUE='"PRESSED"'
    UPDATE_LED_FROM_SENSORS TOOL_ID="l0"
release:
    RESPOND MSG="cl0 sensor RELEASED - Tool removed from carriage"
    SET_GCODE_VARIABLE MACRO=TOOL_SENSOR_STATES VARIABLE=cl0_state VALUE='"RELEASED"'
    UPDATE_LED_FROM_SENSORS TOOL_ID="l0"

# === CONFIGURATION VARIABLES ===
[gcode_macro CONFIG_L0]
variable_dock_x: 0
variable_dock_y: 0
variable_dock_z: 0
variable_dock_unlock_x: 0
variable_dock_unlock_y: 0
variable_dock_lock_x: 0
variable_dock_lock_y: 0
variable_loading: 0
variable_active: 0
gcode:

# === MAIN TOOL SELECTION COMMAND ===
[gcode_macro L0]
description: Load liquid dispenser tool 0
gcode:
    LOAD_TOOL TOOL_ID=l0

# === TOOL STATE HANDLERS ===
[gcode_macro TOOL_PICKED_L0]
description: Call after liquid dispenser tool 0 is picked up
gcode:
    SET_GCODE_VARIABLE MACRO=CONFIG_L0 VARIABLE=active VALUE="1"
    SET_GCODE_VARIABLE MACRO=VARIABLES_LIST VARIABLE=active_tool VALUE='"l0"'
    UPDATE_LED_FROM_SENSORS TOOL_ID="l0"

[gcode_macro TOOL_DOCKED_L0]
description: Call after liquid dispenser tool 0 is docked
gcode:
    SET_GCODE_VARIABLE MACRO=CONFIG_L0 VARIABLE=active VALUE="0"
    SET_GCODE_VARIABLE MACRO=VARIABLES_LIST VARIABLE=active_tool VALUE='"none"'
    UPDATE_LED_FROM_SENSORS TOOL_ID="l0"

# Register tool with the system
[delayed_gcode REGISTER_LIQUID_TOOL_0]
initial_duration: 2
gcode:
    {% if printer["gcode_macro REGISTER_TOOL"] is defined %}
        REGISTER_TOOL TOOL_ID=l0
    {% endif %}
    {% if printer["gcode_macro TOOL_USE_COUNT"] is defined %}
        SET_GCODE_VARIABLE MACRO=TOOL_USE_COUNT VARIABLE="l0_use_count" VALUE="0"
    {% endif %}