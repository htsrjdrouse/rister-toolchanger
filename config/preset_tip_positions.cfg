[gcode_macro TOUCH_DRY_AT]
description: Touch drypad at specific grid position - TOUCH_DRY_AT KEY=1
gcode:
    {% set key = params.KEY|default(1)|int %}
    {% set base_x = printer.save_variables.variables.drypad_x|default(92.0) %}
    {% set base_y = printer.save_variables.variables.drypad_y|default(335.0) %}
    {% set columns = printer.save_variables.variables.drypad_columns|default(35) %}
    {% set x_spacing = printer.save_variables.variables.drypad_x_spacing|default(4.0) %}
    {% set y_spacing = printer.save_variables.variables.drypad_y_spacing|default(4.0) %}
    
    # Calculate position
    {% set row = ((key - 1) // columns)|int %}
    {% set col = ((key - 1) % columns)|int %}
    {% set x = base_x + (col * x_spacing) %}
    {% set y = base_y + (row * y_spacing) %}
    
    {% set z = printer.save_variables.variables.drypad_z|default(70.0) %}
    {% set servo_move = printer.save_variables.variables.drypad_servo_move|default(0) %}
    {% set servo_touch = printer.save_variables.variables.drypad_servo_touch|default(115) %}
    {% set touch_time = printer.save_variables.variables.drypad_time|default(3000) %}
    
    # Get current position
    {% set cur_x = printer.toolhead.position.x %}
    {% set cur_y = printer.toolhead.position.y %}
    {% set cur_z = printer.toolhead.position.z %}
    
    # Get maximum object height from saved variables (check all objects)
    {% set obj_heights = [] %}
    {% for key, value in printer.save_variables.variables.items() %}
        {% if key.endswith('_z_height') and key.startswith('obj_') %}
            {% set _ = obj_heights.append(value|float) %}
        {% endif %}
    {% endfor %}
    {% set max_obj_height = obj_heights|max if obj_heights|length > 0 else 100 %}
    {% set clearance = 10 %}
    {% set safe_z = max_obj_height + clearance %}
    
    # Check if we're in the proximity zone (X: 95-200, Y: >310)
    {% set in_proximity = (cur_x >= 95 and cur_x <= 200 and cur_y >= 310) %}
    {% if in_proximity %}
        # Already in safe zone near stations, can use lower safe_z
        {% set safe_z = [cur_z, 50]|max %}
    {% endif %}
    
    {action_respond_info("Drypad position %d: X%.1f Y%.1f (safe_z: %.1f)" % (key, x, y, safe_z))}
    
    # Retract servo first
    LINEARACTSERVOANGLE ANGLE={servo_move}
    G4 P500
    
    # Raise Z to safe height before XY move
    {% if cur_z < safe_z %}
        G0 Z{safe_z} F1000
        G4 P500
    {% endif %}
    
    G0 X{x} Y{y} F3000
    G4 P500
    G1 Z{z} F1000
    G4 P500
    LINEARACTSERVOMOVE ANGLE={servo_touch} HOLD={touch_time}
    G4 P500
    LINEARACTSERVOANGLE ANGLE={servo_move}
    G4 P500
    G0 Z{safe_z} F1000

