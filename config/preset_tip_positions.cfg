# ========================================
# LOAD PRESET BY NAME
# ========================================

[gcode_macro SET_TIP_POSITIONS]
description: Load tip preset by name - SET_TIP_POSITIONS PRESET=L0TIP0
gcode:
    {% set preset_name = params.PRESET|default("L0TIP0")|upper %}
    {% set preset = printer["gcode_macro _TIP_PRESET_" ~ preset_name] %}
    
    {% if preset %}
        # Drypad
        SAVE_VARIABLE VARIABLE=drypad_x VALUE={preset.drypad_x}
        SAVE_VARIABLE VARIABLE=drypad_y VALUE={preset.drypad_y}
        SAVE_VARIABLE VARIABLE=drypad_z VALUE={preset.drypad_z}
        SAVE_VARIABLE VARIABLE=drypad_servo_move VALUE={preset.drypad_servo_move}
        SAVE_VARIABLE VARIABLE=drypad_servo_touch VALUE={preset.drypad_servo_touch}
        SAVE_VARIABLE VARIABLE=drypad_time VALUE={preset.drypad_time}
        SAVE_VARIABLE VARIABLE=drypad_delay VALUE={preset.drypad_delay}
        
        # Wash
        SAVE_VARIABLE VARIABLE=wash_x VALUE={preset.wash_x}
        SAVE_VARIABLE VARIABLE=wash_y VALUE={preset.wash_y}
        SAVE_VARIABLE VARIABLE=wash_z VALUE={preset.wash_z}
        SAVE_VARIABLE VARIABLE=wash_servo_move VALUE={preset.wash_servo_move}
        SAVE_VARIABLE VARIABLE=wash_servo_wash VALUE={preset.wash_servo_wash}
        
        # Waste
        SAVE_VARIABLE VARIABLE=waste_x VALUE={preset.waste_x}
        SAVE_VARIABLE VARIABLE=waste_y VALUE={preset.waste_y}
        SAVE_VARIABLE VARIABLE=waste_z VALUE={preset.waste_z}
        SAVE_VARIABLE VARIABLE=waste_servo_move VALUE={preset.waste_servo_move}
        SAVE_VARIABLE VARIABLE=waste_servo_waste VALUE={preset.waste_servo_waste}
        
        # Eject
        SAVE_VARIABLE VARIABLE=eject_x VALUE={preset.eject_x}
        SAVE_VARIABLE VARIABLE=eject_y VALUE={preset.eject_y}
        SAVE_VARIABLE VARIABLE=eject_z VALUE={preset.eject_z}
        SAVE_VARIABLE VARIABLE=eject_servo_move VALUE={preset.eject_servo_move}
        SAVE_VARIABLE VARIABLE=eject_servo_eject VALUE={preset.eject_servo_eject}
        
        {action_respond_info("Loaded preset: %s" % preset_name)}
    {% else %}
        {action_respond_info("ERROR: Preset %s not found" % preset_name)}
    {% endif %}

# ========================================
# BAYONET LOADING MACROS
# ========================================
# Create your own bayonet loading macros in your gcode macros section
# Example usage in your custom macros:
#
# [gcode_macro Bayonet_load_1]
# gcode:
#     # Your physical loading sequence here
#     ...
#     # Then set tip positions:
#     SET_TIP_POSITIONS PRESET=L0TIP1
#
# [gcode_macro Bayonet_eject]
# gcode:
#     # Your physical eject sequence here
#     ...
#     # Return to preloaded tip:
#     SET_TIP_POSITIONS PRESET=L0TIP0

# ========================================
# MOVEMENT MACROS (USE CURRENT VARIABLES)
# ========================================

[gcode_macro GO_DRYPAD]
description: Move to drypad using current variables
gcode:
    {% set x = printer.save_variables.variables.drypad_x|default(92.0) %}
    {% set y = printer.save_variables.variables.drypad_y|default(335.0) %}
    {% set z = printer.save_variables.variables.drypad_z|default(70.0) %}
    {% set servo_move = printer.save_variables.variables.drypad_servo_move|default(0) %}
    {% set servo_touch = printer.save_variables.variables.drypad_servo_touch|default(115) %}
    
    # Get current position
    {% set cur_x = printer.toolhead.position.x %}
    {% set cur_y = printer.toolhead.position.y %}
    {% set cur_z = printer.toolhead.position.z %}
    
    # Get maximum object height from saved variables (check all objects)
    {% set obj_heights = [] %}
    {% for key, value in printer.save_variables.variables.items() %}
        {% if key.endswith('_z_height') and key.startswith('obj_') %}
            {% set _ = obj_heights.append(value|float) %}
        {% endif %}
    {% endfor %}
    {% set max_obj_height = obj_heights|max if obj_heights|length > 0 else 100 %}
    {% set clearance = 10 %}
    {% set safe_z = max_obj_height + clearance %}
    
    # Check if we're in the proximity zone (X: 95-200, Y: >310)
    {% set in_proximity = (cur_x >= 95 and cur_x <= 200 and cur_y >= 310) %}
    {% if in_proximity %}
        # Already in safe zone near stations, can use lower safe_z
        {% set safe_z = [cur_z, 50]|max %}
    {% endif %}
    
    # Retract servo first
    LINEARACTSERVOANGLE ANGLE={servo_move}
    G4 P500
    
    # Raise Z to safe height before XY move
    {% if cur_z < safe_z %}
        G0 Z{safe_z} F1000
        G4 P500
    {% endif %}
    
    G0 X{x} Y{y} F3000
    G4 P500
    G1 Z{z} F1000
    G4 P500
    LINEARACTSERVOMOVE ANGLE={servo_touch} HOLD=1000
    G4 P500

