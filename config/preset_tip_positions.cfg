[gcode_macro QUICK_ADJUST]
description: Quick single-parameter adjustment - QUICK_ADJUST DRYPAD_X=95.0
gcode:
    {% if params.DRYPAD_X %}
        SAVE_VARIABLE VARIABLE=drypad_x VALUE={params.DRYPAD_X}
        {action_respond_info("Drypad X = %s" % params.DRYPAD_X)}
    {% endif %}
    {% if params.DRYPAD_Y %}
        SAVE_VARIABLE VARIABLE=drypad_y VALUE={params.DRYPAD_Y}
        {action_respond_info("Drypad Y = %s" % params.DRYPAD_Y)}
    {% endif %}
    {% if params.DRYPAD_Z %}
        SAVE_VARIABLE VARIABLE=drypad_z VALUE={params.DRYPAD_Z}
        {action_respond_info("Drypad Z = %s" % params.DRYPAD_Z)}
