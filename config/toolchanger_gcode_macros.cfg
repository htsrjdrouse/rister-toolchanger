[gcode_macro M114]
rename_existing: M114.1
gcode:
    M114.1
    G4 P100
    SEND_PUMP_ARDUINO COMMAND="P114"

[gcode_macro M112]
description: Emergency stop — halts Klipper AND disables pump Arduino
rename_existing: M112.1
gcode:
    SET_PIN PIN=dispense_trigger VALUE=0    ; kill trigger immediately
    SEND_PUMP_ARDUINO COMMAND="P0"          ; disable pump driver
    M112.1                                  ; call original Klipper estop

[gcode_macro M999]
gcode:
    SEND_PUMP_ARDUINO COMMAND="P999"
    RESPOND MSG="Pump Arduino estop cleared"
    FIRMWARE_RESTART


