[arduino_serial]
serial_port: /dev/ttyACM1
baud_rate: 115200

[fan_generic arduino_power]
pin: PA8
max_power: 1.0

[delayed_gcode arduino_power_on]
initial_duration: 1
gcode:
    SET_FAN_SPEED FAN=arduino_power SPEED=1


[gcode_macro MANUAL_PCV]
description: Turns off liquid level feedback so that you can manually fill the pressure compensation vessel
gcode:
	G4 P2000
	SEND_ARDUINO COMMAND="manpcv"
	G4 P1000


[gcode_macro FEEDBACK_PCV]
description: Turns on liquid level feedback control for stabilizing pressure within the dispensing system
gcode:
	G4 P2000
	SEND_ARDUINO COMMAND="feedbackpcv"
	G4 P1000

[gcode_macro WASH_ON]
description: Turns on wash pump in wash station
gcode:
	G4 P1000
	SEND_ARDUINO COMMAND="washon"
	G4 P1000

[gcode_macro WASH_OFF]
description: Turns off wash pump in wash station
gcode:
	G4 P1000
	SEND_ARDUINO COMMAND="washoff"
	G4 P1000

[gcode_macro WASTE_ON]
description: Turns on waste pump in wash station
gcode:
	G4 P1000
	SEND_ARDUINO COMMAND="dryon"
	G4 P1000

[gcode_macro WASTE_OFF]
description: Turns off waste pump in wash station
gcode:
	G4 P1000
	SEND_ARDUINO COMMAND="dryoff"
	G4 P1000


# Pump Speed Control Macros
[gcode_macro SET_WASH_SPEED]
description: Set wash pump PWM speed (0-255)
gcode:
    {% set speed = params.SPEED|default(255)|int %}
    {% if speed < 0 %}
        {% set speed = 0 %}
    {% elif speed > 255 %}
        {% set speed = 255 %}
    {% endif %}
    G4 P1000
    SEND_ARDUINO COMMAND="setwashval {speed}"
    G4 P1000
    RESPOND MSG="Wash pump speed set to {speed} (0-255)"

[gcode_macro SET_DRY_SPEED]
description: Set waste/dry pump PWM speed (0-255)
gcode:
    {% set speed = params.SPEED|default(255)|int %}
    {% if speed < 0 %}
        {% set speed = 0 %}
    {% elif speed > 255 %}
        {% set speed = 255 %}
    {% endif %}
    G4 P1000
    SEND_ARDUINO COMMAND="setdryval {speed}"
    G4 P1000
    RESPOND MSG="Waste/Dry pump speed set to {speed} (0-255)"

[gcode_macro SET_PCV_SPEED]
description: Set PCV pump PWM speed (0-255)
gcode:
    {% set speed = params.SPEED|default(255)|int %}
    {% if speed < 0 %}
        {% set speed = 0 %}
    {% elif speed > 255 %}
        {% set speed = 255 %}
    {% endif %}
    G4 P1000
    SEND_ARDUINO COMMAND="setpcvval {speed}"
    G4 P1000
    RESPOND MSG="PCV pump speed set to {speed} (0-255)"


# Enhanced wash with speed control
[gcode_macro WASH_ON_WITH_SPEED]
description: Turn on wash pump with specified speed (0-255)
gcode:
    {% set speed = params.SPEED|default(255)|int %}
    SET_WASH_SPEED SPEED={speed}
    G4 P500
    WASH_ON
    RESPOND MSG="Wash pump started at speed {speed}"

# Enhanced dry/waste with speed control  
[gcode_macro WASTE_ON_WITH_SPEED]
description: Turn on waste pump with specified speed (0-255)
gcode:
    {% set speed = params.SPEED|default(255)|int %}
    SET_DRY_SPEED SPEED={speed}
    G4 P500
    WASTE_ON
    RESPOND MSG="Waste pump started at speed {speed}"


# ========================================
# SERVO ANGLE CONFIGURATION
# ========================================

[gcode_macro CONFIGURE_SERVO_ANGLES]
description: Set custom servo angles for INPUT, OUTPUT, and BYPASS states
gcode:
    {% set servo_a_input = params.SERVO_A_INPUT|default(0)|int %}
    {% set servo_a_output = params.SERVO_A_OUTPUT|default(180)|int %}
    {% set servo_a_bypass = params.SERVO_A_BYPASS|default(30)|int %}
    
    {% set servo_b_input = params.SERVO_B_INPUT|default(0)|int %}
    {% set servo_b_output = params.SERVO_B_OUTPUT|default(180)|int %}
    {% set servo_b_bypass = params.SERVO_B_BYPASS|default(30)|int %}
    
    {% set servo_c_input = params.SERVO_C_INPUT|default(0)|int %}
    {% set servo_c_output = params.SERVO_C_OUTPUT|default(180)|int %}
    {% set servo_c_bypass = params.SERVO_C_BYPASS|default(30)|int %}
    
    {% set servo_d_input = params.SERVO_D_INPUT|default(0)|int %}
    {% set servo_d_output = params.SERVO_D_OUTPUT|default(180)|int %}
    {% set servo_d_bypass = params.SERVO_D_BYPASS|default(30)|int %}
    
    SAVE_VARIABLE VARIABLE=servo_a_input VALUE={servo_a_input}
    SAVE_VARIABLE VARIABLE=servo_a_output VALUE={servo_a_output}
    SAVE_VARIABLE VARIABLE=servo_a_bypass VALUE={servo_a_bypass}
    
    SAVE_VARIABLE VARIABLE=servo_b_input VALUE={servo_b_input}
    SAVE_VARIABLE VARIABLE=servo_b_output VALUE={servo_b_output}
    SAVE_VARIABLE VARIABLE=servo_b_bypass VALUE={servo_b_bypass}
    
    SAVE_VARIABLE VARIABLE=servo_c_input VALUE={servo_c_input}
    SAVE_VARIABLE VARIABLE=servo_c_output VALUE={servo_c_output}
    SAVE_VARIABLE VARIABLE=servo_c_bypass VALUE={servo_c_bypass}
    
    SAVE_VARIABLE VARIABLE=servo_d_input VALUE={servo_d_input}
    SAVE_VARIABLE VARIABLE=servo_d_output VALUE={servo_d_output}
    SAVE_VARIABLE VARIABLE=servo_d_bypass VALUE={servo_d_bypass}
    
    RESPOND MSG="Servo A: INPUT={servo_a_input} OUTPUT={servo_a_output} BYPASS={servo_a_bypass}"
    RESPOND MSG="Servo B: INPUT={servo_b_input} OUTPUT={servo_b_output} BYPASS={servo_b_bypass}"
    RESPOND MSG="Servo C: INPUT={servo_c_input} OUTPUT={servo_c_output} BYPASS={servo_c_bypass}"
    RESPOND MSG="Servo D: INPUT={servo_d_input} OUTPUT={servo_d_output} BYPASS={servo_d_bypass}"

[gcode_macro CHECK_SERVO_ANGLES]
description: Display current servo angle configuration
gcode:
    {% set servo_a_input = printer.save_variables.variables.servo_a_input|default(0)|int %}
    {% set servo_a_output = printer.save_variables.variables.servo_a_output|default(180)|int %}
    {% set servo_a_bypass = printer.save_variables.variables.servo_a_bypass|default(30)|int %}
    
    {% set servo_b_input = printer.save_variables.variables.servo_b_input|default(0)|int %}
    {% set servo_b_output = printer.save_variables.variables.servo_b_output|default(180)|int %}
    {% set servo_b_bypass = printer.save_variables.variables.servo_b_bypass|default(30)|int %}
    
    {% set servo_c_input = printer.save_variables.variables.servo_c_input|default(0)|int %}
    {% set servo_c_output = printer.save_variables.variables.servo_c_output|default(180)|int %}
    {% set servo_c_bypass = printer.save_variables.variables.servo_c_bypass|default(30)|int %}
    
    {% set servo_d_input = printer.save_variables.variables.servo_d_input|default(0)|int %}
    {% set servo_d_output = printer.save_variables.variables.servo_d_output|default(180)|int %}
    {% set servo_d_bypass = printer.save_variables.variables.servo_d_bypass|default(30)|int %}
    
    RESPOND MSG="Current servo A: INPUT={servo_a_input} OUTPUT={servo_a_output} BYPASS={servo_a_bypass}"
    RESPOND MSG="Current servo B: INPUT={servo_b_input} OUTPUT={servo_b_output} BYPASS={servo_b_bypass}"
    RESPOND MSG="Current servo C: INPUT={servo_c_input} OUTPUT={servo_c_output} BYPASS={servo_c_bypass}"
    RESPOND MSG="Current servo D: INPUT={servo_d_input} OUTPUT={servo_d_output} BYPASS={servo_d_bypass}"


# ========================================
# 4-VALVE CONTROL MACROS
# ========================================

[gcode_macro _SET_VALVES_ANGLE]
description: Internal macro - sends single command to Arduino for all valve positions
gcode:
    {% set mask = params.MASK|string %}
    {% set state = params.STATE|string %}
    
    # Load servo angles based on state
    {% if state == "INPUT" %}
        {% set angle_a = printer.save_variables.variables.servo_a_input|default(0)|int %}
        {% set angle_b = printer.save_variables.variables.servo_b_input|default(0)|int %}
        {% set angle_c = printer.save_variables.variables.servo_c_input|default(0)|int %}
        {% set angle_d = printer.save_variables.variables.servo_d_input|default(0)|int %}
    {% elif state == "OUTPUT" %}
        {% set angle_a = printer.save_variables.variables.servo_a_output|default(180)|int %}
        {% set angle_b = printer.save_variables.variables.servo_b_output|default(180)|int %}
        {% set angle_c = printer.save_variables.variables.servo_c_output|default(180)|int %}
        {% set angle_d = printer.save_variables.variables.servo_d_output|default(180)|int %}
    {% elif state == "BYPASS" %}
        {% set angle_a = printer.save_variables.variables.servo_a_bypass|default(30)|int %}
        {% set angle_b = printer.save_variables.variables.servo_b_bypass|default(30)|int %}
        {% set angle_c = printer.save_variables.variables.servo_c_bypass|default(30)|int %}
        {% set angle_d = printer.save_variables.variables.servo_d_bypass|default(30)|int %}
    {% endif %}
    
    # Debug: log the values
    #RESPOND MSG="DEBUG: mask={mask} state={state} angles={angle_a},{angle_b},{angle_c},{angle_d}"
    
    # Send command with proper formatting
    G4 P500
    SEND_ARDUINO COMMAND="turnon5v"
    G4 P2000
    SEND_ARDUINO COMMAND="setvalves_angle {mask} {angle_a} {angle_b} {angle_c} {angle_d}"
    G4 P2500
    SEND_ARDUINO COMMAND="turnoff5v"
    G4 P500
    
    RESPOND MSG="Servos moved for mask {mask} to {state}"

[gcode_macro VALVE_INPUT]
description: Set selected valves to INPUT (aspirate) - Example VALVE_INPUT MASK=1111 or VALVE_INPUT MASK=0100
gcode:
    {% set mask = params.MASK|default("1111") %}
    _SET_VALVES_ANGLE MASK={mask} STATE=INPUT
    RESPOND MSG="Valves INPUT ← {mask}"

[gcode_macro VALVE_OUTPUT]
description: Set selected valves to OUTPUT (dispense) - Example VALVE_OUTPUT MASK=1111 or VALVE_OUTPUT MASK=0001
gcode:
    {% set mask = params.MASK|default("1111") %}
    _SET_VALVES_ANGLE MASK={mask} STATE=OUTPUT
    RESPOND MSG="Valves OUTPUT → {mask}"

[gcode_macro VALVE_BYPASS]
description: Set selected valves to BYPASS (closed) - Example VALVE_BYPASS MASK=1111 or VALVE_BYPASS MASK=1010
gcode:
    {% set mask = params.MASK|default("1111") %}
    _SET_VALVES_ANGLE MASK={mask} STATE=BYPASS
    RESPOND MSG="Valves BYPASS ⊥ {mask}"


# ========================================
# POSITION MACROS
# ========================================

[gcode_macro GET_DRY_PAD_POSITION]
variable_current_x: 0
variable_current_y: 0
variable_base_x: 87.00
variable_base_y: 335.00
variable_x_spacing: 4.0
variable_y_spacing: 4.0
gcode:
    {% set key = params.KEY|int %}
    {% set row = (key - 1) // 35 %}
    {% set col = (key - 1) % 35 %}
    {% set x_coord = printer["gcode_macro GET_DRY_PAD_POSITION"].base_x + (col * printer["gcode_macro GET_DRY_PAD_POSITION"].x_spacing) %}
    {% set y_coord = printer["gcode_macro GET_DRY_PAD_POSITION"].base_y + (row * printer["gcode_macro GET_DRY_PAD_POSITION"].y_spacing) %}
    
    RESPOND MSG="Position {key}: X{x_coord} Y{y_coord}"
    SET_GCODE_VARIABLE MACRO=GET_DRY_PAD_POSITION VARIABLE=current_x VALUE={x_coord}
    SET_GCODE_VARIABLE MACRO=GET_DRY_PAD_POSITION VARIABLE=current_y VALUE={y_coord}

[gcode_macro TOUCH_DRY]
variable_current_position: 1
variable_max_positions: 210
gcode:
    {% set pos = printer["gcode_macro TOUCH_DRY"].current_position %}
    {% set row = (pos - 1) // 35 %}
    {% set col = (pos - 1) % 35 %}
    {% set base_x = 87.00 %}
    {% set base_y = 335.00 %}
    {% set x_spacing = 4.0 %}
    {% set y_spacing = 4.0 %}
    {% set x_coord = base_x + (col * x_spacing) %}
    {% set y_coord = base_y + (row * y_spacing) %}
    
    {% set ptip_z = printer.save_variables.variables.ptipz|default(70) %}
    {% set ptip_servo = printer.save_variables.variables.ptipservo|default(115) %}
    
    RESPOND MSG="Moving to dry pad position {pos}: X{x_coord} Y{y_coord}"
    RESPOND MSG="Using pipette settings: Z{ptip_z}, Servo{ptip_servo}"
    SET_SERVO SERVO=linearactuator_servo_l0 ANGLE=0
    G4 P1000
    G0 Z110 F1000
    G4 P1500
    G0 X{x_coord} Y{y_coord} F3000
    G4 P1500
    G1 Z{ptip_z} F1000
    G4 P1500
    SET_SERVO SERVO=linearactuator_servo_l0 ANGLE={ptip_servo}
    G4 P1000
    SET_SERVO SERVO=linearactuator_servo_l0 ANGLE=0
    
    {% set next_pos = pos + 1 %}
    {% if next_pos > printer["gcode_macro TOUCH_DRY"].max_positions %}
        {% set next_pos = 1 %}
    {% endif %}
    
    SET_GCODE_VARIABLE MACRO=TOUCH_DRY VARIABLE=current_position VALUE={next_pos}
    RESPOND MSG="Next touch dry will use position {next_pos}"

[gcode_macro SETP100]
gcode:
    SAVE_VARIABLE VARIABLE=ptipz VALUE=65
    SAVE_VARIABLE VARIABLE=ptipservo VALUE=110
    SAVE_VARIABLE VARIABLE=ptipzeject VALUE=38
    SAVE_VARIABLE VARIABLE=ptipservoeject VALUE=170
    SAVE_VARIABLE VARIABLE=ptipypos VALUE=367
    RESPOND MSG="Switched to P100 tip settings: Z65, Servo110, ZEject 38, ServoEject 170, YEject 367"

[gcode_macro SETP300]
gcode:
    SAVE_VARIABLE VARIABLE=ptipz VALUE=70
    SAVE_VARIABLE VARIABLE=ptipservo VALUE=115
    SAVE_VARIABLE VARIABLE=ptipzeject VALUE=38
    SAVE_VARIABLE VARIABLE=ptipservoeject VALUE=170
    SAVE_VARIABLE VARIABLE=ptipypos VALUE=367
    RESPOND MSG="Switched to P300 tip settings: Z70, Servo115, ZEject 38, ServoEject 170, YEject 367"

[gcode_macro CHECK_TIP_SETTINGS]
gcode:
    {% set ptip_z = printer.save_variables.variables.ptipz|default(70) %}
    {% set ptip_servo = printer.save_variables.variables.ptipservo|default(115) %}
    {% set ptip_z_eject = printer.save_variables.variables.ptipzeject|default(38) %}
    {% set ptip_servo_eject = printer.save_variables.variables.ptipservoeject|default(170) %}
    {% set ptip_y_pos = printer.save_variables.variables.ptipypos|default(367) %}
    RESPOND MSG="Current settings - TouchDry: Z{ptip_z}, Servo{ptip_servo} | Eject: Z{ptip_z_eject}, Servo{ptip_servo_eject}, Y{ptip_y_pos}"

[gcode_macro WASTE_POSITION]
description: Positions valve to shut off flow (bypass) - with safe Y positioning
gcode:
  {% set current_y = printer.toolhead.position.y %}
  {% if current_y > 341 %}
    SET_SERVO SERVO=linearactuator_servo_l0 ANGLE=100
    G4 P1000
    G1 Z130 F1000
    G1 Y340.000 F4000
    G4 P1000
    SET_SERVO SERVO=linearactuator_servo_l0 ANGLE=0
    G4 P2000
    G4 P1000
  {% endif %}  
  G1 X170.000 F4000
  G4 P1000
  G1 Y372.000 F4000
  G4 P1000
  SET_SERVO SERVO=linearactuator_servo_l0 ANGLE=100
  G4 P1000
  G1 Y373.000 F4000
  G4 P1000
  G1 Z92.000 F500
  G4 P1000
  SET_SERVO SERVO=linearactuator_servo_l0 ANGLE=170
  G4 P1000

[gcode_macro WASH_POSITION]
description: Positions tool at wash station well A1
gcode:
  {% set current_y = printer.toolhead.position.y %}
  {% if current_y > 345 %}
    SET_SERVO SERVO=linearactuator_servo_l0 ANGLE=100
    G4 P1000
    G1 Z130 F1000
    G1 Y340.000 F4000
    G4 P1000
    SET_SERVO SERVO=linearactuator_servo_l0 ANGLE=0
    G4 P1000
  {% endif %}
  G90
  SET_SERVO SERVO=linearactuator_servo_l0 ANGLE=0
  G4 P500
  G1 Z100 F1000
  G1 X134.00 Y374.50 F3000
  G4 P500
  G1 Z70 F1000
  SET_SERVO SERVO=linearactuator_servo_l0 ANGLE=120
  G4 P500

[gcode_macro EJECT_PIPETTE]
description: Eject pipette tip
gcode:
  SET_SERVO SERVO=linearactuator_servo_l0 ANGLE=0
  G4 P1000
  {% set current_y = printer.toolhead.position.y %}
  {% if current_y > 372 %}
    G1 Y340.000 F4000
    G4 P1000
  {% endif %}
  G90
  G1 Z120 F750
  G4 P500
  SET_SERVO SERVO=linearactuator_servo_l0 ANGLE=0
  G4 P500
  G1 X318.00 Y350.00 F3000
  G4 P500
  G1 Z38 F500
  G4 P500
  SET_SERVO SERVO=linearactuator_servo_l0 ANGLE=170
  G4 P1500
  G1 X318.00 Y367.00 F3000
  G4 P1500
  SET_SERVO SERVO=linearactuator_servo_l0 ANGLE=0
  G4 P500
  G1 X318.00 Y358.00 F3000
  G4 P500
  SET_SERVO SERVO=linearactuator_servo_l0 ANGLE=130
  G4 P1000
  SET_SERVO SERVO=linearactuator_servo_l0 ANGLE=0
  G4 P1000

[gcode_macro WASH_ON_TIMED]
gcode:
    {% set duration = params.DURATION|default(30)|int %}
    WASH_ON
    G4 P{duration * 1000}
    WASH_OFF
    RESPOND MSG="Timed wash completed ({duration}s)"