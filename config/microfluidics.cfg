# ========================================
# MICROFLUIDICS ENHANCED - READS FROM VARIABLES.CFG
# ========================================
# All positions and settings read from variables.cfg
# Drypad uses: drypad_base_x, drypad_base_y, etc.
# Tips use: tips_config JSON object
# No hardcoded values!
# ========================================

# ========================================
# DRYPAD MACROS
# ========================================

[gcode_macro SHOW_DRYPAD_CONFIG]
description: Display current drypad grid configuration from variables.cfg
gcode:
    {% set base_x = printer.save_variables.variables.drypad_base_x|default(92.0) %}
    {% set base_y = printer.save_variables.variables.drypad_base_y|default(335.0) %}
    {% set columns = printer.save_variables.variables.drypad_columns|default(35) %}
    {% set rows = printer.save_variables.variables.drypad_rows|default(6) %}
    {% set x_spacing = printer.save_variables.variables.drypad_x_spacing|default(4.0) %}
    {% set y_spacing = printer.save_variables.variables.drypad_y_spacing|default(4.0) %}
    {% set total = printer.save_variables.variables.drypad_total_positions|default(210) %}
    
    RESPOND MSG="=== Drypad Configuration ==="
    RESPOND MSG="Base Position: X{base_x} Y{base_y}"
    RESPOND MSG="Grid Size: {columns} columns × {rows} rows = {total} positions"
    RESPOND MSG="Spacing: X{x_spacing}mm Y{y_spacing}mm"

[gcode_macro GET_DRYPAD_POSITION]
description: Calculate drypad coordinates - GET_DRYPAD_POSITION KEY=15
variable_current_x: 0
variable_current_y: 0
gcode:
    {% set key = params.KEY|int %}
    {% set base_x = printer.save_variables.variables.drypad_base_x|default(92.0) %}
    {% set base_y = printer.save_variables.variables.drypad_base_y|default(335.0) %}
    {% set columns = printer.save_variables.variables.drypad_columns|default(35) %}
    {% set x_spacing = printer.save_variables.variables.drypad_x_spacing|default(4.0) %}
    {% set y_spacing = printer.save_variables.variables.drypad_y_spacing|default(4.0) %}
    
    {% set row = (key - 1) // columns %}
    {% set col = (key - 1) % columns %}
    {% set x_coord = base_x + (col * x_spacing) %}
    {% set y_coord = base_y + (row * y_spacing) %}
    
    RESPOND MSG="Position {key}: X{x_coord} Y{y_coord}"
    SET_GCODE_VARIABLE MACRO=GET_DRYPAD_POSITION VARIABLE=current_x VALUE={x_coord}
    SET_GCODE_VARIABLE MACRO=GET_DRYPAD_POSITION VARIABLE=current_y VALUE={y_coord}

[gcode_macro TOUCH_DRY_AT]
description: Touch specific drypad position - TOUCH_DRY_AT KEY=15
gcode:
    {% set key = params.KEY|int %}
    {% set base_x = printer.save_variables.variables.drypad_base_x|default(92.0) %}
    {% set base_y = printer.save_variables.variables.drypad_base_y|default(335.0) %}
    {% set columns = printer.save_variables.variables.drypad_columns|default(35) %}
    {% set x_spacing = printer.save_variables.variables.drypad_x_spacing|default(4.0) %}
    {% set y_spacing = printer.save_variables.variables.drypad_y_spacing|default(4.0) %}
    
    # Get active tip settings from JSON
    {% set tips = printer.save_variables.variables.tips_config|default({}) %}
    {% set active_tip_num = printer.save_variables.variables.active_tip|default(0) %}
    {% set tip_key = "tip" ~ active_tip_num %}
    {% set tip = tips.get(tip_key, {}) %}
    
    {% set drypad_z = tip.get('drypad_z', 70.0) %}
    {% set drypad_servo = tip.get('drypad_servo', 115) %}
    {% set drypad_time = tip.get('drypad_time', 3000) %}
    
    # Calculate position
    {% set row = (key - 1) // columns %}
    {% set col = (key - 1) % columns %}
    {% set x_coord = base_x + (col * x_spacing) %}
    {% set y_coord = base_y + (row * y_spacing) %}
    
    RESPOND MSG="Drypad position {key}: X{x_coord} Y{y_coord}"
    RESPOND MSG="Using Tip {active_tip_num}: Z{drypad_z} Servo{drypad_servo}"
    
    # Execute movement
    SET_SERVO SERVO=linearactuator_servo_l0 ANGLE=0
    G4 P1000
    G0 Z110 F1000
    G4 P1500
    G0 X{x_coord} Y{y_coord} F3000
    G4 P1500
    G1 Z{drypad_z} F1000
    G4 P1500
    SET_SERVO SERVO=linearactuator_servo_l0 ANGLE={drypad_servo}
    G4 P{drypad_time}
    SET_SERVO SERVO=linearactuator_servo_l0 ANGLE=0

[gcode_macro TOUCH_DRY]
description: Touch drypad with auto-increment position
variable_current_position: 1
gcode:
    {% set pos = printer["gcode_macro TOUCH_DRY"].current_position %}
    {% set max_pos = printer.save_variables.variables.drypad_total_positions|default(210) %}
    
    # Touch at current position
    TOUCH_DRY_AT KEY={pos}
    
    # Increment for next time
    {% set next_pos = pos + 1 %}
    {% if next_pos > max_pos %}
        {% set next_pos = 1 %}
    {% endif %}
    
    SET_GCODE_VARIABLE MACRO=TOUCH_DRY VARIABLE=current_position VALUE={next_pos}
    RESPOND MSG="Next TOUCH_DRY will use position {next_pos}"

# ========================================
# TIP MANAGEMENT MACROS
# ========================================

[gcode_macro SELECT_TIP]
description: Select active tip - SELECT_TIP TIP=0
gcode:
    {% set tip = params.TIP|default(0)|int %}
    {% set tips = printer.save_variables.variables.tips_config|default({}) %}
    {% set tip_key = "tip" ~ tip %}
    
    {% if tip_key in tips %}
        SAVE_VARIABLE VARIABLE=active_tip VALUE={tip}
        RESPOND MSG="✓ Active tip set to Tip {tip}"
    {% else %}
        RESPOND MSG="⚠️ Tip {tip} not configured! Using defaults."
        SAVE_VARIABLE VARIABLE=active_tip VALUE={tip}
    {% endif %}

[gcode_macro ACTIVE_TIP]
description: Show currently active tip and its settings
gcode:
    {% set tips = printer.save_variables.variables.tips_config|default({}) %}
    {% set active_tip_num = printer.save_variables.variables.active_tip|default(0) %}
    {% set tip_key = "tip" ~ active_tip_num %}
    {% set tip = tips.get(tip_key, {}) %}
    
    {% if tip %}
        RESPOND MSG="=== Active Tip: {active_tip_num} ==="
        RESPOND MSG="Drypad: Z{tip.get('drypad_z', 'N/A')} Servo{tip.get('drypad_servo', 'N/A')} Time{tip.get('drypad_time', 'N/A')}ms"
        RESPOND MSG="Wash: X{tip.get('wash_x', 'N/A')} Y{tip.get('wash_y', 'N/A')} Z{tip.get('wash_z', 'N/A')} Servo{tip.get('wash_servo', 'N/A')}"
        RESPOND MSG="Waste: X{tip.get('waste_x', 'N/A')} Y{tip.get('waste_y', 'N/A')} Z{tip.get('waste_z', 'N/A')} Servo{tip.get('waste_servo', 'N/A')}"
        RESPOND MSG="Eject: X{tip.get('eject_x', 'N/A')} Y{tip.get('eject_y', 'N/A')} Z{tip.get('eject_z', 'N/A')} Servo{tip.get('eject_servo', 'N/A')}"
    {% else %}
        RESPOND MSG="⚠️ Tip {active_tip_num} not configured - using defaults"
    {% endif %}

[gcode_macro LIST_TIPS]
description: List all configured tips
gcode:
    {% set tips = printer.save_variables.variables.tips_config|default({}) %}
    {% set active_tip_num = printer.save_variables.variables.active_tip|default(0) %}
    
    RESPOND MSG="=== Configured Tips ==="
    {% for tip_key in tips.keys()|sort %}
        {% set tip_num = tip_key.replace('tip', '') %}
        {% set marker = " (ACTIVE)" if tip_num|int == active_tip_num else "" %}
        RESPOND MSG="Tip {tip_num}{marker}: ✓ Configured"
    {% endfor %}
    
    {% if tips|length == 0 %}
        RESPOND MSG="No tips configured!"
    {% endif %}

# ========================================
# POSITION MACROS (READ FROM JSON)
# ========================================

[gcode_macro GO_WASH]
description: Move to wash station using active tip settings
gcode:
    {% set tips = printer.save_variables.variables.tips_config|default({}) %}
    {% set active_tip_num = printer.save_variables.variables.active_tip|default(0) %}
    {% set tip_key = "tip" ~ active_tip_num %}
    {% set tip = tips.get(tip_key, {}) %}
    
    {% set wash_x = tip.get('wash_x', 134.0) %}
    {% set wash_y = tip.get('wash_y', 374.5) %}
    {% set wash_z = tip.get('wash_z', 70.0) %}
    {% set wash_servo = tip.get('wash_servo', 120) %}
    
    {% set current_y = printer.toolhead.position.y %}
    
    RESPOND MSG="Moving to wash - Tip {active_tip_num}: X{wash_x} Y{wash_y} Z{wash_z} Servo{wash_servo}"
    
    # Safety check for Y position
    {% if current_y > 345 %}
        SET_SERVO SERVO=linearactuator_servo_l0 ANGLE=100
        G4 P1000
        G1 Z130 F1000
        G1 Y340.000 F4000
        G4 P1000
        SET_SERVO SERVO=linearactuator_servo_l0 ANGLE=0
        G4 P1000
    {% endif %}
    
    G90
    SET_SERVO SERVO=linearactuator_servo_l0 ANGLE=0
    G4 P500
    G1 Z100 F1000
    G1 X{wash_x} Y{wash_y} F3000
    G4 P500
    G1 Z{wash_z} F1000
    SET_SERVO SERVO=linearactuator_servo_l0 ANGLE={wash_servo}
    G4 P500

[gcode_macro GO_WASTE]
description: Move to waste station using active tip settings
gcode:
    {% set tips = printer.save_variables.variables.tips_config|default({}) %}
    {% set active_tip_num = printer.save_variables.variables.active_tip|default(0) %}
    {% set tip_key = "tip" ~ active_tip_num %}
    {% set tip = tips.get(tip_key, {}) %}
    
    {% set waste_x = tip.get('waste_x', 170.0) %}
    {% set waste_y = tip.get('waste_y', 373.0) %}
    {% set waste_z = tip.get('waste_z', 92.0) %}
    {% set waste_servo = tip.get('waste_servo', 170) %}
    
    {% set current_y = printer.toolhead.position.y %}
    
    RESPOND MSG="Moving to waste - Tip {active_tip_num}: X{waste_x} Y{waste_y} Z{waste_z} Servo{waste_servo}"
    
    # Safety check for Y position
    {% if current_y > 341 %}
        SET_SERVO SERVO=linearactuator_servo_l0 ANGLE=100
        G4 P1000
        G1 Z130 F1000
        G1 Y340.000 F4000
        G4 P1000
        SET_SERVO SERVO=linearactuator_servo_l0 ANGLE=0
        G4 P2000
        G4 P1000
    {% endif %}
    
    G1 X{waste_x} F4000
    G4 P1000
    G1 Y{waste_y - 1} F4000
    G4 P1000
    SET_SERVO SERVO=linearactuator_servo_l0 ANGLE=100
    G4 P1000
    G1 Y{waste_y} F4000
    G4 P1000
    G1 Z{waste_z} F500
    G4 P1000
    SET_SERVO SERVO=linearactuator_servo_l0 ANGLE={waste_servo}
    G4 P1000

[gcode_macro BAYONET_EJECT]
description: Eject tip using bayonet motion with active tip settings
gcode:
    {% set tips = printer.save_variables.variables.tips_config|default({}) %}
    {% set active_tip_num = printer.save_variables.variables.active_tip|default(0) %}
    {% set tip_key = "tip" ~ active_tip_num %}
    {% set tip = tips.get(tip_key, {}) %}
    
    {% set eject_x = tip.get('eject_x', 65.0) %}
    {% set eject_y = tip.get('eject_y', 340.0) %}
    {% set eject_z = tip.get('eject_z', 40.0) %}
    {% set eject_servo = tip.get('eject_servo', 150) %}
    
    RESPOND MSG="Ejecting tip - Tip {active_tip_num}: X{eject_x} Y{eject_y} Z{eject_z} Servo{eject_servo}"
    
    # Move to eject position
    SET_SERVO SERVO=linearactuator_servo_l0 ANGLE=0
    G4 P500
    G1 Z100 F1000
    G4 P500
    G1 X{eject_x} Y{eject_y} F3000
    G4 P500
    G1 Z{eject_z} F500
    G4 P500
    SET_SERVO SERVO=linearactuator_servo_l0 ANGLE={eject_servo}
    G4 P1500
    
    # Bayonet oscillation sequence
    G1 X57 Z42 F3000
    G1 X77 Z55 F3000
    G1 X57 Z42 F3000
    G1 X77 Z55 F3000
    G1 X57 Z42 F3000
    G1 X77 Z55 F3000
    G1 X57 Z42 F3000
    G1 X77 Z55 F3000
    
    # Retract
    G1 Z100 F1000
    SET_SERVO SERVO=linearactuator_servo_l0 WIDTH=0
    G4 P500

# ========================================
# LEGACY MACROS (For compatibility)
# ========================================

[gcode_macro WASH_POSITION]
description: Legacy - use GO_WASH instead
gcode:
    GO_WASH

[gcode_macro WASTE_POSITION]
description: Legacy - use GO_WASTE instead
gcode:
    GO_WASTE

[gcode_macro EJECT_PIPETTE]
description: Legacy - use BAYONET_EJECT instead
gcode:
    BAYONET_EJECT