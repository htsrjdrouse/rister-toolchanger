# ========================================
# MICROFLUIDICS COMPLETE CONFIGURATION (NEW)
# Includes: Arduino serial, valve control, pumps, and tip management
# Added: FLUSH position (180°) - bypasses syringe, PCV to output
# ========================================

# ========================================
# ARDUINO SERIAL COMMUNICATION
# ========================================

[arduino_serial]
#serial_port: /dev/ttyACM1
serial_port: /dev/serial/by-id/usb-Arduino_LLC_Arduino_Micro-if00
baud_rate: 115200

[fan_generic arduino_power]
pin: PA8
max_power: 1.0

[delayed_gcode arduino_power_on]
initial_duration: 1
gcode:
    SET_FAN_SPEED FAN=arduino_power SPEED=1

# ========================================
# PUMP CONTROL MACROS
# ========================================

[gcode_macro MANUAL_PCV]
description: Turns off liquid level feedback so that you can manually fill the pressure compensation vessel
gcode:
    G4 P2000
    SEND_ARDUINO COMMAND="manpcv"
    G4 P1000

[gcode_macro FEEDBACK_PCV]
description: Turns on liquid level feedback control for stabilizing pressure within the dispensing system
gcode:
    G4 P2000
    SEND_ARDUINO COMMAND="feedbackpcv"
    G4 P1000

[gcode_macro WASH_ON]
description: Turns on wash pump in wash station
gcode:
    G4 P1000
    SEND_ARDUINO COMMAND="washon"
    G4 P1000

[gcode_macro WASH_OFF]
description: Turns off wash pump in wash station
gcode:
    G4 P1000
    SEND_ARDUINO COMMAND="washoff"
    G4 P1000

[gcode_macro WASTE_ON]
description: Turns on waste pump in wash station
gcode:
    G4 P1000
    SEND_ARDUINO COMMAND="dryon"
    G4 P1000

[gcode_macro WASTE_OFF]
description: Turns off waste pump in wash station
gcode:
    G4 P1000
    SEND_ARDUINO COMMAND="dryoff"
    G4 P1000

# ========================================
# PUMP SPEED CONTROL MACROS
# ========================================

[gcode_macro SET_WASH_SPEED]
description: Set wash pump PWM speed (0-255)
gcode:
    {% set speed = params.SPEED|default(255)|int %}
    {% if speed < 0 %}
        {% set speed = 0 %}
    {% elif speed > 255 %}
        {% set speed = 255 %}
    {% endif %}
    G4 P1000
    SEND_ARDUINO COMMAND="setwashval {speed}"
    G4 P1000
    RESPOND MSG="Wash pump speed set to {speed} (0-255)"

[gcode_macro SET_DRY_SPEED]
description: Set waste/dry pump PWM speed (0-255)
gcode:
    {% set speed = params.SPEED|default(255)|int %}
    {% if speed < 0 %}
        {% set speed = 0 %}
    {% elif speed > 255 %}
        {% set speed = 255 %}
    {% endif %}
    G4 P1000
    SEND_ARDUINO COMMAND="setdryval {speed}"
    G4 P1000
    RESPOND MSG="Waste/Dry pump speed set to {speed} (0-255)"

[gcode_macro SET_PCV_SPEED]
description: Set PCV pump PWM speed (0-255)
gcode:
    {% set speed = params.SPEED|default(255)|int %}
    {% if speed < 0 %}
        {% set speed = 0 %}
    {% elif speed > 255 %}
        {% set speed = 255 %}
    {% endif %}
    G4 P1000
    SEND_ARDUINO COMMAND="setpcvval {speed}"
    G4 P1000
    RESPOND MSG="PCV pump speed set to {speed} (0-255)"

[gcode_macro WASH_ON_WITH_SPEED]
description: Turn on wash pump with specified speed (0-255)
gcode:
    {% set speed = params.SPEED|default(255)|int %}
    SET_WASH_SPEED SPEED={speed}
    G4 P500
    WASH_ON
    RESPOND MSG="Wash pump started at speed {speed}"

[gcode_macro WASTE_ON_WITH_SPEED]
description: Turn on waste pump with specified speed (0-255)
gcode:
    {% set speed = params.SPEED|default(255)|int %}
    SET_DRY_SPEED SPEED={speed}
    G4 P500
    WASTE_ON
    RESPOND MSG="Waste pump started at speed {speed}"

[gcode_macro WASH_ON_TIMED]
description: Turn on wash for specified duration
gcode:
    {% set duration = params.DURATION|default(30)|int %}
    WASH_ON
    G4 P{duration * 1000}
    WASH_OFF
    RESPOND MSG="Timed wash completed ({duration}s)"

# ========================================
# LINEAR ACTUATOR CONTROL (ARDUINO)
# ========================================

[gcode_macro LINEARACTSERVOON]
description: Turn on 5V power for servo on liquid dispenser 0
gcode:
    RESPOND MSG="Turning on 5V for L0 servo"
    SEND_ARDUINO COMMAND="turnon5v"

[gcode_macro LINEARACTSERVOOFF]
description: Turn off 5V power for servo on liquid dispenser 0
gcode:
    RESPOND MSG="Turning off 5V for L0 servo"
    SEND_ARDUINO COMMAND="turnoff5v"

[gcode_macro LINEARACTSERVOANGLE]
description: Set linear actuator servo angle - LINEARACTSERVOANGLE ANGLE=90
gcode:
    {% set angle = params.ANGLE|default(90)|int %}
    RESPOND MSG="Setting L0 servo to {angle} degrees"
    SEND_ARDUINO COMMAND="linearact {angle}"
    SAVE_VARIABLE VARIABLE=linearactuator_servo_position VALUE={angle}

[gcode_macro LINEARACTSERVOHOLD]
description: Power on servo and set angle (stays on) - LINEARACTSERVOHOLD ANGLE=90
gcode:
    {% set angle = params.ANGLE|default(90)|int %}
    LINEARACTSERVOON
    G4 P500                     ; Stabilization delay to prevent oscillation
    LINEARACTSERVOANGLE ANGLE={angle}

[gcode_macro LINEARACTSERVOMOVE]
description: Complete servo movement with power on/off - LINEARACTSERVOMOVE ANGLE=90 HOLD=1000
gcode:
    {% set angle = params.ANGLE|default(90)|int %}
    {% set hold_time = params.HOLD|default(1000)|int %}

    LINEARACTSERVOON
    G4 P500
    LINEARACTSERVOANGLE ANGLE={angle}
    G4 P{hold_time}
    LINEARACTSERVOOFF

# ========================================
# SERVO ANGLE CONFIGURATION
# Now includes FLUSH position (180°)
# ========================================

[gcode_macro CONFIGURE_SERVO_ANGLES]
description: Set custom servo angles for INPUT, OUTPUT, BYPASS, and FLUSH states
gcode:
    {% set servo_a_input = params.SERVO_A_INPUT|default(0)|int %}
    {% set servo_a_output = params.SERVO_A_OUTPUT|default(90)|int %}
    {% set servo_a_bypass = params.SERVO_A_BYPASS|default(35)|int %}
    {% set servo_a_flush = params.SERVO_A_FLUSH|default(180)|int %}

    {% set servo_b_input = params.SERVO_B_INPUT|default(0)|int %}
    {% set servo_b_output = params.SERVO_B_OUTPUT|default(90)|int %}
    {% set servo_b_bypass = params.SERVO_B_BYPASS|default(35)|int %}
    {% set servo_b_flush = params.SERVO_B_FLUSH|default(180)|int %}

    {% set servo_c_input = params.SERVO_C_INPUT|default(0)|int %}
    {% set servo_c_output = params.SERVO_C_OUTPUT|default(90)|int %}
    {% set servo_c_bypass = params.SERVO_C_BYPASS|default(35)|int %}
    {% set servo_c_flush = params.SERVO_C_FLUSH|default(180)|int %}

    {% set servo_d_input = params.SERVO_D_INPUT|default(0)|int %}
    {% set servo_d_output = params.SERVO_D_OUTPUT|default(90)|int %}
    {% set servo_d_bypass = params.SERVO_D_BYPASS|default(35)|int %}
    {% set servo_d_flush = params.SERVO_D_FLUSH|default(180)|int %}

    SAVE_VARIABLE VARIABLE=servo_a_input VALUE={servo_a_input}
    SAVE_VARIABLE VARIABLE=servo_a_output VALUE={servo_a_output}
    SAVE_VARIABLE VARIABLE=servo_a_bypass VALUE={servo_a_bypass}
    SAVE_VARIABLE VARIABLE=servo_a_flush VALUE={servo_a_flush}

    SAVE_VARIABLE VARIABLE=servo_b_input VALUE={servo_b_input}
    SAVE_VARIABLE VARIABLE=servo_b_output VALUE={servo_b_output}
    SAVE_VARIABLE VARIABLE=servo_b_bypass VALUE={servo_b_bypass}
    SAVE_VARIABLE VARIABLE=servo_b_flush VALUE={servo_b_flush}

    SAVE_VARIABLE VARIABLE=servo_c_input VALUE={servo_c_input}
    SAVE_VARIABLE VARIABLE=servo_c_output VALUE={servo_c_output}
    SAVE_VARIABLE VARIABLE=servo_c_bypass VALUE={servo_c_bypass}
    SAVE_VARIABLE VARIABLE=servo_c_flush VALUE={servo_c_flush}

    SAVE_VARIABLE VARIABLE=servo_d_input VALUE={servo_d_input}
    SAVE_VARIABLE VARIABLE=servo_d_output VALUE={servo_d_output}
    SAVE_VARIABLE VARIABLE=servo_d_bypass VALUE={servo_d_bypass}
    SAVE_VARIABLE VARIABLE=servo_d_flush VALUE={servo_d_flush}

    RESPOND MSG="Servo A: INPUT={servo_a_input} OUTPUT={servo_a_output} BYPASS={servo_a_bypass} FLUSH={servo_a_flush}"
    RESPOND MSG="Servo B: INPUT={servo_b_input} OUTPUT={servo_b_output} BYPASS={servo_b_bypass} FLUSH={servo_b_flush}"
    RESPOND MSG="Servo C: INPUT={servo_c_input} OUTPUT={servo_c_output} BYPASS={servo_c_bypass} FLUSH={servo_c_flush}"
    RESPOND MSG="Servo D: INPUT={servo_d_input} OUTPUT={servo_d_output} BYPASS={servo_d_bypass} FLUSH={servo_d_flush}"

[gcode_macro CHECK_SERVO_ANGLES]
description: Display current servo angle configuration including FLUSH
gcode:
    {% set servo_a_input = printer.save_variables.variables.servo_a_input|default(0)|int %}
    {% set servo_a_output = printer.save_variables.variables.servo_a_output|default(90)|int %}
    {% set servo_a_bypass = printer.save_variables.variables.servo_a_bypass|default(35)|int %}
    {% set servo_a_flush = printer.save_variables.variables.servo_a_flush|default(180)|int %}

    {% set servo_b_input = printer.save_variables.variables.servo_b_input|default(0)|int %}
    {% set servo_b_output = printer.save_variables.variables.servo_b_output|default(90)|int %}
    {% set servo_b_bypass = printer.save_variables.variables.servo_b_bypass|default(35)|int %}
    {% set servo_b_flush = printer.save_variables.variables.servo_b_flush|default(180)|int %}

    {% set servo_c_input = printer.save_variables.variables.servo_c_input|default(0)|int %}
    {% set servo_c_output = printer.save_variables.variables.servo_c_output|default(90)|int %}
    {% set servo_c_bypass = printer.save_variables.variables.servo_c_bypass|default(35)|int %}
    {% set servo_c_flush = printer.save_variables.variables.servo_c_flush|default(180)|int %}

    {% set servo_d_input = printer.save_variables.variables.servo_d_input|default(0)|int %}
    {% set servo_d_output = printer.save_variables.variables.servo_d_output|default(90)|int %}
    {% set servo_d_bypass = printer.save_variables.variables.servo_d_bypass|default(35)|int %}
    {% set servo_d_flush = printer.save_variables.variables.servo_d_flush|default(180)|int %}

    RESPOND MSG="=== Valve Servo Angles ==="
    RESPOND MSG="Position:  INPUT  OUTPUT  BYPASS  FLUSH"
    RESPOND MSG="Servo A:   {servo_a_input}°     {servo_a_output}°      {servo_a_bypass}°      {servo_a_flush}°"
    RESPOND MSG="Servo B:   {servo_b_input}°     {servo_b_output}°      {servo_b_bypass}°      {servo_b_flush}°"
    RESPOND MSG="Servo C:   {servo_c_input}°     {servo_c_output}°      {servo_c_bypass}°      {servo_c_flush}°"
    RESPOND MSG="Servo D:   {servo_d_input}°     {servo_d_output}°      {servo_d_bypass}°      {servo_d_flush}°"

# ========================================
# 4-VALVE CONTROL MACROS (with FLUSH)
# ========================================

[gcode_macro _SET_VALVES_ANGLE]
description: Internal macro - sends single command to Arduino for all valve positions
gcode:
    {% set mask = params.MASK|string %}
    {% set state = params.STATE|string %}

    # Load servo angles based on state
    {% if state == "INPUT" %}
        {% set angle_a = printer.save_variables.variables.servo_a_input|default(0)|int %}
        {% set angle_b = printer.save_variables.variables.servo_b_input|default(0)|int %}
        {% set angle_c = printer.save_variables.variables.servo_c_input|default(0)|int %}
        {% set angle_d = printer.save_variables.variables.servo_d_input|default(0)|int %}
    {% elif state == "OUTPUT" %}
        {% set angle_a = printer.save_variables.variables.servo_a_output|default(90)|int %}
        {% set angle_b = printer.save_variables.variables.servo_b_output|default(90)|int %}
        {% set angle_c = printer.save_variables.variables.servo_c_output|default(90)|int %}
        {% set angle_d = printer.save_variables.variables.servo_d_output|default(90)|int %}
    {% elif state == "BYPASS" %}
        {% set angle_a = printer.save_variables.variables.servo_a_bypass|default(35)|int %}
        {% set angle_b = printer.save_variables.variables.servo_b_bypass|default(35)|int %}
        {% set angle_c = printer.save_variables.variables.servo_c_bypass|default(35)|int %}
        {% set angle_d = printer.save_variables.variables.servo_d_bypass|default(35)|int %}
    {% elif state == "FLUSH" %}
        {% set angle_a = printer.save_variables.variables.servo_a_flush|default(180)|int %}
        {% set angle_b = printer.save_variables.variables.servo_b_flush|default(180)|int %}
        {% set angle_c = printer.save_variables.variables.servo_c_flush|default(180)|int %}
        {% set angle_d = printer.save_variables.variables.servo_d_flush|default(180)|int %}
    {% endif %}

    # Send command with proper formatting
    G4 P500
    SEND_ARDUINO COMMAND="turnon5v"
    G4 P2000
    SEND_ARDUINO COMMAND="setvalves_angle {mask} {angle_a} {angle_b} {angle_c} {angle_d}"
    G4 P2500
    SEND_ARDUINO COMMAND="turnoff5v"
    G4 P500

    RESPOND MSG="Servos moved for mask {mask} to {state}"

[gcode_macro VALVE_INPUT]
description: Set selected valves to INPUT (aspirate) - Example VALVE_INPUT MASK=1111 or VALVE_INPUT MASK=0100
gcode:
    {% set mask = params.MASK|default("1111") %}
    _SET_VALVES_ANGLE MASK={mask} STATE=INPUT
    RESPOND MSG="Valves INPUT <- {mask}"

[gcode_macro VALVE_OUTPUT]
description: Set selected valves to OUTPUT (dispense) - Example VALVE_OUTPUT MASK=1111 or VALVE_OUTPUT MASK=0001
gcode:
    {% set mask = params.MASK|default("1111") %}
    _SET_VALVES_ANGLE MASK={mask} STATE=OUTPUT
    RESPOND MSG="Valves OUTPUT -> {mask}"

[gcode_macro VALVE_BYPASS]
description: Set selected valves to BYPASS (closed) - Example VALVE_BYPASS MASK=1111 or VALVE_BYPASS MASK=1010
gcode:
    {% set mask = params.MASK|default("1111") %}
    _SET_VALVES_ANGLE MASK={mask} STATE=BYPASS
    RESPOND MSG="Valves BYPASS x {mask}"

[gcode_macro VALVE_FLUSH]
description: Set selected valves to FLUSH (PCV to output, bypasses syringe) - Example VALVE_FLUSH MASK=1111
gcode:
    {% set mask = params.MASK|default("1111") %}
    _SET_VALVES_ANGLE MASK={mask} STATE=FLUSH
    RESPOND MSG="Valves FLUSH >> {mask} (PCV direct to output)"

# ========================================
# DRYPAD CONFIGURATION
# ========================================

[gcode_macro SHOW_DRYPAD_CONFIG]
description: Display current drypad grid configuration from variables.cfg
gcode:
    {% set base_x = printer.save_variables.variables.drypad_base_x|default(92.0) %}
    {% set base_y = printer.save_variables.variables.drypad_base_y|default(335.0) %}
    {% set columns = printer.save_variables.variables.drypad_columns|default(35) %}
    {% set rows = printer.save_variables.variables.drypad_rows|default(6) %}
    {% set x_spacing = printer.save_variables.variables.drypad_x_spacing|default(4.0) %}
    {% set y_spacing = printer.save_variables.variables.drypad_y_spacing|default(4.0) %}
    {% set total = printer.save_variables.variables.drypad_total_positions|default(210) %}

    RESPOND MSG="=== Drypad Configuration ==="
    RESPOND MSG="Base Position: X{base_x} Y{base_y}"
    RESPOND MSG="Grid Size: {columns} columns x {rows} rows = {total} positions"
    RESPOND MSG="Spacing: X{x_spacing}mm Y{y_spacing}mm"

[gcode_macro GET_DRYPAD_POSITION]
description: Calculate drypad coordinates - GET_DRYPAD_POSITION KEY=15
variable_current_x: 0
variable_current_y: 0
gcode:
    {% set key = params.KEY|int %}
    {% set base_x = printer.save_variables.variables.drypad_base_x|default(92.0) %}
    {% set base_y = printer.save_variables.variables.drypad_base_y|default(335.0) %}
    {% set columns = printer.save_variables.variables.drypad_columns|default(35) %}
    {% set x_spacing = printer.save_variables.variables.drypad_x_spacing|default(4.0) %}
    {% set y_spacing = printer.save_variables.variables.drypad_y_spacing|default(4.0) %}

    {% set row = (key - 1) // columns %}
    {% set col = (key - 1) % columns %}
    {% set x_coord = base_x + (col * x_spacing) %}
    {% set y_coord = base_y + (row * y_spacing) %}

    RESPOND MSG="Position {key}: X{x_coord} Y{y_coord}"
    SET_GCODE_VARIABLE MACRO=GET_DRYPAD_POSITION VARIABLE=current_x VALUE={x_coord}
    SET_GCODE_VARIABLE MACRO=GET_DRYPAD_POSITION VARIABLE=current_y VALUE={y_coord}


[gcode_macro ACTIVE_TIP]
description: Show currently active tip and its settings
gcode:
    {% set tips = printer.save_variables.variables.tips_config|default({}) %}
    {% set active_tip_num = printer.save_variables.variables.active_tip|default(0) %}
    {% set tip_key = "tip" ~ active_tip_num %}
    {% set tip = tips.get(tip_key, {}) %}

    {% if tip %}
        RESPOND MSG="=== Active Tip: {active_tip_num} ==="
        RESPOND MSG="Drypad: Z{tip.get('drypad_z', 'N/A')} Servo{tip.get('drypad_servo', 'N/A')} Time{tip.get('drypad_time', 'N/A')}ms"
        RESPOND MSG="Wash: X{tip.get('wash_x', 'N/A')} Y{tip.get('wash_y', 'N/A')} Z{tip.get('wash_z', 'N/A')} Servo{tip.get('wash_servo', 'N/A')}"
        RESPOND MSG="Waste: X{tip.get('waste_x', 'N/A')} Y{tip.get('waste_y', 'N/A')} Z{tip.get('waste_z', 'N/A')} Servo{tip.get('waste_servo', 'N/A')}"
        RESPOND MSG="Eject: X{tip.get('eject_x', 'N/A')} Y{tip.get('eject_y', 'N/A')} Z{tip.get('eject_z', 'N/A')} Servo{tip.get('eject_servo', 'N/A')}"
    {% else %}
        RESPOND MSG="Tip {active_tip_num} not configured - using defaults"
    {% endif %}

[gcode_macro LIST_TIPS]
description: List all configured tips
gcode:
    {% set tips = printer.save_variables.variables.tips_config|default({}) %}
    {% set active_tip_num = printer.save_variables.variables.active_tip|default(0) %}

    RESPOND MSG="=== Configured Tips ==="
    {% for tip_key in tips.keys()|sort %}
        {% set tip_num = tip_key.replace('tip', '') %}
        {% set marker = " (ACTIVE)" if tip_num|int == active_tip_num else "" %}
        RESPOND MSG="Tip {tip_num}{marker}: Configured"
    {% endfor %}

    {% if tips|length == 0 %}
        RESPOND MSG="No tips configured!"
    {% endif %}

# ========================================
# POSITION MACROS (READ FROM JSON)
# ========================================

[gcode_macro GO_WASH]
description: Move to wash station using active tip settings
gcode:
    {% set tips = printer.save_variables.variables.tips_config|default({}) %}
    {% set active_tip_num = printer.save_variables.variables.active_tip|default(0) %}
    {% set tip_key = "tip" ~ active_tip_num %}
    {% set tip = tips.get(tip_key, {}) %}

    {% set wash_x = tip.get('wash_x', 134.0) %}
    {% set wash_y = tip.get('wash_y', 374.5) %}
    {% set wash_z = tip.get('wash_z', 70.0) %}
    {% set wash_servo = tip.get('wash_servo', 120) %}

    {% set current_y = printer.toolhead.position.y %}

    RESPOND MSG="Moving to wash - Tip {active_tip_num}: X{wash_x} Y{wash_y} Z{wash_z} Servo{wash_servo}"

    # Safety check for Y position
    {% if current_y > 345 %}
        LINEARACTSERVOMOVE ANGLE=100 HOLD=1000
        G1 Z130 F1000
        G1 Y340.000 F4000
        G4 P1000
        LINEARACTSERVOANGLE ANGLE=0
        G4 P1000
    {% endif %}

    G90
    LINEARACTSERVOANGLE ANGLE=0
    G4 P500
    G1 Z100 F1000
    G1 X{wash_x} Y{wash_y} F3000
    G4 P500
    G1 Z{wash_z} F1000
    LINEARACTSERVOMOVE ANGLE={wash_servo} HOLD=500

[gcode_macro GO_WASTE]
description: Move to waste station using active tip settings
gcode:
    {% set tips = printer.save_variables.variables.tips_config|default({}) %}
    {% set active_tip_num = printer.save_variables.variables.active_tip|default(0) %}
    {% set tip_key = "tip" ~ active_tip_num %}
    {% set tip = tips.get(tip_key, {}) %}

    {% set waste_x = tip.get('waste_x', 170.0) %}
    {% set waste_y = tip.get('waste_y', 373.0) %}
    {% set waste_z = tip.get('waste_z', 92.0) %}
    {% set waste_servo = tip.get('waste_servo', 170) %}

    {% set current_y = printer.toolhead.position.y %}

    RESPOND MSG="Moving to waste - Tip {active_tip_num}: X{waste_x} Y{waste_y} Z{waste_z} Servo{waste_servo}"

    # Safety check for Y position
    {% if current_y > 341 %}
        LINEARACTSERVOMOVE ANGLE=100 HOLD=1000
        G1 Z130 F1000
        G1 Y340.000 F4000
        G4 P1000
        LINEARACTSERVOANGLE ANGLE=0
        G4 P2000
    {% endif %}

    G1 X{waste_x} F4000
    G4 P1000
    G1 Y{waste_y - 1} F4000
    G4 P1000
    LINEARACTSERVOMOVE ANGLE=100 HOLD=1000
    G1 Y{waste_y} F4000
    G4 P1000
    G1 Z{waste_z} F500
    G4 P1000
    LINEARACTSERVOMOVE ANGLE={waste_servo} HOLD=1000

[gcode_macro BAYONET_EJECT]
description: Eject tip using bayonet motion with active tip settings
gcode:
    {% set tips = printer.save_variables.variables.tips_config|default({}) %}
    {% set active_tip_num = printer.save_variables.variables.active_tip|default(0) %}
    {% set tip_key = "tip" ~ active_tip_num %}
    {% set tip = tips.get(tip_key, {}) %}

    {% set eject_x = tip.get('eject_x', 65.0) %}
    {% set eject_y = tip.get('eject_y', 340.0) %}
    {% set eject_z = tip.get('eject_z', 40.0) %}
    {% set eject_servo = tip.get('eject_servo', 150) %}

    RESPOND MSG="Ejecting tip - Tip {active_tip_num}: X{eject_x} Y{eject_y} Z{eject_z} Servo{eject_servo}"

    # Move to eject position
    LINEARACTSERVOANGLE ANGLE=0
    G4 P500
    G1 Z100 F1000
    G4 P500
    G1 X{eject_x} Y{eject_y} F3000
    G4 P500
    G1 Z{eject_z} F500
    G4 P500
    LINEARACTSERVOMOVE ANGLE={eject_servo} HOLD=1500

    # Bayonet oscillation sequence
    G1 X57 Z42 F3000
    G1 X77 Z55 F3000
    G1 X57 Z42 F3000
    G1 X77 Z55 F3000
    G1 X57 Z42 F3000
    G1 X77 Z55 F3000
    G1 X57 Z42 F3000
    G1 X77 Z55 F3000

    # Retract
    G1 Z100 F1000
    LINEARACTSERVOOFF
    G4 P500

