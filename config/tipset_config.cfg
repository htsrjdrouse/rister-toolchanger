# =============================================================================
# TIP SELECTION MACRO
# =============================================================================

[gcode_macro SELECT_TIP]
description: Select active tip - Usage: SELECT_TIP TIP=0 (or 1, 2, 3)
gcode:
    {% set tip = params.TIP|int|default(0) %}
    
    {% if tip < 0 or tip > 3 %}
        RESPOND MSG="ERROR: Tip must be 0, 1, 2, or 3"
    {% else %}
        SET_GCODE_VARIABLE MACRO=ACTIVE_TIP VARIABLE=current_tip VALUE={tip}
        SAVE_VARIABLE VARIABLE=active_tip VALUE={tip}
        
        # Also update legacy variables for backward compatibility
        {% set prefix = "tip" ~ tip %}
        {% set drypad_z = printer.save_variables.variables[prefix ~ "_drypad_z"]|default(70)|float %}
        {% set drypad_servo = printer.save_variables.variables[prefix ~ "_drypad_servo"]|default(115)|int %}
        SAVE_VARIABLE VARIABLE=ptipz VALUE={drypad_z}
        SAVE_VARIABLE VARIABLE=ptipservo VALUE={drypad_servo}
        
        RESPOND MSG="✓ Activated Tip {tip}"
        SHOW_TIP TIP={tip}
    {% endif %}


# =============================================================================
# SHOW TIP CONFIGURATION
# =============================================================================

[gcode_macro SHOW_TIP]
description: Show configuration for a tip - Usage: SHOW_TIP TIP=0
gcode:
    {% set tip = params.TIP|int|default(0) %}
    {% set prefix = "tip" ~ tip %}
    {% set sv = printer.save_variables.variables %}
    
    # Read all values from variables.cfg
    {% set name = sv[prefix ~ "_name"]|default("Tip" ~ tip) %}
    {% set drypad_z = sv[prefix ~ "_drypad_z"]|default(70)|float %}
    {% set drypad_servo = sv[prefix ~ "_drypad_servo"]|default(115)|int %}
    {% set drypad_time = sv[prefix ~ "_drypad_time"]|default(3000)|int %}
    {% set wash_x = sv[prefix ~ "_wash_x"]|default(134)|float %}
    {% set wash_y = sv[prefix ~ "_wash_y"]|default(374.5)|float %}
    {% set wash_z = sv[prefix ~ "_wash_z"]|default(70)|float %}
    {% set wash_servo = sv[prefix ~ "_wash_servo"]|default(120)|int %}
    {% set waste_x = sv[prefix ~ "_waste_x"]|default(170)|float %}
    {% set waste_y = sv[prefix ~ "_waste_y"]|default(373)|float %}
    {% set waste_z = sv[prefix ~ "_waste_z"]|default(92)|float %}
    {% set waste_servo = sv[prefix ~ "_waste_servo"]|default(170)|int %}
    {% set eject_x = sv[prefix ~ "_eject_x"]|default(65)|float %}
    {% set eject_y = sv[prefix ~ "_eject_y"]|default(340)|float %}
    {% set eject_z = sv[prefix ~ "_eject_z"]|default(40)|float %}
    {% set eject_servo = sv[prefix ~ "_eject_servo"]|default(150)|int %}
    
    RESPOND MSG="=== {name} ({tip}) Configuration ==="
    RESPOND MSG="Drypad: Z{drypad_z} Servo{drypad_servo} Time{drypad_time}ms"
    RESPOND MSG="Wash:   X{wash_x} Y{wash_y} Z{wash_z} Servo{wash_servo}"
    RESPOND MSG="Waste:  X{waste_x} Y{waste_y} Z{waste_z} Servo{waste_servo}"
    RESPOND MSG="Eject:  X{eject_x} Y{eject_y} Z{eject_z} Servo{eject_servo}"


# =============================================================================
# LIST ALL TIPS
# =============================================================================

[gcode_macro LIST_TIPS]
description: List all tip configurations from variables.cfg
gcode:
    {% set sv = printer.save_variables.variables %}
    {% set active = sv.active_tip|default(0)|int %}
    
    RESPOND MSG="=== Available Tips ==="
    RESPOND MSG="0 - {sv.tip0_name|default('Tip0')}: Drypad Z{sv.tip0_drypad_z|default(70)} S{sv.tip0_drypad_servo|default(115)}"
    RESPOND MSG="1 - {sv.tip1_name|default('Tip1')}: Drypad Z{sv.tip1_drypad_z|default(65)} S{sv.tip1_drypad_servo|default(110)}"
    RESPOND MSG="2 - {sv.tip2_name|default('Tip2')}: Drypad Z{sv.tip2_drypad_z|default(75)} S{sv.tip2_drypad_servo|default(120)}"
    RESPOND MSG="3 - {sv.tip3_name|default('Tip3')}: Drypad Z{sv.tip3_drypad_z|default(70)} S{sv.tip3_drypad_servo|default(115)}"
    RESPOND MSG"====================="
    RESPOND MSG="Active: Tip {active}"
    RESPOND MSG=""
    RESPOND MSG="Usage: SELECT_TIP TIP=0"


# =============================================================================
# SET TIP PARAMETER HELPER
# =============================================================================

[gcode_macro SET_TIP_PARAM]
description: Set a tip parameter - Usage: SET_TIP_PARAM TIP=0 PARAM=drypad_z VALUE=72.5
gcode:
    {% set tip = params.TIP|int %}
    {% set param = params.PARAM|string %}
    {% set value = params.VALUE %}
    
    {% set var_name = "tip" ~ tip ~ "_" ~ param %}
    
    SAVE_VARIABLE VARIABLE={var_name} VALUE={value}
    RESPOND MSG="✓ Set {var_name} = {value}"
    
    # If this is the active tip and it's a drypad parameter, update legacy vars
    {% set active = printer.save_variables.variables.active_tip|default(0)|int %}
    {% if tip == active and param == "drypad_z" %}
        SAVE_VARIABLE VARIABLE=ptipz VALUE={value}
    {% elif tip == active and param == "drypad_servo" %}
        SAVE_VARIABLE VARIABLE=ptipservo VALUE={value}
    {% endif %}


# =============================================================================
# POSITION MACROS - Read from Active Tip in variables.cfg
# =============================================================================

[gcode_macro GO_WASH]
description: Move to wash position using active tip configuration
gcode:
    {% set active = printer.save_variables.variables.active_tip|default(0)|int %}
    {% set prefix = "tip" ~ active %}
    {% set sv = printer.save_variables.variables %}
    
    {% set wash_x = sv[prefix ~ "_wash_x"]|default(134)|float %}
    {% set wash_y = sv[prefix ~ "_wash_y"]|default(374.5)|float %}
    {% set wash_z = sv[prefix ~ "_wash_z"]|default(70)|float %}
    {% set wash_servo = sv[prefix ~ "_wash_servo"]|default(120)|int %}
    
    {% set current_y = printer.toolhead.position.y %}
    
    RESPOND MSG="Moving to wash (Tip {active})"
    
    # Safety: retract if too far back
    {% if current_y > 345 %}
        SET_SERVO SERVO=linearactuator_servo_l0 ANGLE=100
        G4 P1000
        G1 Z130 F1000
        G1 Y340.000 F4000
        G4 P1000
        SET_SERVO SERVO=linearactuator_servo_l0 ANGLE=0
        G4 P1000
    {% endif %}
    
    G90
    SET_SERVO SERVO=linearactuator_servo_l0 ANGLE=0
    G4 P500
    G1 Z100 F1000
    G1 X{wash_x} Y{wash_y} F3000
    G4 P500
    G1 Z{wash_z} F1000
    SET_SERVO SERVO=linearactuator_servo_l0 ANGLE={wash_servo}
    G4 P500
    
    RESPOND MSG="✓ At wash position"


[gcode_macro GO_WASTE]
description: Move to waste position using active tip configuration
gcode:
    {% set active = printer.save_variables.variables.active_tip|default(0)|int %}
    {% set prefix = "tip" ~ active %}
    {% set sv = printer.save_variables.variables %}
    
    {% set waste_x = sv[prefix ~ "_waste_x"]|default(170)|float %}
    {% set waste_y = sv[prefix ~ "_waste_y"]|default(373)|float %}
    {% set waste_z = sv[prefix ~ "_waste_z"]|default(92)|float %}
    {% set waste_servo = sv[prefix ~ "_waste_servo"]|default(170)|int %}
    
    {% set current_y = printer.toolhead.position.y %}
    
    RESPOND MSG="Moving to waste (Tip {active})"
    
    # Safety: retract if too far back
    {% if current_y > 341 %}
        SET_SERVO SERVO=linearactuator_servo_l0 ANGLE=100
        G4 P1000
        G1 Z130 F1000
        G1 Y340.000 F4000
        G4 P1000
        SET_SERVO SERVO=linearactuator_servo_l0 ANGLE=0
        G4 P2000
        G4 P1000
    {% endif %}
    
    G1 X{waste_x} F4000
    G4 P1000
    G1 Y{waste_y} F4000
    G4 P1000
    SET_SERVO SERVO=linearactuator_servo_l0 ANGLE=100
    G4 P1000
    G1 Z{waste_z} F500
    G4 P1000
    SET_SERVO SERVO=linearactuator_servo_l0 ANGLE={waste_servo}
    G4 P1000
    
    RESPOND MSG="✓ At waste position"


# =============================================================================
# BAYONET EJECT MACRO
# =============================================================================

[gcode_macro BAYONET_EJECT]
description: Eject bayonet using active tip configuration
gcode:
    {% set active = printer.save_variables.variables.active_tip|default(0)|int %}
    {% set prefix = "tip" ~ active %}
    {% set sv = printer.save_variables.variables %}
    
    {% set eject_x = sv[prefix ~ "_eject_x"]|default(65)|float %}
    {% set eject_y = sv[prefix ~ "_eject_y"]|default(340)|float %}
    {% set eject_z = sv[prefix ~ "_eject_z"]|default(40)|float %}
    {% set eject_servo = sv[prefix ~ "_eject_servo"]|default(150)|int %}
    
    RESPOND MSG="Starting bayonet eject (Tip {active})"
    
    # Initial positioning
    G90
    G1 Z100 F1500
    G1 X{eject_x} F3000  
    G4 P500
    G1 Y340 F3000
    ENABLE_LINEARACTUATOR_SERVO_L0
    SET_SERVO SERVO=linearactuator_servo_l0 ANGLE={eject_servo}
    G4 P500
    G1 Z{eject_z} F1500
    G1 Y358 F3000
    G4 P500
    
    # Oscillating motion to release bayonet
    G1 X57 F1000
    G1 Z47 F500
    G4 P500
    G1 Z42 F500
    G4 P500
    
    G1 X77 F1000
    G1 Z50 F500
    G4 P500
    G1 Z42 F500
    G4 P500
    
    G1 X57 F1000
    G1 Z52 F500
    G4 P500
    G1 Z42 F500
    G4 P500
    
    G1 X77 F1000
    G1 Z53 F500
    G4 P500
    G1 Z42 F500
    G4 P500
    
    G1 X57 F1000
    G1 Z55 F500
    G4 P500
    G1 Z42 F500
    G4 P500
    G4 P500
    
    # Retract and finish
    G1 Z100 F1000
    G4 P500
    ENABLE_LINEARACTUATOR_SERVO_L0
    G4 P500
    DISABLE_LINEARACTUATOR_SERVO_L0
    G4 P500
    
    RESPOND MSG="✓ Bayonet eject complete"


# =============================================================================
# DRYPAD OPERATIONS
# =============================================================================

[gcode_macro GET_DRYPAD_POSITION]
description: Calculate drypad position from KEY
variable_current_x: 0
variable_current_y: 0
gcode:
    {% set key = params.KEY|int %}
    {% set drypad = printer["gcode_macro DRYPAD_CONFIG"] %}
    
    {% set row = (key - 1) // drypad.columns %}
    {% set col = (key - 1) % drypad.columns %}
    {% set x_coord = drypad.base_x + (col * drypad.x_spacing) %}
    {% set y_coord = drypad.base_y + (row * drypad.y_spacing) %}
    
    RESPOND MSG="Drypad #{key}: X{x_coord} Y{y_coord} (Row{row} Col{col})"
    SET_GCODE_VARIABLE MACRO=GET_DRYPAD_POSITION VARIABLE=current_x VALUE={x_coord}
    SET_GCODE_VARIABLE MACRO=GET_DRYPAD_POSITION VARIABLE=current_y VALUE={y_coord}


[gcode_macro TOUCH_DRY]
description: Touch drypad using active tip (auto-increment position)
variable_current_position: 1
variable_max_positions: 210
gcode:
    {% set pos = printer["gcode_macro TOUCH_DRY"].current_position %}
    {% set drypad = printer["gcode_macro DRYPAD_CONFIG"] %}
    
    {% set active = printer.save_variables.variables.active_tip|default(0)|int %}
    {% set prefix = "tip" ~ active %}
    {% set sv = printer.save_variables.variables %}
    
    {% set drypad_z = sv[prefix ~ "_drypad_z"]|default(70)|float %}
    {% set drypad_servo = sv[prefix ~ "_drypad_servo"]|default(115)|int %}
    {% set drypad_time = sv[prefix ~ "_drypad_time"]|default(3000)|int %}
    
    # Calculate position
    {% set row = (pos - 1) // drypad.columns %}
    {% set col = (pos - 1) % drypad.columns %}
    {% set x_coord = drypad.base_x + (col * drypad.x_spacing) %}
    {% set y_coord = drypad.base_y + (row * drypad.y_spacing) %}
    
    RESPOND MSG="Touch Dry #{pos} (Tip {active}): X{x_coord} Y{y_coord}"
    
    # Execute
    SET_SERVO SERVO=linearactuator_servo_l0 ANGLE=0
    G4 P1000
    G0 Z110 F1000
    G4 P1500
    G0 X{x_coord} Y{y_coord} F3000
    G4 P1500
    G1 Z{drypad_z} F1000
    G4 P1500
    SET_SERVO SERVO=linearactuator_servo_l0 ANGLE={drypad_servo}
    G4 P{drypad_time}
    SET_SERVO SERVO=linearactuator_servo_l0 ANGLE=0
    G4 P1000
    G91
    G1 Z-5 F1000
    G90
    
    # Increment
    {% set next_pos = pos + 1 %}
    {% if next_pos > printer["gcode_macro TOUCH_DRY"].max_positions %}
        {% set next_pos = 1 %}
    {% endif %}
    
    SET_GCODE_VARIABLE MACRO=TOUCH_DRY VARIABLE=current_position VALUE={next_pos}
    RESPOND MSG="✓ Dry complete. Next: #{next_pos}"


[gcode_macro TOUCH_DRY_AT]
description: Touch specific drypad position - Usage: TOUCH_DRY_AT KEY=15
gcode:
    {% set key = params.KEY|int|default(1) %}
    {% set drypad = printer["gcode_macro DRYPAD_CONFIG"] %}
    
    {% set active = printer.save_variables.variables.active_tip|default(0)|int %}
    {% set prefix = "tip" ~ active %}
    {% set sv = printer.save_variables.variables %}
    
    {% set drypad_z = sv[prefix ~ "_drypad_z"]|default(70)|float %}
    {% set drypad_servo = sv[prefix ~ "_drypad_servo"]|default(115)|int %}
    {% set drypad_time = sv[prefix ~ "_drypad_time"]|default(3000)|int %}
    
    {% set row = (key - 1) // drypad.columns %}
    {% set col = (key - 1) % drypad.columns %}
    {% set x_coord = drypad.base_x + (col * drypad.x_spacing) %}
    {% set y_coord = drypad.base_y + (row * drypad.y_spacing) %}
    
    RESPOND MSG="Touch Dry #{key} (Tip {active}): X{x_coord} Y{y_coord}"
    
    SET_SERVO SERVO=linearactuator_servo_l0 ANGLE=0
    G4 P1000
    G0 Z110 F1000
    G4 P1500
    G0 X{x_coord} Y{y_coord} F3000
    G4 P1500
    G1 Z{drypad_z} F1000
    G4 P1500
    SET_SERVO SERVO=linearactuator_servo_l0 ANGLE={drypad_servo}
    G4 P{drypad_time}
    SET_SERVO SERVO=linearactuator_servo_l0 ANGLE=0
    G4 P1000
    G91
    G1 Z-5 F1000
    G90
    
    RESPOND MSG="✓ Dry complete at #{key}"


# =============================================================================
# HELPER MACROS
# =============================================================================

[gcode_macro CONVERT_OBJECT_COORDS]
description: Convert object editor coords - Usage: CONVERT_OBJECT_COORDS POSX=85 POSY=330 MARGINX=7 MARGINY=5
gcode:
    {% set posx = params.POSX|float %}
    {% set posy = params.POSY|float %}
    {% set marginx = params.MARGINX|float|default(0) %}
    {% set marginy = params.MARGINY|float|default(0) %}
    
    {% set base_x = posx + marginx %}
    {% set base_y = posy + marginy %}
    
    RESPOND MSG="=== Object Editor → Klipper ==="
    RESPOND MSG="Input: pos=({posx}, {posy}), margin=({marginx}, {marginy})"
    RESPOND MSG="Output: base_x={base_x}, base_y={base_y}"