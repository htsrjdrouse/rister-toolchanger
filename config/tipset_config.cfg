# =============================================================================
# TIPSET_CONFIG.CFG - Tip Configuration System Using Persistent Variables
# =============================================================================
# This file defines macros that read from and write to your variables.cfg
# All tip parameters are stored in variables.cfg and can be modified with:
# SAVE_VARIABLE VARIABLE=tip0_drypad_z VALUE=72.5
#
# Your variables.cfg (managed by Klipper) will contain:
# - Toolchanger data (preserved)
# - Tip configuration data (tip0_drypad_z, tip0_wash_x, etc.)
# =============================================================================

# =============================================================================
# DRYPAD CONFIGURATION
# =============================================================================

[gcode_macro DRYPAD_CONFIG]
description: Drypad array configuration
variable_base_x: 87.00          # Starting X position (first element)
variable_base_y: 335.00         # Starting Y position (first element)
variable_columns: 35            # Number of columns
variable_rows: 6                # Number of rows
variable_x_spacing: 4.0         # Spacing between columns (mm)
variable_y_spacing: 4.0         # Spacing between rows (mm)
variable_total_positions: 210   # Total positions (35 * 6)
gcode:
    RESPOND MSG="Drypad: Base({printer['gcode_macro DRYPAD_CONFIG'].base_x}, {printer['gcode_macro DRYPAD_CONFIG'].base_y}), Grid({printer['gcode_macro DRYPAD_CONFIG'].columns}x{printer['gcode_macro DRYPAD_CONFIG'].rows})"


# =============================================================================
# ACTIVE TIP TRACKER
# =============================================================================
# Tracks which tip is currently selected (0, 1, 2, or 3)
# =============================================================================

[gcode_macro ACTIVE_TIP]
description: Currently active tip (stored in variables.cfg)
variable_current_tip: 0  # Default to tip 0
gcode:
    {% set current = printer["gcode_macro ACTIVE_TIP"].current_tip|int %}
    {% set tip_name = "Tip" ~ current %}
    
    RESPOND MSG="=== Active Tip: {tip_name} ({current}) ==="
    SHOW_TIP TIP={current}


# =============================================================================
# INITIALIZE DEFAULT TIP VALUES
# =============================================================================
# Run this once to populate variables.cfg with default tip values
# After this, you can modify values with SAVE_VARIABLE commands
# =============================================================================

