# ===== COLLISION AVOIDANCE SYSTEM =====
# Prevents toolhead crashes with objects defined in the Objects Editor
# Objects are stored in variables.cfg and checked during tool changes

# ===== OBJECT DEFINITIONS MACRO =====
# This macro holds the object data synced from the Objects Editor
# Format: list of dicts with x_min, x_max, y_min, y_max, z_height, name
[gcode_macro COLLISION_OBJECTS]
description: Object definitions for collision avoidance
variable_objects: []
variable_global_clearance: 15  # mm above tallest object in path
variable_enabled: True
variable_safe_z_default: 100  # Default safe Z if no objects defined
gcode:
    # Placeholder - use SET_GCODE_VARIABLE to update

# ===== SYNC OBJECTS FROM VARIABLES.CFG =====
[gcode_macro SYNC_COLLISION_OBJECTS]
description: Load object definitions from save_variables into collision system
gcode:
    {% set svv = printer.save_variables.variables %}
    {% set objects = [] %}
    
    # Check for each known object type in variables
    {% set object_names = ['bed', 'wash', 'waste', 'drypad', 'small_dispenser_box', 'wellplate', 'reservoir'] %}
    
    {% for name in object_names %}
        {% set prefix = 'obj_' ~ name %}
        {% if prefix ~ '_x_min' in svv %}
            {% set obj = {
                'name': name,
                'x_min': svv[prefix ~ '_x_min']|float,
                'x_max': svv[prefix ~ '_x_max']|float,
                'y_min': svv[prefix ~ '_y_min']|float,
                'y_max': svv[prefix ~ '_y_max']|float,
                'z_height': svv[prefix ~ '_z_height']|float,
                'z_clearance': svv[prefix ~ '_z_clearance']|float if prefix ~ '_z_clearance' in svv else 10.0,
                'enabled': svv[prefix ~ '_enabled']|default(true)|lower != 'false'
            } %}
            {% set _ = objects.append(obj) %}
        {% endif %}
    {% endfor %}
    
    SET_GCODE_VARIABLE MACRO=COLLISION_OBJECTS VARIABLE=objects VALUE="{objects}"
    RESPOND MSG="Loaded {objects|length} collision objects"

# ===== CALCULATE SAFE Z FOR TRAVEL =====
[gcode_macro _GET_SAFE_TRAVEL_Z]
description: Calculate safe Z height for travel between two points
gcode:
    {% set start_x = params.START_X|float %}
    {% set start_y = params.START_Y|float %}
    {% set end_x = params.END_X|float %}
    {% set end_y = params.END_Y|float %}
    
    {% set collision_data = printer["gcode_macro COLLISION_OBJECTS"] %}
    {% set objects = collision_data.objects %}
    {% set clearance = collision_data.global_clearance %}
    {% set default_z = collision_data.safe_z_default %}
    
    # Calculate bounding box of travel path
    {% set path_x_min = [start_x, end_x]|min %}
    {% set path_x_max = [start_x, end_x]|max %}
    {% set path_y_min = [start_y, end_y]|min %}
    {% set path_y_max = [start_y, end_y]|max %}
    
    # Find max Z of objects that intersect with travel path
    {% set max_z = 0 %}
    {% set collision_objects = [] %}
    
    {% for obj in objects %}
        {% if obj.enabled|default(true) %}
            # Check if object bounding box intersects with travel path bounding box
            {% set intersects_x = (obj.x_min <= path_x_max) and (obj.x_max >= path_x_min) %}
            {% set intersects_y = (obj.y_min <= path_y_max) and (obj.y_max >= path_y_min) %}
            
            {% if intersects_x and intersects_y %}
                {% set obj_safe_z = obj.z_height + obj.z_clearance|default(10) %}
                {% if obj_safe_z > max_z %}
                    {% set max_z = obj_safe_z %}
                {% endif %}
                {% set _ = collision_objects.append(obj.name) %}
            {% endif %}
        {% endif %}
    {% endfor %}
    
    # Add global clearance
    {% set safe_z = max_z + clearance if max_z > 0 else default_z %}
    
    # Store result in variable for caller to use
    SET_GCODE_VARIABLE MACRO=_SAFE_Z_RESULT VARIABLE=value VALUE={safe_z}
    SET_GCODE_VARIABLE MACRO=_SAFE_Z_RESULT VARIABLE=collision_objects VALUE="'{collision_objects|join(',')}'"
    
    {% if collision_objects|length > 0 %}
        RESPOND MSG="Travel path intersects: {collision_objects|join(', ')} - Safe Z: {safe_z}mm"
    {% endif %}

[gcode_macro _SAFE_Z_RESULT]
description: Stores result from _GET_SAFE_TRAVEL_Z
variable_value: 100
variable_collision_objects: ""
gcode:
    # Placeholder for storing calculation results

# ===== SAFE MOVE MACRO =====
[gcode_macro SAFE_MOVE]
description: Move to position while avoiding collisions with objects
gcode:
    {% set target_x = params.X|float %}
    {% set target_y = params.Y|float %}
    {% set target_z = params.Z|default(none) %}
    {% set feedrate_xy = params.F|default(6000)|int %}
    {% set feedrate_z = params.F_Z|default(1500)|int %}
    {% set force_z_first = params.Z_FIRST|default(1)|int %}  # Lift Z before XY move
    
    {% set collision_data = printer["gcode_macro COLLISION_OBJECTS"] %}
    
    {% if not collision_data.enabled %}
        # Collision avoidance disabled - direct move
        {% if target_z is not none %}
            G1 X{target_x} Y{target_y} Z{target_z} F{feedrate_xy}
        {% else %}
            G1 X{target_x} Y{target_y} F{feedrate_xy}
        {% endif %}
    {% else %}
        # Get current position
        {% set current_x = printer.toolhead.position.x %}
        {% set current_y = printer.toolhead.position.y %}
        {% set current_z = printer.toolhead.position.z %}
        
        # Calculate safe Z for this travel path
        _GET_SAFE_TRAVEL_Z START_X={current_x} START_Y={current_y} END_X={target_x} END_Y={target_y}
        
        {% set safe_z = printer["gcode_macro _SAFE_Z_RESULT"].value %}
        
        # Determine if we need to lift
        {% set need_lift = current_z < safe_z %}
        
        {% if need_lift and force_z_first %}
            # Step 1: Lift Z to safe height
            G1 Z{safe_z} F{feedrate_z}
            M400
        {% endif %}
        
        # Step 2: Move X and Y
        G1 X{target_x} Y{target_y} F{feedrate_xy}
        M400
        
        # Step 3: Lower to target Z if specified
        {% if target_z is not none %}
            G1 Z{target_z} F{feedrate_z}
            M400
        {% endif %}
    {% endif %}

# ===== SAFE MOVE TO DOCK =====
[gcode_macro SAFE_MOVE_TO_DOCK]
description: Safely move to a tool dock position avoiding objects
gcode:
    {% set tool_id = params.TOOL_ID|lower %}
    {% set svv = printer.save_variables.variables %}
    
    {% set dock_x = svv[tool_id ~ '_dock_x']|float %}
    {% set dock_y = svv[tool_id ~ '_dock_y']|float %}
    {% set dock_z = svv[tool_id ~ '_dock_z']|float %}
    
    # Use safe move to get to dock position
    SAFE_MOVE X={dock_x} Y={dock_y - 50} F=6000
    
    # Final approach to dock (short distance, should be clear)
    G1 Y{dock_y} F3000
    M400
    G1 Z{dock_z} F1000
    M400

# ===== UTILITY MACROS =====

[gcode_macro ENABLE_COLLISION_AVOIDANCE]
description: Enable collision avoidance system
gcode:
    SET_GCODE_VARIABLE MACRO=COLLISION_OBJECTS VARIABLE=enabled VALUE=True
    RESPOND MSG="Collision avoidance ENABLED"

[gcode_macro DISABLE_COLLISION_AVOIDANCE]
description: Disable collision avoidance system
gcode:
    SET_GCODE_VARIABLE MACRO=COLLISION_OBJECTS VARIABLE=enabled VALUE=False
    RESPOND MSG="Collision avoidance DISABLED - Be careful!"

[gcode_macro SET_COLLISION_CLEARANCE]
description: Set global clearance height above objects
gcode:
    {% set clearance = params.CLEARANCE|default(15)|float %}
    SET_GCODE_VARIABLE MACRO=COLLISION_OBJECTS VARIABLE=global_clearance VALUE={clearance}
    RESPOND MSG="Collision clearance set to {clearance}mm"

[gcode_macro LIST_COLLISION_OBJECTS]
description: List all configured collision objects
gcode:
    {% set objects = printer["gcode_macro COLLISION_OBJECTS"].objects %}
    
    {% if objects|length == 0 %}
        RESPOND MSG="No collision objects configured. Run SYNC_COLLISION_OBJECTS after adding objects to variables.cfg"
    {% else %}
        RESPOND MSG="=== Collision Objects ({ objects|length }) ==="
        {% for obj in objects %}
            {% set x_min = obj.x_min|round(1) %}
            {% set x_max = obj.x_max|round(1) %}
            {% set y_min = obj.y_min|round(1) %}
            {% set y_max = obj.y_max|round(1) %}
            {% set z_h = obj.z_height|round(1) %}
            {% set z_c = obj.z_clearance|default(10)|round(1) %}
            {% set status = "[ENABLED]" if obj.enabled|default(true) else "[DISABLED]" %}
            RESPOND MSG="{ obj.name } - X[{ x_min }-{ x_max }] Y[{ y_min }-{ y_max }] Z={ z_h }mm (clearance +{ z_c }mm) { status }"
        {% endfor %}
    {% endif %}

[gcode_macro ADD_COLLISION_OBJECT]
description: Manually add a collision object to variables.cfg
gcode:
    {% set name = params.NAME|lower %}
    {% set x_min = params.X_MIN|float %}
    {% set x_max = params.X_MAX|float %}
    {% set y_min = params.Y_MIN|float %}
    {% set y_max = params.Y_MAX|float %}
    {% set z_height = params.Z_HEIGHT|float %}
    {% set z_clearance = params.Z_CLEARANCE|default(10)|float %}
    {% set enabled = params.ENABLED|default('true')|lower %}
    
    SAVE_VARIABLE VARIABLE=obj_{name}_x_min VALUE={x_min}
    SAVE_VARIABLE VARIABLE=obj_{name}_x_max VALUE={x_max}
    SAVE_VARIABLE VARIABLE=obj_{name}_y_min VALUE={y_min}
    SAVE_VARIABLE VARIABLE=obj_{name}_y_max VALUE={y_max}
    SAVE_VARIABLE VARIABLE=obj_{name}_z_height VALUE={z_height}
    SAVE_VARIABLE VARIABLE=obj_{name}_z_clearance VALUE={z_clearance}
    SAVE_VARIABLE VARIABLE=obj_{name}_enabled VALUE="'{enabled}'"
    
    RESPOND MSG="Added collision object '{name}': X[{x_min}-{x_max}] Y[{y_min}-{y_max}] Z={z_height}mm"
    
    # Reload objects
    SYNC_COLLISION_OBJECTS

[gcode_macro REMOVE_COLLISION_OBJECT]
description: Remove a collision object from variables.cfg
gcode:
    {% set name = params.NAME|lower %}
    
    # Note: Klipper doesn't have a way to delete variables, so we just disable it
    SAVE_VARIABLE VARIABLE=obj_{name}_enabled VALUE="'false'"
    
    RESPOND MSG="Disabled collision object '{name}' (restart Klipper to fully remove)"
    SYNC_COLLISION_OBJECTS

[gcode_macro TOGGLE_COLLISION_OBJECT]
description: Enable/disable a specific collision object
gcode:
    {% set name = params.NAME|lower %}
    {% set enable = params.ENABLE|default('toggle')|lower %}
    
    {% set svv = printer.save_variables.variables %}
    {% set prefix = 'obj_' ~ name %}
    
    {% if prefix ~ '_x_min' not in svv %}
        RESPOND MSG="Object '{name}' not found"
    {% else %}
        {% if enable == 'toggle' %}
            {% set current = svv[prefix ~ '_enabled']|default('true')|lower %}
            {% set new_state = 'false' if current == 'true' else 'true' %}
        {% else %}
            {% set new_state = 'true' if enable in ['true', '1', 'yes', 'on'] else 'false' %}
        {% endif %}
        
        SAVE_VARIABLE VARIABLE={prefix}_enabled VALUE="'{new_state}'"
        RESPOND MSG="Object '{name}' {'ENABLED' if new_state == 'true' else 'DISABLED'}"
        SYNC_COLLISION_OBJECTS
    {% endif %}

# ===== AUTO-LOAD ON STARTUP =====
[delayed_gcode _INIT_COLLISION_AVOIDANCE]
initial_duration: 2.0
gcode:
    SYNC_COLLISION_OBJECTS
    RESPOND MSG="Collision avoidance system initialized"

# ===== AUTO-SYNC AFTER HOMING =====
# SYNC_COLLISION_OBJECTS is called from [homing_override] in printer.cfg
# This ensures any changes to variables.cfg are picked up after homing

# ===== SYNC FROM OBJECTS EDITOR (requires gcode_shell_command) =====
# Uncomment if you have gcode_shell_command extension installed
# This allows syncing directly from Klipper console

#[gcode_shell_command sync_objects_from_editor]
#command: python3 ~/printer_data/config/sync_objects.py --config ~/printer_data/config/liquid_handling_config.json --variables ~/printer_data/config/variables.cfg
#timeout: 30.0
#verbose: True

[gcode_macro SYNC_FROM_OBJECTS_EDITOR]
description: Sync collision objects from Objects Editor JSON (run after editing objects)
gcode:
    # Method 1: If you have gcode_shell_command installed, uncomment the section above
    # and use: RUN_SHELL_COMMAND CMD=sync_objects_from_editor
    
    # Method 2: Manual sync workflow
    RESPOND MSG="=== Sync Collision Objects ==="
    RESPOND MSG="1. Run sync_objects.py on your computer or SSH into the printer:"
    RESPOND MSG="   python3 ~/printer_data/config/sync_objects.py"
    RESPOND MSG="2. After sync completes, run: SYNC_COLLISION_OBJECTS"
    RESPOND MSG="3. Verify with: LIST_COLLISION_OBJECTS"
    
    # Reload current objects from variables.cfg
    SYNC_COLLISION_OBJECTS

# ===== QUICK OBJECT PRESETS =====
[gcode_macro ADD_WELLPLATE]
description: Add a standard 96-well plate at specified position
gcode:
    {% set x = params.X|default(100)|float %}
    {% set y = params.Y|default(100)|float %}
    {% set name = params.NAME|default('wellplate')|lower %}
    
    # Standard 96-well plate: ~127.8mm x 85.5mm, ~14mm tall
    {% set width = params.WIDTH|default(127.8)|float %}
    {% set depth = params.DEPTH|default(85.5)|float %}
    {% set height = params.HEIGHT|default(14)|float %}
    
    ADD_COLLISION_OBJECT NAME={name} X_MIN={x} X_MAX={x + width} Y_MIN={y} Y_MAX={y + depth} Z_HEIGHT={height} Z_CLEARANCE=10
    RESPOND MSG="Added wellplate '{name}' at X={x}, Y={y} ({width}x{depth}x{height}mm)"

[gcode_macro ADD_RESERVOIR]
description: Add a reservoir/trough at specified position
gcode:
    {% set x = params.X|default(100)|float %}
    {% set y = params.Y|default(100)|float %}
    {% set name = params.NAME|default('reservoir')|lower %}
    
    # Common reservoir dimensions
    {% set width = params.WIDTH|default(150)|float %}
    {% set depth = params.DEPTH|default(50)|float %}
    {% set height = params.HEIGHT|default(40)|float %}
    
    ADD_COLLISION_OBJECT NAME={name} X_MIN={x} X_MAX={x + width} Y_MIN={y} Y_MAX={y + depth} Z_HEIGHT={height} Z_CLEARANCE=15
    RESPOND MSG="Added reservoir '{name}' at X={x}, Y={y} ({width}x{depth}x{height}mm)"

[gcode_macro ADD_TUBE_RACK]
description: Add a tube rack at specified position
gcode:
    {% set x = params.X|default(100)|float %}
    {% set y = params.Y|default(100)|float %}
    {% set name = params.NAME|default('tube_rack')|lower %}
    
    # Common tube rack dimensions (e.g., 24-position 1.5ml tubes)
    {% set width = params.WIDTH|default(130)|float %}
    {% set depth = params.DEPTH|default(90)|float %}
    {% set height = params.HEIGHT|default(80)|float %}  # Tubes stick up
    
    ADD_COLLISION_OBJECT NAME={name} X_MIN={x} X_MAX={x + width} Y_MIN={y} Y_MAX={y + depth} Z_HEIGHT={height} Z_CLEARANCE=15
    RESPOND MSG="Added tube rack '{name}' at X={x}, Y={y} ({width}x{depth}x{height}mm)"

# ===== DEBUG / TESTING =====
[gcode_macro TEST_COLLISION_PATH]
description: Test collision detection for a path without moving
gcode:
    {% set start_x = params.START_X|default(printer.toolhead.position.x)|float %}
    {% set start_y = params.START_Y|default(printer.toolhead.position.y)|float %}
    {% set end_x = params.END_X|float %}
    {% set end_y = params.END_Y|float %}
    
    RESPOND MSG="Testing path: ({start_x}, {start_y}) -> ({end_x}, {end_y})"
    
    _GET_SAFE_TRAVEL_Z START_X={start_x} START_Y={start_y} END_X={end_x} END_Y={end_y}
    
    {% set result = printer["gcode_macro _SAFE_Z_RESULT"] %}
    RESPOND MSG="Safe Z for this path: {result.value}mm"
    {% if result.collision_objects %}
        RESPOND MSG="Objects in path: {result.collision_objects}"
    {% else %}
        RESPOND MSG="No objects in path"
    {% endif %}
