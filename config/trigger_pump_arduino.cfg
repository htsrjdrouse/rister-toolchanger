# ========================================
# PUMP ARDUINO SERIAL CONNECTION
# Arduino Micro on /dev/ttyACM2
# ========================================

[arduino_serial pump_arduino]
serial_port: /dev/ttyACM2
baud_rate: 115200

# ========================================
# TRIGGER PIN — decoupled pump mode
# Octopus PE5 (FAN header) → Arduino Micro D2
# Falling edge triggers pump (internal pullup)
# VALUE=1 = idle (HIGH via pullup)
# VALUE=0 = trigger (falling edge fires ISR)
#
# Wiring:
#   Octopus FAN header PE5 signal pin → Arduino Micro D2
#   Octopus FAN header GND            → Arduino Micro GND
# ========================================

[output_pin dispense_trigger]
pin: PB1
value: 1
shutdown_value: 1

# ========================================
# LIQUID TOOL CONFIG — variable holder
# Stores active trigger command parameters
# so Klipper always knows what is loaded
# ========================================

[gcode_macro LIQUID_TOOL_CONFIG]
variable_tool_pump_map: {'l0': 0}
variable_active_dispenser: -1
variable_active_pump: -1
variable_trigger_vol: 0.0
variable_trigger_rate: 4000
variable_trigger_delay: 50
variable_trigger_armed: 0
gcode:
    # Variable holder only

# ========================================
# PUMP STATE COMMANDS
# ========================================

[gcode_macro PUMP_STATUS]
description: Query pump Arduino state and show stored Klipper params
gcode:
    {% set cfg = printer["gcode_macro LIQUID_TOOL_CONFIG"] %}
    RESPOND MSG="=== Pump Klipper State ==="
    RESPOND MSG="Trigger armed:  {cfg.trigger_armed}"
    RESPOND MSG="Stored vol:     {cfg.trigger_vol} uL"
    RESPOND MSG="Stored rate:    F{cfg.trigger_rate}"
    RESPOND MSG="Stored delay:   {cfg.trigger_delay} ms"
    RESPOND MSG="=== Pump Arduino State ==="
    SEND_PUMP_ARDUINO COMMAND="P114"

[gcode_macro PUMP_ESTOP]
description: Emergency stop pump only
gcode:
    SET_PIN PIN=dispense_trigger VALUE=1
    SEND_PUMP_ARDUINO COMMAND="P0"
    SET_GCODE_VARIABLE MACRO=LIQUID_TOOL_CONFIG VARIABLE=trigger_armed VALUE=0
    RESPOND MSG="PUMP ESTOP — send PUMP_RESET to recover"

[gcode_macro PUMP_RESET]
description: Clear pump estop
gcode:
    SEND_PUMP_ARDUINO COMMAND="P999"
    RESPOND MSG="Pump estop cleared"

[gcode_macro PUMP_MOTOR_ON]
description: Enable pump stepper — holds position, current flows
gcode:
    SEND_PUMP_ARDUINO COMMAND="MOTORON"
    RESPOND MSG="Pump motor enabled"

[gcode_macro PUMP_MOTOR_OFF]
description: Disable pump stepper — no current, no heat
gcode:
    SEND_PUMP_ARDUINO COMMAND="MOTOROFF"
    RESPOND MSG="Pump motor disabled"


# ========================================
# TRIGGER PIN CONTROL
# ========================================

[gcode_macro TRIGGER_FIRE]
description: This generates a pulse for triggering the dispenser
gcode:
    PUMP_TRIGGER_ON
    G4 P500
    PUMP_TRIGGER_OFF

[gcode_macro PUMP_TRIGGER_ON]
description: Trigger pump via pin (falling edge)
gcode:
    SET_PIN PIN=dispense_trigger VALUE=0

[gcode_macro PUMP_TRIGGER_OFF]
description: Release trigger pin back to idle
gcode:
    SET_PIN PIN=dispense_trigger VALUE=1

