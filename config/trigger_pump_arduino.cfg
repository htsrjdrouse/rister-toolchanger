# ========================================
# PUMP ARDUINO SERIAL CONNECTION
# Arduino Micro on /dev/ttyACM2
# ========================================

[arduino_serial pump_arduino]
serial_port: /dev/ttyPUMP
baud_rate: 115200


# ========================================
# TRIGGER PIN — decoupled pump mode
# Octopus PE5 (FAN header) → Arduino Micro D2
# Falling edge triggers pump (internal pullup)
# VALUE=1 = idle (HIGH via pullup)
# VALUE=0 = trigger (falling edge fires ISR)
#
# Wiring:
#   Octopus FAN header PE5 signal pin → Arduino Micro D2
#   Octopus FAN header GND            → Arduino Micro GND
# ========================================

[output_pin dispense_trigger]
pin: PE5
value: 1
shutdown_value: 1

# ========================================
# LIQUID TOOL CONFIG — variable holder
# Stores active trigger command parameters
# so Klipper always knows what is loaded
# ========================================

[gcode_macro LIQUID_TOOL_CONFIG]
variable_tool_pump_map: {'l0': 0}
variable_active_dispenser: -1
variable_active_pump: -1
variable_trigger_vol: 0.0
variable_trigger_rate: 4000
variable_trigger_delay: 50
variable_trigger_armed: 0
gcode:
    # Variable holder only

# ========================================
# PUMP STATE COMMANDS
# ========================================

[gcode_macro PUMP_STATUS]
description: Query pump Arduino state and show stored Klipper params
gcode:
    {% set cfg = printer["gcode_macro LIQUID_TOOL_CONFIG"] %}
    RESPOND MSG="=== Pump Klipper State ==="
    RESPOND MSG="Trigger armed:  {cfg.trigger_armed}"
    RESPOND MSG="Stored vol:     {cfg.trigger_vol} uL"
    RESPOND MSG="Stored rate:    F{cfg.trigger_rate}"
    RESPOND MSG="Stored delay:   {cfg.trigger_delay} ms"
    RESPOND MSG="=== Pump Arduino State ==="
    SEND_PUMP_ARDUINO COMMAND="P114"

[gcode_macro PUMP_ESTOP]
description: Emergency stop pump only
gcode:
    SET_PIN PIN=dispense_trigger VALUE=1
    SEND_PUMP_ARDUINO COMMAND="P0"
    SET_GCODE_VARIABLE MACRO=LIQUID_TOOL_CONFIG VARIABLE=trigger_armed VALUE=0
    RESPOND MSG="PUMP ESTOP — send PUMP_RESET to recover"

[gcode_macro PUMP_RESET]
description: Clear pump estop
gcode:
    SEND_PUMP_ARDUINO COMMAND="P999"
    RESPOND MSG="Pump estop cleared"

# ========================================
# CORE PUMP COMMANDS
# ========================================

[gcode_macro PUMP_ASPIRATE]
description: Aspirate N uL — PUMP_ASPIRATE VOL=50 RATE=2000
gcode:
    {% set vol  = params.VOL|default(10)|float %}
    {% set rate = params.RATE|default(2000)|int %}
    RESPOND MSG="Aspirating {vol} uL at F{rate}"
    SEND_PUMP_ARDUINO COMMAND="A1 E{vol} F{rate}"

[gcode_macro PUMP_DISPENSE]
description: Dispense N uL immediately — PUMP_DISPENSE VOL=5 RATE=4000
gcode:
    {% set vol  = params.VOL|default(5)|float %}
    {% set rate = params.RATE|default(4000)|int %}
    RESPOND MSG="Dispensing {vol} uL at F{rate}"
    SEND_PUMP_ARDUINO COMMAND="D1 E{vol} F{rate}"

[gcode_macro PUMP_SET_TRIGGER_RATE]
description: Set triggered flow rate — PUMP_SET_TRIGGER_RATE RATE=4000
gcode:
    {% set rate = params.RATE|default(4000)|int %}
    SEND_PUMP_ARDUINO COMMAND="T1 F{rate}"
    SET_GCODE_VARIABLE MACRO=LIQUID_TOOL_CONFIG VARIABLE=trigger_rate VALUE={rate}
    RESPOND MSG="Pump trigger rate set to F{rate}"

[gcode_macro PUMP_SET_TRIGGER_DELAY]
description: Set trigger delay ms — PUMP_SET_TRIGGER_DELAY MS=50
gcode:
    {% set ms = params.MS|default(50)|int %}
    SEND_PUMP_ARDUINO COMMAND="TD {ms}"
    SET_GCODE_VARIABLE MACRO=LIQUID_TOOL_CONFIG VARIABLE=trigger_delay VALUE={ms}
    RESPOND MSG="Pump trigger delay set to {ms} ms"

# ========================================
# LOAD TRIGGER COMMAND
# Stores vol + rate in Klipper variables AND
# sends D1 command to Arduino
# Call this before or after PUMP_TRIGGERON
# Can be called mid-run to update parameters
# ========================================

[gcode_macro PUMP_LOAD_TRIGGER]
description: Load dispense command for triggered mode — PUMP_LOAD_TRIGGER VOL=5 RATE=4000
gcode:
    {% set vol  = params.VOL|default(5)|float %}
    {% set rate = params.RATE|default(4000)|int %}
    SET_GCODE_VARIABLE MACRO=LIQUID_TOOL_CONFIG VARIABLE=trigger_vol VALUE={vol}
    SET_GCODE_VARIABLE MACRO=LIQUID_TOOL_CONFIG VARIABLE=trigger_rate VALUE={rate}
    SEND_PUMP_ARDUINO COMMAND="D1 E{vol} F{rate}"
    RESPOND MSG="Trigger command loaded: D1 E{vol} F{rate}"

# ========================================
# TRIGGER PIN CONTROL
# ========================================

[gcode_macro PUMP_TRIGGER_ON]
description: Trigger pump via pin (falling edge)
gcode:
    SET_PIN PIN=dispense_trigger VALUE=0

[gcode_macro PUMP_TRIGGER_OFF]
description: Release trigger pin back to idle
gcode:
    SET_PIN PIN=dispense_trigger VALUE=1

# ========================================
# COMPOUND MACROS
# ========================================

[gcode_macro PUMP_SETUP]
description: Configure pump rate and delay — PUMP_SETUP RATE=4000 DELAY=50
gcode:
    {% set rate  = params.RATE|default(4000)|int %}
    {% set delay = params.DELAY|default(50)|int %}
    PUMP_SET_TRIGGER_RATE RATE={rate}
    G4 P200
    PUMP_SET_TRIGGER_DELAY MS={delay}
    G4 P200
    SET_PIN PIN=dispense_trigger VALUE=1
    RESPOND MSG="Pump ready — F{rate}, delay {delay}ms"

[gcode_macro PUMP_PRIME]
description: Aspirate then prime tip — PUMP_PRIME FILL=50 PRIME=3
gcode:
    {% set fill  = params.FILL|default(50)|float %}
    {% set prime = params.PRIME|default(3)|float %}
    PUMP_ASPIRATE VOL={fill} RATE=2000
    G4 P500
    PUMP_DISPENSE VOL={prime} RATE=1000
    RESPOND MSG="Pump primed — {fill}uL aspirated, {prime}uL primed"

[gcode_macro PUMP_RETRACT]
description: Retract to break meniscus — PUMP_RETRACT VOL=2
gcode:
    {% set vol = params.VOL|default(2)|float %}
    PUMP_ASPIRATE VOL={vol} RATE=1000
    RESPOND MSG="Retracted {vol}uL"

[gcode_macro PUMP_TRIGGERON]
description: Arm trigger — PUMP_TRIGGERON VOL=5 RATE=4000 DELAY=50
gcode:
    {% set vol   = params.VOL|default(printer["gcode_macro LIQUID_TOOL_CONFIG"].trigger_vol)|float %}
    {% set rate  = params.RATE|default(printer["gcode_macro LIQUID_TOOL_CONFIG"].trigger_rate)|int %}
    {% set delay = params.DELAY|default(printer["gcode_macro LIQUID_TOOL_CONFIG"].trigger_delay)|int %}
    PUMP_SET_TRIGGER_DELAY MS={delay}
    G4 P100
    SEND_PUMP_ARDUINO COMMAND="TRIGGERON"
    G4 P100
    PUMP_LOAD_TRIGGER VOL={vol} RATE={rate}
    SET_GCODE_VARIABLE MACRO=LIQUID_TOOL_CONFIG VARIABLE=trigger_armed VALUE=1
    RESPOND MSG="Trigger armed — D1 E{vol} F{rate} delay {delay}ms"

[gcode_macro PUMP_TRIGGEROFF]
description: Disarm trigger
gcode:
    SEND_PUMP_ARDUINO COMMAND="TRIGGEROFF"
    SET_PIN PIN=dispense_trigger VALUE=1
    SET_GCODE_VARIABLE MACRO=LIQUID_TOOL_CONFIG VARIABLE=trigger_armed VALUE=0
    RESPOND MSG="Trigger disarmed"

[gcode_macro DISPENSE_LINE_DECOUPLED]
description: XY move with decoupled pump — DISPENSE_LINE_DECOUPLED X=135 Y=65 XY_RATE=10000
gcode:
    {% set x       = params.X|float %}
    {% set y       = params.Y|float %}
    {% set xy_rate = params.XY_RATE|default(10000)|int %}
    PUMP_TRIGGER_ON
    G1 X{x} Y{y} F{xy_rate}
    PUMP_TRIGGER_OFF

# ========================================
# UPDATE TRIGGER COMMAND MID-RUN
# Call this between lines to change
# vol or rate without disarming trigger
# ========================================

[gcode_macro PUMP_UPDATE_TRIGGER]
description: Update trigger command mid-run — PUMP_UPDATE_TRIGGER VOL=3 RATE=4000
gcode:
    {% set vol  = params.VOL|default(printer["gcode_macro LIQUID_TOOL_CONFIG"].trigger_vol)|float %}
    {% set rate = params.RATE|default(printer["gcode_macro LIQUID_TOOL_CONFIG"].trigger_rate)|int %}
    PUMP_LOAD_TRIGGER VOL={vol} RATE={rate}
    RESPOND MSG="Trigger command updated: D1 E{vol} F{rate}"
