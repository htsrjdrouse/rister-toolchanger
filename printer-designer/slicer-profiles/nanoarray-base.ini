# PrusaSlicer config for nanoarray / liquid dispensing
# Optimized for thin film deposition (perovskite solar arrays)

[print:Nanoarray Base]
layer_height = 0.05
first_layer_height = 0.05
perimeters = 1
top_solid_layers = 0
bottom_solid_layers = 1
fill_density = 0%
perimeter_speed = 5
first_layer_speed = 3
travel_speed = 50
infill_speed = 5
external_perimeter_speed = 5
extrusion_width = 0.1
first_layer_extrusion_width = 0.1
perimeter_extrusion_width = 0.1
external_perimeter_extrusion_width = 0.1

# Retraction settings for liquid dispenser
retract_length = 0
retract_speed = 0
retract_lift = 0

# Skirt/brim
skirts = 0
brim_width = 0

# Support
support_material = 0

# Sequential printing for multiple objects
complete_objects = 0

[printer:Rister Dispenser]
bed_shape = 0x0,100x0,100x100,0x100
printer_model = 
gcode_flavor = klipper
start_gcode = ; Nanoarray print start\nG28 ; Home\nG1 Z5 F300\n
end_gcode = ; Nanoarray print end\nG1 Z10 F300\nG28 X Y\n
before_layer_gcode = 
layer_gcode = 
toolchange_gcode = 
use_relative_e_distances = 1
machine_max_feedrate_x = 100
machine_max_feedrate_y = 100
machine_max_feedrate_z = 20
nozzle_diameter = 0.1

[filament:Liquid Ink]
filament_diameter = 1.75
extrusion_multiplier = 1
temperature = 0
bed_temperature = 0
